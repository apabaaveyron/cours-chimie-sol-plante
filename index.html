<h3>Les essais de la séance 8 en ont déjà confirmé un morceau</h3>
<p>Un morceau de cette théorie est bien établi. Trop d'azote fait monter les acides aminés libres dans la sève, et les pucerons s'y multiplient mieux, on l'a vu à la séance 8 avec les essais du CTIFL et de l'INRAE. Plus largement, la nutrition minérale change la sensibilité des plantes à beaucoup de maladies, et le sujet a même son ouvrage de référence. L'effet change d'un élément à l'autre et d'une maladie à l'autre, mais il existe.</p>
<p>La partie sur les pesticides n'a pas été démontrée de façon générale. Chaboussou partait de cas réels, des ravageurs qui pullulent après certains traitements. Mais ces pullulations s'expliquent souvent autrement, par exemple quand le traitement a tué les auxiliaires qui mangeaient le ravageur.</p>

<h3>La nutriprotection vise une plante nourrie comme il faut, sans excès</h3>
<p>En dehors de ses livres, le texte le plus détaillé sur la nutriprotection de Bucaille est la présentation de son livre suivant, <i>Agriculture et biomimétisme</i>. Guilhem Bourrié, membre de l'Académie d'agriculture, l'a écrite en juin 2026. On y trouve trois leviers.</p>
<ul>
  <li><b>Assez de chaque élément, <span class="t" data-t="oligo">oligo-éléments</span> compris.</b> Bucaille insiste sur les oligo-éléments, surtout pour avoir moins besoin de fongicides. Guilhem Bourrié rapproche ce point des travaux de Christian Juste à Bordeaux et de Marcel Coppenet à Quimper, dans les années 1970.</li>
  <li><b>Pas d'excès.</b> Bucaille prévient que trop d'oligo-éléments peut favoriser certains pathogènes, et il résume : « toujours plus n'est pas mieux ».</li>
  <li><b>Le bon pH, et un sol bien aéré.</b> Pour lui, ce que la racine peut prendre dépend d'abord du pH et du potentiel d'oxydoréduction, c'est-à-dire, en gros, de l'air du sol. Dans une terre gorgée d'eau, des microbes font gagner des électrons au fer et au manganèse, qui changent de forme et deviennent plus solubles.</li>
</ul>
<p>Ses tableaux, qui montrent l'effet de chaque élément sur les maladies des cultures, sont dans ses livres.</p>

<h2><span class="partie-num">Partie 3 sur 4</span>Que mesure un réfractomètre ?</h2>
<p>Chez les praticiens de la nutriprotection et de la méthode Albrecht, un petit outil revient souvent, le réfractomètre. Il donne un chiffre, le <span class="t" data-t="brix">Brix</span>, qu'on présente parfois comme une mesure de la santé de la plante.</p>

<h3>Le réfractomètre mesure ce qui est dissous dans un jus</h3>
<p>Un rayon de lumière est dévié quand il passe de l'air dans un liquide, et il l'est d'autant plus que le liquide est chargé de matières dissoutes. Le réfractomètre mesure cette déviation. Tu poses une goutte de jus sur un prisme, tu regardes vers la lumière, et tu lis une ligne entre une zone claire et une zone sombre sur une échelle graduée.</p>
<p>Un degré Brix, c'est 1 g de sucre pour 100 g de liquide. Dans un jus de plante, l'appareil prend toutes les matières dissoutes pour du sucre. C'est surtout du sucre fabriqué par la <span class="t" data-t="photosynthese">photosynthèse</span>, mais aussi des acides, des acides aminés et des ions.</p>

<h3>Il suffit de presser une feuille et de regarder où tombe la ligne</h3>
<p>On écrase quelques feuilles dans un presse-ail et on dépose deux ou trois gouttes de jus sur le prisme. Avant, on vérifie avec de l'eau distillée que l'appareil indique bien zéro.</p>

<h3>Le chiffre bouge avec l'heure, l'eau, la variété et la feuille</h3>
<p>Le Brix d'une feuille n'est pas un chiffre fixe. Il monte dans la journée, quand la feuille fabrique des sucres, et il baisse la nuit, quand elle les envoie dans le phloème (séance 6). Une plante qui manque d'eau a une sève plus concentrée, donc un Brix plus haut, alors qu'elle souffre. Il change aussi d'une variété à l'autre, d'une jeune feuille à une vieille, et entre un temps ensoleillé et un temps couvert.</p>
<p>Pour comparer deux planches, il faut donc la même variété, la même feuille, la même heure et le même temps. Sur un fruit, en revanche, le Brix est un bon repère de maturité et de goût, celui qui sert à décider de la date des vendanges.</p>

<h3>L'idée d'un Brix qui repousse les insectes date des années 1960</h3>
<p>Dans les années 1960 et 1970, un Américain, Carey Reams, affirme que plus un fruit a de Brix, meilleur il est pour la santé. L'entomologiste Phil Callahan relie ensuite cette idée aux insectes, qui sauraient reconnaître les plantes saines. Aujourd'hui, certains conseillers avancent des seuils. Au-delà de 12 Brix, les insectes ne se nourriraient plus, et le puceron renoncerait dès 8 environ. Ces seuils changent d'un auteur à l'autre.</p>
<p>La recherche ne les confirme pas. En 2026, un agronome de l'université de l'État de Washington a passé en revue ce qui a été publié, et n'a trouvé aucune étude qui aille dans leur sens. Dans huit vignobles de Californie suivis pendant deux ans, rien n'a montré que le Brix des feuilles éloignait les cicadelles. Sur le sorgho, il ne permettait pas de savoir quelles plantes résisteraient au puceron de la canne à sucre. Et au laboratoire, des pucerons du pois se sont nourris de liquides allant de 6,7 à 30,4 Brix, bien au-dessus des seuils annoncés.</p>

<h2><span class="partie-num">Partie 4 sur 4</span>Qu'est-ce qui est prouvé, et qu'est-ce qui reste à prouver ?</h2>
<p>Ces approches mêlent des idées très solides et d'autres qui n'ont pas résisté aux essais. Ça n'enlève rien au sérieux de ceux qui les pratiquent, mais il faut trier, idée par idée.</p>

<h3>Plusieurs idées tiennent très bien</h3>
<ul>
  <li><b>Trop d'azote favorise les pucerons et certaines maladies.</b> C'est démontré (séance 8).</li>
  <li><b>La nutrition change la santé de la plante.</b> Il faut assez de chaque élément, et c'est celui qui manque le plus qui limite la culture (séance 1).</li>
  <li><b>Un élément en trop peut empêcher la racine de prendre assez d'un autre.</b> C'est l'<span class="t" data-t="antagonisme">antagonisme</span> de la séance 10. Le guide anglais de la fertilisation, le RB209, conseille par exemple de ne pas dépasser 3 de potassium pour 1 de magnésium dans le sol sous les arbres fruitiers et la vigne. Et en Virginie, un essai dans des fermes de légumes a relevé que l'excès de potassium est fréquent en maraîchage intensif, bio ou non, souvent à cause des apports achetés.</li>
  <li><b>Une terre acide a besoin d'être chaulée.</b> Le calcium est indispensable, et le <span class="t" data-t="chaulage">chaulage</span> corrige l'acidité (séance 2).</li>
</ul>

<h3>Le rapport idéal entre les cations n'a pas été confirmé</h3>
<p>En 2007, deux chercheurs australiens, Peter Kopittke et Neal Menzies, ont passé en revue les essais publiés sur la méthode. Leur conclusion est nette. Dans les sols courants, les plantes poussent bien avec des rapports très différents entre calcium, magnésium et potassium, pourvu qu'aucun des trois ne manque. La fertilité du sol ne dépend en général pas de ces rapports.</p>
<p>D'autres résultats vont dans le même sens. Le sol « idéal » de Bear reposait sur très peu de données, tirées d'une terre du New Jersey. Dans l'essai de Virginie, l'apport de calcium a bien rapproché les sols de la cible d'Albrecht, mais il n'a ni amélioré la structure ni cassé la semelle de labour. Et le Brix des légumes ne changeait pas avec le rapport des cations.</p>
<p>Sur la structure, c'est plus nuancé. À pH égal, la plupart des essais trouvent une bonne structure sur une large gamme de rapports Ca/Mg. Mais dans certains sols du Midwest américain, beaucoup de magnésium rendait la surface plus sensible à la battance, la croûte qui se forme sous la pluie.</p>

<h3>L'approche reste populaire, et elle a ses raisons</h3>
<p>Aux États-Unis, plus de la moitié des producteurs de maïs bio interrogés dans quatre États disent utiliser cette méthode, que les universités ne recommandent pas. En 2021, une équipe de l'université d'État de l'Ohio a cherché pourquoi. La plupart des praticiens s'en servent en plus des grilles habituelles, pas à leur place. Et dans beaucoup de sols, corriger l'acidité suffit à rapprocher les parts de calcium et de magnésium de la cible d'Albrecht. L'agriculteur qui chaule une terre acide sur le conseil d'un labo Kinsey en voit donc souvent l'effet, mais cet effet vient surtout du pH.</p>
<p>Pour toi, conseiller, il y a beaucoup à garder. L'approche pousse à lire toute l'analyse, pH, CEC, chaque cation et matière organique, plutôt que l'azote, le phosphore et le potassium seuls. Elle met en garde contre l'excès d'azote et de potasse, et elle fait attention au calcium et à la vie du sol. Ce qui ne tient pas, c'est de payer un amendement pour atteindre un chiffre idéal sur une terre où rien ne manque et où le pH est bon.</p>

<p class="surtitre">Séance 12 · Les calculs</p>
<h1>Comment lire un sac d'engrais et calculer une dose ?</h1>
<p class="chapo">Les trois chiffres d'un sac donnent, en pour cent, l'azote, le phosphore et la potasse qu'il contient. Les deux derniers s'écrivent encore comme au XIX<sup>e</sup> siècle. Avec les masses de quelques atomes et des règles de trois, tu passes d'une forme à l'autre, puis d'un besoin en kilos par hectare à des grammes par mètre carré de planche. Ce n'est pas plus compliqué que d'adapter une recette au nombre de convives.</p>

<!-- Partie 1 -->
<h2><span class="partie-num">Partie 1 sur 4</span>Que veulent dire les trois chiffres d'un sac ?</h2>
<p>Prends un sac de 25 kg d'engrais organique marqué 6-3-12. Les chiffres sont inventés pour l'exemple, mais ils se lisent comme sur n'importe quel sac.</p>

<h3>Les trois chiffres sont toujours dans le même ordre</h3>
<p>Le premier chiffre, c'est l'azote, noté N. Le deuxième, c'est le phosphore, écrit P₂O₅. Le troisième, c'est la potasse, c'est-à-dire le potassium écrit K₂O. Chacun est un pourcentage de la masse du produit, tel qu'il est vendu.</p>
<p>Un 6-3-12 contient donc 6 % d'azote, 3 % de P₂O₅ et 12 % de K₂O. Un quatrième chiffre apparaît parfois, pour le magnésium écrit MgO ou le soufre écrit SO₃, avec son nom à côté.</p>
<table>
  <thead><tr><th>Sur le sac</th><th>Ce que ça veut dire</th><th>Dans 25 kg</th></tr></thead>
  <tbody>
    <tr><td class="symb">6</td><td>6 % d'azote (N)</td><td>1,5 kg</td></tr>
    <tr><td class="symb">3</td><td>3 % de P₂O₅</td><td>0,75 kg</td></tr>
    <tr><td class="symb">12</td><td>12 % de K₂O</td><td>3 kg</td></tr>
  </tbody>
</table>
<p>Le reste, plus des trois quarts du sac, c'est de la matière organique, un peu d'eau et d'autres éléments. Pour un fumier ou un compost, on donne plutôt des kilos par tonne de produit brut. Un compost à 7 kg d'azote par tonne, c'est un compost à 0,7 %.</p>

<h3>Une unité, c'est un kilo</h3>
<p>Les techniciens parlent en <span class="t" data-t="unite-fertilisante">unités</span>. Une unité, c'est un kilo d'azote, ou un kilo de P₂O₅, ou un kilo de K₂O. Quand on dit « 100 unités d'azote », on sous-entend presque toujours par hectare, donc 100 kg d'azote par hectare.</p>
<p>Pour apporter 60 unités d'azote avec ce sac, il faut 60 ÷ 0,06 = 1 000 kg de produit par hectare, soit 40 sacs. Tu apportes en même temps 30 unités de P₂O₅ et 120 unités de K₂O, que tu le veuilles ou non. Un engrais ne se choisit donc pas sur son seul premier chiffre.</p>
<div class="equation">dose de produit = unités voulues ÷ teneur<small>Avec la teneur écrite en décimal : 6 % s'écrit 0,06.</small></div>

<h3>Le sac donne l'azote total, pas celui que la plante prendra</h3>
<p>Sur un engrais organique, le premier chiffre donne tout l'azote du produit. Mais cet azote est enfermé dans de la matière organique, et les microbes doivent le minéraliser avant que la racine le prenne (séance 1). Une partie seulement le sera la première année. C'est l'<span class="t" data-t="azote-efficace">azote efficace</span> de la séance 5, et c'est lui qui sert dans le calcul de la partie 4.</p>

<!-- Partie 2 -->
<h2><span class="partie-num">Partie 2 sur 4</span>Pourquoi écrit-on P₂O₅ et K₂O, et pas P et K ?</h2>
<p>Dans le sac, il n'y a pas de P₂O₅ ni de K₂O. Le phosphore y est sous forme de phosphates, le potassium sous forme de sels, comme le sulfate de potasse. Et la racine prend des ions phosphate et des ions K⁺, pas des <span class="t" data-t="oxyde">oxydes</span>.</p>

<h3>C'est une habitude des chimistes du XIX<sup>e</sup> siècle</h3>
<p>Au XIX<sup>e</sup> siècle, pour savoir ce que contenaient un engrais ou une plante, les chimistes en brûlaient un échantillon et analysaient ce qui restait. Après le feu, chaque élément restait accroché à de l'oxygène, ou du moins c'est ainsi qu'ils se le représentaient. Ils donnaient donc leurs résultats en oxydes. L'habitude a traversé le temps. La réglementation des engrais l'a gardée, les labos d'analyse de terre aussi, et on écrit encore le calcium en CaO, le magnésium en MgO et le soufre en SO₃.</p>
<p>Ce n'est pas grave, à une condition. Il faut savoir passer d'une écriture à l'autre, parce que certains documents donnent l'élément seul, P ou K. C'est souvent le cas des labos anglo-saxons, des analyses de feuilles et des besoins des plantes dans les livres de physiologie.</p>

<h3>Chaque atome a sa masse</h3>
<p>Pour convertir, il faut savoir ce que pèse chaque atome. On compare chaque atome à l'hydrogène, le plus léger, et le chiffre qu'on obtient s'appelle la <span class="t" data-t="masse-atomique">masse atomique</span>. Un atome d'azote pèse 14 fois un atome d'hydrogène, un atome d'oxygène 16 fois. Voici les masses arrondies dont on a besoin.</p>
<table>
  <thead><tr><th>Élément</th><th>Masse</th><th>Élément</th><th>Masse</th></tr></thead>
  <tbody>
    <tr><td>H, hydrogène</td><td>1</td><td>P, phosphore</td><td>31</td></tr>
    <tr><td>C, carbone</td><td>12</td><td>S, soufre</td><td>32</td></tr>
    <tr><td>N, azote</td><td>14</td><td>K, potassium</td><td>39</td></tr>
    <tr><td>O, oxygène</td><td>16</td><td>Ca, calcium</td><td>40</td></tr>
    <tr><td>Mg, magnésium</td><td>24</td><td>Na, sodium</td><td>23</td></tr>
  </tbody>
</table>

<h3>La part du phosphore dans le P₂O₅ se calcule pas à pas</h3>
<p>Une molécule de P₂O₅ contient 2 atomes de phosphore et 5 atomes d'oxygène. Les 2 phosphores pèsent 2 × 31 = 62. Les 5 oxygènes pèsent 5 × 16 = 80. La molécule entière pèse donc 62 + 80 = 142.</p>
<p>Sur ces 142, le phosphore en fait 62. Sa part est donc 62 ÷ 142 = 0,436. Autrement dit, dans 1 kg de P₂O₅, il y a 436 g de phosphore, et les 564 g qui restent, c'est de l'oxygène qui n'existe que sur le papier.</p>
<div class="equation">P₂O₅ = 2 × 31 + 5 × 16 = 142<small>Part du phosphore : 62 ÷ 142 = 0,436. Donc P = P₂O₅ × 0,436.</small></div>
<p>Pour le potassium, c'est le même calcul. K₂O pèse 2 × 39 + 16 = 94, dont 78 de potassium. La part du potassium est 78 ÷ 94 = 0,83.</p>

<!-- Partie 3 -->
<h2><span class="partie-num">Partie 3 sur 4</span>Comment passer d'un chiffre de nitrate à un chiffre d'azote ?</h2>
<p>Le fil rouge de ce cours, c'est l'azote, et l'azote se mesure souvent sous forme de nitrate. Un reliquat d'azote fait par un labo, une bandelette, un appareil de poche pour le <span class="t" data-t="jus-petiole">jus de pétiole</span> (séance 8) ou une analyse d'eau donnent leur résultat tantôt en nitrate, tantôt en azote. Le bilan, lui, se fait en azote.</p>

<h3>Le nitrate pèse 4,4 fois plus que son azote</h3>
<p>L'ion nitrate, NO₃⁻, contient un atome d'azote et trois atomes d'oxygène. Il pèse 14 + 3 × 16 = 62, dont 14 d'azote. La part de l'azote est donc 14 ÷ 62 = 0,226.</p>
<div class="equation">N = NO₃⁻ × 0,226<small>Et dans l'autre sens, NO₃⁻ = N × 4,43.</small></div>

</svg>
<figcaption>Quand on pèse du nitrate, plus des trois quarts de la masse sont de l'oxygène. Seul le quart qui reste est de l'azote utile au bilan.</figcaption>
</figure>

<h3>Une unité mal lue, et tu te trompes d'un facteur 4,4</h3>
<p>Sur un bulletin, regarde toujours l'unité. « NO₃⁻ » ou « nitrates » veut dire que c'est l'ion entier qui est pesé. « N-NO₃ » ou « azote nitrique » veut dire que c'est seulement l'azote du nitrate, déjà prêt pour le bilan. Pour un appareil de poche, c'est la notice qu'il faut lire.</p>
<p>Prends un forage dont l'eau contient 50 mg de nitrate par litre, la limite de l'eau potable. Ça fait 50 × 0,226 = 11,3 mg d'azote par litre. Un millimètre d'arrosage, c'est un litre par mètre carré, donc 10 000 litres par hectare. Avec 200 mm d'arrosage sur une saison de tomates sous abri, tu apportes 2 millions de litres par hectare, et avec eux 22,6 kg d'azote. Si tu prenais le nitrate pour de l'azote, tu croirais en apporter 100 kg.</p>

<h3>Un milliéquivalent ne pèse pas pareil d'un ion à l'autre</h3>
<p>À la séance 3, les cations de la CEC étaient donnés en <span class="t" data-t="meq">milliéquivalents</span> pour 100 g de terre. Un milliéquivalent est une quantité de charges, pas un poids. Pour retrouver un poids, on regarde combien de charges porte chaque ion.</p>
<ul>
  <li>K⁺ porte une charge. Un milliéquivalent de potassium pèse donc sa masse en milligrammes, 39 mg.</li>
  <li>Ca²⁺ porte deux charges. Un milliéquivalent de calcium ne pèse que la moitié de sa masse, 40 ÷ 2 = 20 mg.</li>
  <li>Mg²⁺ aussi. Un milliéquivalent de magnésium pèse 24 ÷ 2 = 12 mg.</li>
</ul>
<p>Une terre à 1 meq de potassium pour 100 g en contient donc 39 mg pour 100 g, soit 390 mg par kilo. En K₂O, ça fait 390 × 1,2 ≈ 470 mg par kilo, le chiffre que donnerait un labo français.</p>

<h3>Un hectare de terre sur 30 cm pèse environ 4 000 tonnes</h3>
<p>Pour passer des milligrammes par kilo de terre aux kilos par hectare, il faut connaître le poids de la terre. Un hectare sur 30 cm de profondeur, c'est 10 000 m² × 0,3 m = 3 000 m³ de terre. Un mètre cube de terre en place pèse environ 1,3 tonne, c'est sa <span class="t" data-t="densite-apparente">densité apparente</span>. Ça donne à peu près 4 000 tonnes, et c'est le chiffre qu'on prend d'habitude.</p>
<p>D'où une règle très pratique. Sur 30 cm, 1 mg par kilo de terre fait 4 kg par hectare. Les 470 mg de K₂O de tout à l'heure font donc environ 1 900 kg de K₂O par hectare, retenus sur la CEC. Ce chiffre énorme est un stock, pas ce que la culture pourra prendre dans l'année. Et un reliquat de 40 mg de nitrate par kilo, c'est 9 mg d'azote, soit environ 36 kg d'azote par hectare sur 30 cm.</p>

<!-- Partie 4 -->
<h2><span class="partie-num">Partie 4 sur 4</span>Combien d'engrais mettre sur une planche ?</h2>
<p>Les besoins, les bilans et les doses se donnent en kilos par hectare. Une planche fait 20 ou 30 m². Il reste à passer des kilos par hectare aux grammes par mètre carré.</p>

<h3>Un kilo par hectare, c'est un dixième de gramme par mètre carré</h3>
<p>Un hectare, c'est 10 000 m², et un kilo, c'est 1 000 g. Un kilo par hectare fait donc 1 000 g sur 10 000 m², soit 0,1 g par m². Pour passer des kilos par hectare aux grammes par mètre carré, il suffit de diviser par 10.</p>
<div class="equation">kg/ha ÷ 10 = g/m²<small>500 kg/ha, c'est 50 g/m². 2 t/ha, c'est 200 g/m².</small></div>

<h3>Quand il manque 60 kg d'azote à une série, on peut prendre de la farine de plume</h3>
<p>D'après ton bilan, il manque 60 kg d'azote par hectare à une série de choux. Tu as de la farine de plume, un engrais organique qui contient autour de 12 % d'azote, et dont environ 60 % est efficace la première année. Le reste se libère plus tard, c'est l'<span class="t" data-t="arriere-effet">arrière-effet</span>.</p>
<p>Chaque kilo de farine de plume apporte 0,12 kg d'azote, dont 0,12 × 0,6 = 0,072 kg efficace la première année. Pour en avoir 60 kg, il faut 60 ÷ 0,072 = 833 kg de farine de plume par hectare.</p>
<div class="equation">60 ÷ (0,12 × 0,6) = 833 kg/ha<small>besoin ÷ (teneur × part efficace la première année)</small></div>
<p>Divise par 10, ça fait 83 g par m². Sur une planche de 25 m de long et 80 cm de large, soit 20 m², il faut 83 × 20 = 1 660 g, à peu près 1,7 kg.</p>

  <text class="svg-texte" x="44" y="106">1 m² reçoit 83 g</text>

</svg>
<figcaption>La planche n'est pas à l'échelle. Une dose de 833 kg par hectare, c'est 83 g par mètre carré, et un peu moins de 2 kg pour 20 m².</figcaption>
</figure>
<p>Tu apportes au total 833 × 0,12 = 100 kg d'azote par hectare, dont 60 servent cette année. Les 40 autres reviendront en partie l'an prochain, et le bilan de l'an prochain devra en tenir compte.</p>

<h3>Avec du compost seul, il en faudrait des dizaines de tonnes</h3>
<p>Refais le même calcul avec un compost de fumier de bovins. Il contient environ 7 kg d'azote par tonne, dont 1,4 kg seulement efficace la première année, soit 20 %. Pour 60 kg d'azote efficace, il en faut 60 ÷ 1,4 = 43 tonnes par hectare, 4,3 kg par m², près de 90 kg sur ta planche de 20 m².</p>
<table>
  <thead><tr><th>Pour 60 kg d'azote efficace</th><th>Farine de plume</th><th>Compost de bovins</th></tr></thead>

    <tr><td>Pour 20 m²</td><td>1,7 kg</td><td>86 kg</td></tr>
    <tr><td>Azote total apporté</td><td>100 kg/ha</td><td>300 kg/ha</td></tr>
    <tr><td>Potasse (K₂O) apportée</td><td>presque rien</td><td>environ 470 kg/ha</td></tr>
  </tbody>
</table>
<p>Avec le compost, tu apporterais 300 kg d'azote total par hectare. En bio, l'azote des effluents d'élevage est plafonné à 170 kg par hectare et par an, en moyenne sur toute la surface de la ferme. Ça vaut pour le fumier, le lisier, les fientes et leurs composts, même en bouchons. Hors bio, on retrouve la même limite en zone vulnérable. Tu apporterais aussi près de 470 kg de K₂O, bien plus que la culture n'en prendra. Le compost sert à entretenir la matière organique et la vie du sol. Pour nourrir une culture exigeante en azote dans l'année, il faut un engrais organique plus concentré et plus rapide.</p>

<p class="surtitre">Séance 13 · Une analyse de terre</p>
<h1>Comment lire une analyse de terre de bout en bout ?</h1>
<p class="chapo">Une analyse de terre se lit de haut en bas. La texture et la matière organique décrivent de quoi la terre est faite, le pH et le calcaire comment elle tient face à l'acidité, la CEC et les cations ce qu'elle garde en réserve. Cette séance suit une analyse inventée mais réaliste, celle d'une terre acide du Ségala, jusqu'au conseil que tu peux en tirer.</p>

<!-- Partie 1 -->
<h2><span class="partie-num">Partie 1 sur 4</span>Que veulent dire les taux d'argile et de matière organique ?</h2>
<p>Un maraîcher du Ségala, en Aveyron, t'envoie l'analyse de la parcelle où il veut installer ses légumes. Le Ségala tient son nom du seigle, la céréale qui supporte les terres acides, et ses sols de schiste et de granite sont encore souvent acides. Voici le bulletin, ramené à l'essentiel.</p>

  <tbody>
    <tr><td>Argile (moins de 2 µm)</td><td>15 %</td></tr>
    <tr><td>Limons (2 à 50 µm)</td><td>45 %</td></tr>
    <tr><td>Sables (50 µm à 2 mm)</td><td>40 %</td></tr>
    <tr><td>Matière organique</td><td>2,8 %</td></tr>
    <tr><td>C/N</td><td>10,5</td></tr>
    <tr><td>pH eau</td><td>5,6</td></tr>
    <tr><td>pH KCl</td><td>4,8</td></tr>
    <tr><td>Calcaire total</td><td>0</td></tr>
    <tr><td>CEC</td><td>9 meq/100 g</td></tr>
    <tr><td>Calcium échangeable</td><td>4,5 meq/100 g, soit 1,26 g de CaO par kg</td></tr>
    <tr><td>Magnésium échangeable</td><td>0,8 meq/100 g, soit 161 mg de MgO par kg</td></tr>

  </tbody>
</table>
<p>Les conversions entre meq et mg sont celles de la séance 12. On va lire ce bulletin ligne par ligne, avec ce que les séances 2 à 12 t'ont appris.</p>

<h3>La granulométrie trie la terre fine par taille de grains</h3>
<p>Le labo tamise d'abord la terre à 2 mm pour retirer les cailloux. Dans ce qui passe, la terre fine, il mesure la part de chaque taille de grains. C'est la <span class="t" data-t="granulometrie">granulométrie</span>. Les plus fins sont l'<span class="t" data-t="argile">argile</span>, puis viennent les limons, puis les sables.</p>
<figure>
  <div class="barre" role="img" aria-label="Argile 15 %, limons 45 %, sables 40 %.">
    <span class="s13-argile" style="flex:15">15</span><span class="s13-limon" style="flex:45">45</span><span class="s13-sable" style="flex:40">40</span>
  </div>

  </ul>

</figure>

<h3>Le nom de la terre dépend du triangle qu'utilise le labo</h3>
<p>Pour nommer une texture, on place ses trois chiffres dans un triangle des textures. Or il en existe plusieurs, et leurs limites ne tombent pas au même endroit au milieu du triangle. Avec 15 % d'argile et 45 % de limons, cette terre est un limon sablo-argileux dans le triangle du GEPPA, le plus utilisé en France, et un limon sableux dans celui de l'Aisne. Le bulletin précise d'habitude quel triangle il suit. Retiens surtout que c'est une terre limono-sableuse, avec un peu d'argile.</p>

<h3>Cette texture se ressent au champ</h3>
<p>Avec 40 % de sable, la terre se ressuie et se réchauffe plus vite qu'une terre argileuse au printemps. C'est un atout pour les cultures précoces. Grâce à ses limons, elle garde presque autant d'eau qu'un limon, centimètre par centimètre. Sur le schiste du Ségala, c'est plutôt le peu de profondeur de terre qui limitera sa réserve en été. Avec beaucoup de limons et peu d'argile, elle forme facilement une croûte sous la pluie, la battance, surtout quand elle est nue et que la matière organique baisse. Et avec 15 % d'argile seulement, elle retient peu de cations, on le verra en partie 3.</p>

<h3>La matière organique se lit avec son C/N</h3>
<p>Avec 2,8 % de <span class="t" data-t="matiere-organique">matière organique</span>, la terre contient 2,8 ÷ 1,72 ≈ 1,6 % de carbone (séance 4). Avec un <span class="t" data-t="rapport-cn">C/N</span> de 10,5, il y a 10,5 fois moins d'azote que de carbone, soit environ 0,15 % d'azote, 1,5 g par kilo de terre. Un C/N entre 8 et 12, c'est celui d'une matière organique qui se décompose bien.</p>
<p>Sur 30 cm, avec 4 000 tonnes de terre par hectare, ça fait environ 6 tonnes d'azote par hectare. C'est énorme, mais presque tout est pris dans la matière organique stable. Le sol n'en minéralise qu'une petite part chaque année, de l'ordre de 1 à 2 % (séance 4), soit 60 à 120 kg. Ménort, qui reprend la table d'Orgaleg, trouve 56 kg d'azote par hectare et par an pour cette terre, un peu moins de 1 % de son stock. Dans tous les cas, une tomate qui en demande 300 ne trouvera pas l'essentiel de son azote dans le sol.</p>

<!-- Partie 2 -->
<h2><span class="partie-num">Partie 2 sur 4</span>Que veulent dire le pH et le taux de calcaire ?</h2>

<h3>Un pH eau de 5,6, c'est une terre trop acide pour des légumes</h3>
<p>La plupart des légumes poussent le mieux avec un <span class="t" data-t="ph">pH</span> entre 6 et 7 environ. À 5,6, on est en dessous. Ce n'est pas encore une catastrophe, mais plusieurs choses se dégradent déjà. Le phosphore s'accroche au fer et à l'aluminium, et la racine en prend moins. Les bactéries qui font la <span class="t" data-t="nitrification">nitrification</span> travaillent moins bien, comme celles des nodosités des légumineuses. Sous 5,5, l'aluminium commence à passer dans l'eau du sol et abîme les racines. À 5,6, cette terre en est tout près, et son pH KCl de 4,8 montre vers où elle va si on ne fait rien.</p>

<h3>L'écart avec le pH KCl montre l'acidité cachée</h3>
<p>Le <span class="t" data-t="ph-kcl">pH KCl</span> est mesuré dans une eau salée au chlorure de potassium. Les ions K⁺ décrochent alors des ions H⁺ et Al³⁺ retenus sur l'argile et l'humus, et le pH baisse (séance 2). Ici, il descend de 5,6 à 4,8, soit 0,8 point. C'est un écart habituel, entre 0,5 et 1 point, qui montre qu'une bonne réserve d'acidité est accrochée à la terre.</p>
<p>C'est cette réserve qui fait grimper la dose de chaux. Quand on apporte du calcaire, il doit neutraliser l'acidité dissoute dans l'eau, mais aussi toute celle qui est accrochée et qui se libère peu à peu. C'est le <span class="t" data-t="pouvoir-tampon">pouvoir tampon</span>, et c'est à cause de lui qu'on calcule la dose au lieu de la deviner.</p>

<h3>Sans calcaire, rien n'empêche la terre de s'acidifier</h3>
<p>Le calcaire total est à zéro. La terre n'a donc aucune réserve de carbonate pour neutraliser l'acidité qui arrive chaque année. Or il en arrive tous les ans. La pluie emporte du calcium et du magnésium en profondeur, les récoltes en exportent, et chaque fois que des microbes changent de l'ammonium en nitrate, ils libèrent de l'acidité (séance 5). Sans chaulage, le pH de cette terre a toutes les chances de baisser doucement.</p>
<p>Le calcaire actif, lui, n'a de sens que dans une terre qui contient du calcaire. Le labo ne l'a pas mesuré ici, et c'est normal.</p>

<!-- Partie 3 -->
<h2><span class="partie-num">Partie 3 sur 4</span>Que veulent dire la CEC et les cations ?</h2>

<h3>Une CEC de 9, c'est un petit réservoir</h3>
<p>La <span class="t" data-t="cec">CEC</span> de cette terre est de 9 <span class="t" data-t="meq">meq</span> pour 100 g. Avec 15 % d'argile et 2,8 % de matière organique, on ne pouvait pas attendre beaucoup plus. C'est une CEC plutôt faible. Une terre argileuse ou très riche en humus dépasse souvent 15 ou 20.</p>
<p>Une petite CEC retient peu de calcium, de magnésium, de potassium et d'ammonium. Les apports de potasse et de magnésium doivent donc être plus petits et plus fréquents. Le pH, lui, bouge plus facilement, vers le bas comme vers le haut après un chaulage. Et le nitrate n'y est pas retenu du tout, mais ça, c'est vrai pour toutes les terres, puisque c'est un anion.</p>

<h3>Le taux de saturation se calcule en additionnant les cations</h3>
<p>On additionne les <span class="t" data-t="cations-echangeables">cations échangeables</span> et on divise par la CEC. On obtient le <span class="t" data-t="taux-saturation">taux de saturation</span>.</p>
<div class="equation">(4,5 + 0,8 + 0,4 + 0,05) ÷ 9 = 64 %<small>Les 36 % restants sont des places tenues par l'acidité, H⁺ et Al³⁺.</small></div>
<p>Plus d'un tiers des places de la CEC est donc tenu par l'acidité. C'est cohérent avec le pH de 5,6 et l'écart du pH KCl.</p>
<table>
  <thead><tr><th>Cation</th><th>meq</th><th>Part de la CEC</th><th>Cible Kinsey</th></tr></thead>
  <tbody>
    <tr><td>Calcium</td><td>4,5</td><td>50 %</td><td>60 à 70 %</td></tr>
    <tr><td>Magnésium</td><td>0,8</td><td>9 %</td><td>10 à 20 %</td></tr>
    <tr><td>Potassium</td><td>0,4</td><td>4,4 %</td><td>3 à 5 %</td></tr>
    <tr><td>Sodium</td><td>0,05</td><td>0,6 %</td><td>environ 1 %</td></tr>
    <tr><td>Acidité (H⁺, Al³⁺)</td><td>3,25</td><td>36 %</td><td>10 à 15 %</td></tr>
  </tbody>
</table>

<h3>Avec les repères habituels, il faut chauler</h3>
<p>Les grilles françaises regardent d'abord le pH et la part du calcium. Arvalis conseille un chaulage de redressement quand le pH eau est sous 5,8, et la chambre d'agriculture de Saône-et-Loire ajoute le cas où le calcium tient moins de 60 % de la CEC. Cette terre est dans les deux cas.</p>
<p>Le magnésium, à 161 mg de MgO par kilo, est bien au-dessus du seuil qu'Arvalis donne pour une terre de cette CEC, 60 mg par kilo. S'il ne tient que 9 % de la CEC, c'est surtout parce que l'acidité y prend beaucoup de place. Le potassium, à 188 mg de K₂O par kilo, paraît correct, mais c'est à la grille de ton labo de trancher, parce que ses seuils changent avec la CEC et l'argile. Ici, il y a 1,6 fois plus de potassium que de magnésium, en poids. Le guide anglais RB209 ne craint une carence en magnésium chez les arbres fruitiers et la vigne qu'au-delà de 3 pour 1. C'est l'<span class="t" data-t="antagonisme">antagonisme</span> de la séance 10.</p>

<h3>Avec Albrecht et Kinsey, on arrive au même endroit</h3>
<p>Pour la <span class="t" data-t="albrecht-kinsey">méthode Albrecht-Kinsey</span> de la séance 11, la terre manque de calcium, à 50 % au lieu de 60 à 70, et un peu de magnésium, à 9 % au lieu de 10 à 20. Le potassium et le sodium sont dans les clous. L'acidité prend beaucoup trop de place.</p>
<p>Regarde maintenant le rapport entre calcium et magnésium. 4,5 ÷ 0,8 = 5,6, en plein dans la cible de 5 à 7. Si tu ne lisais que ce rapport, tu croirais que tout va bien, alors que l'acidité tient plus d'un tiers de la CEC. Un rapport, à lui seul, ne t'apprend rien sur le reste de l'analyse. Sur une terre acide comme celle-ci, toutes les écoles concluent qu'il faut chauler.</p>

<!-- Partie 4 -->
<h2><span class="partie-num">Partie 4 sur 4</span>Que conclure, et que conseiller ?</h2>
<p>Un conseil ne se lit pas dans une case du bulletin. On cherche d'abord ce qui limite le plus, comme dans la <span class="t" data-t="loi-minimum">loi du minimum</span> de la séance 1, puis on avance dans l'ordre. Ici, c'est l'acidité qui limite le plus, puis le phosphore. La matière organique est correcte, et la terre retient peu de cations.</p>

<h3>D'abord corriger l'acidité, avec de la dolomie</h3>
<p>Le <span class="t" data-t="chaulage">chaulage</span> vient en premier, parce que l'acidité freine tout le reste. Arvalis donne ses doses selon la CEC. Avec une CEC de 9, cette terre tombe dans la colonne des CEC de 7 à 16, celle des terres limoneuses, qui demande de 1 060 à 1 780 kg d'équivalent CaO par hectare pour passer de pH 5,5 à 6. Comme elle est en bas de la colonne, prévois de l'ordre de 1 000 à 1 300 kg pour l'amener vers 6. Pour viser 6,2 à 6,5, il faudrait plutôt 1 500 à 2 500 kg, mais sur une terre aussi légère, on commence par un premier apport.</p>
<p>On peut prendre de la dolomie, un carbonate de calcium et de magnésium autorisé en bio, où la chaux vive est interdite. Elle corrige l'acidité comme un calcaire, et elle remonte un peu le magnésium. Le magnésium ne manque pas, mais il est juste correct pour des légumes exigeants comme la tomate. Une dolomie à 30 % de CaO et 18 % de MgO a une <span class="t" data-t="valeur-neutralisante">valeur neutralisante</span> d'environ 30 + 1,4 × 18 ≈ 55. Pour 1 200 kg d'équivalent CaO, il en faut 1 200 ÷ 0,55 ≈ 2 200 kg par hectare, soit 220 g par m², à apporter en une ou deux fois dans une terre aussi légère.</p>
<p>Fais le calcul avec les outils de la séance 12, en supposant que tout reste sur la CEC des 30 premiers centimètres, ce qui simplifie beaucoup. Le calcium passerait de 4,5 à 5,1 meq, le magnésium de 0,8 à 1,3, et la saturation de 64 à 76 %. On resterait donc sous les 80 % qu'on vise en culture, et le rapport Ca/Mg tomberait vers 4. Pour ne pas charger la terre en magnésium, on ne fait qu'un apport de dolomie. On complète et on entretient ensuite au calcaire, d'après une nouvelle analyse.</p>
<p>Deux précautions. Il vaut mieux ne pas viser 7, parce qu'un sol trop chaulé bloque des oligo-éléments. Et on chaule au moins deux jours avant un apport organique, ou deux à trois semaines après, pour ne pas perdre d'azote en ammoniac, la <span class="t" data-t="volatilisation">volatilisation</span> de la séance 5.</p>

<h3>Entretenir la matière organique avec du compost</h3>
<p>Avec 2,8 % de matière organique et un C/N de 10,5, la terre est en bon état de ce côté. Le but est de garder ce niveau. Chaque année, le sol minéralise 1 à 2 % de son humus (séance 4). Sur les 110 tonnes de matière organique que porte un hectare sur 30 cm, ça fait 1 à 2 tonnes à remplacer chaque année.</p>
<p>Le compost est fait pour ça, on l'a vu à la séance 12. Il nourrit la terre plus qu'il ne nourrit la culture de l'année. Un <span class="t" data-t="engrais-vert">engrais vert</span> l'hiver aide aussi, en protégeant la surface de la battance et en captant le nitrate qui partirait sinon avec les pluies.</p>

<h3>Remonter le phosphore avec des produits adaptés au bio</h3>
<p>Avec 35 mg de P₂O₅ par kilo, le <span class="t" data-t="p-olsen">phosphore Olsen</span> est bas. Pour le colza, une culture exigeante, Terres Inovia voit les rendements chuter sous 30 à 35. Pour les céréales, Arvalis juge une teneur satisfaisante à partir de 70 à 90. Et dans un observatoire de parcelles bio, la moyenne des terres non calcaires était de 48. Pour des légumes, souvent exigeants, 35 est donc faible.</p>
<p>Le chaulage aidera déjà, en décrochant une partie du phosphore retenu par le fer et l'aluminium. Pour en apporter, on pense aux fientes ou au compost de volailles, ou à des farines animales riches en phosphore, en tenant compte de l'azote qu'ils apportent en même temps. Un phosphate naturel broyé, lui, n'agit bien qu'en terre franchement acide, sous pH 5,5 (séance 1). Sur une terre qu'on est en train de remonter vers 6,2, il agirait mal.</p>
<p>Un détail compte beaucoup avant de comparer deux analyses. En France, trois méthodes courantes mesurent le phosphore, Olsen, Dyer et Joret-Hébert, et elles ne donnent pas les mêmes chiffres. On ne compare que des analyses faites avec la même méthode.</p>

<h3>Apporter l'engrais organique rapide en plusieurs fois</h3>
<p>Cette terre retient peu de cations et ne fournit qu'une soixantaine de kilos d'azote par an. Les cultures exigeantes auront besoin d'apports, et le nitrate qu'elles ne prennent pas tout de suite risque de partir en profondeur avec les pluies, le <span class="t" data-t="lessivage">lessivage</span>. Plutôt que tout l'engrais organique rapide à la plantation, on le donne en deux ou trois fois, au rythme des besoins de la culture. C'est le <span class="t" data-t="fractionnement">fractionnement</span> de la séance 8.</p>
<p>Ce n'est pas une recette. Avec une autre culture, un autre précédent ou une autre analyse, les priorités changent. Ce qui reste, c'est l'ordre du raisonnement, en partant de ce qui limite le plus.</p>

  "reduction": ["Réduction", "Quand un atome gagne des électrons, on dit qu'il est réduit. Quand il en perd, on dit qu'il est oxydé. Réduire le nitrate en ammonium, c'est rendre 8 électrons à son azote."],

  "rubisco": ["Rubisco", "L'enzyme qui accroche le gaz carbonique de l'air au début de la fabrication du sucre. C'est la protéine la plus abondante des feuilles, et elle porte 20 à 30 % de leur azote."],

  "stomate": ["Stomate", "Une petite bouche à la surface de la feuille. Elle s'ouvre pour laisser entrer le gaz carbonique, et laisse alors sortir de la vapeur d'eau."],

  "valeur-neutralisante": ["Valeur neutralisante", "Le nombre de kilos de chaux vive, CaO, qui neutraliseraient autant d'acidité que 100 kilos du produit. Elle vaut 56 pour un calcaire pur."],

};

/* ---------- La mémoire du téléphone ---------- */
const CLE = "chimie-sol-et-plante-v1";
let etat = { faites: {}, reponses: {} };
try { const lu = JSON.parse(localStorage.getItem(CLE)); if (lu && lu.faites) etat = lu; } catch (e) {}
function sauver() { try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) {} }

/* ---------- Le thème ---------- */
const racine = document.documentElement;
try { const t = localStorage.getItem(CLE + "-theme"); if (t) racine.dataset.theme = t; } catch (e) {}
function themeSombre() {
  if (racine.dataset.theme) return racine.dataset.theme === "dark";
  return matchMedia("(prefers-color-scheme: dark)").matches;
}
function majCouleurBarre() {
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = getComputedStyle(racine).getPropertyValue("--bg").trim();
}
document.getElementById("btn-theme").addEventListener("click", () => {
  racine.dataset.theme = themeSombre() ? "light" : "dark";
  try { localStorage.setItem(CLE + "-theme", racine.dataset.theme); } catch (e) {}
  majCouleurBarre();
});
majCouleurBarre();

/* ---------- Petits outils ---------- */
const app = document.getElementById("app");
const el = (tag, attrs = {}, ...enfants) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const e of enfants.flat()) if (e != null) n.append(e.nodeType ? e : document.createTextNode(e));
  return n;
};
function questionsDe(id) {
  const tpl = document.getElementById("seance-" + id);
  if (!tpl) return [];
  return [...tpl.content.querySelectorAll("script.quiz-data")].map(s => JSON.parse(s.textContent));
}
function pluriel(n, un, plusieurs) { return n + " " + (n > 1 ? plusieurs : un); }
function melanger(t) { for (let i = t.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [t[i], t[j]] = [t[j], t[i]]; } return t; }

/* ---------- Une question ---------- */
function rendreQuestion(q, dejaChoisi, surReponse) {
  const bloc = el("div", { class: "question" });
  bloc.append(el("p", { class: "enonce" }, q.q));
  const choix = el("div", { class: "choix" });
  const retour = el("p", { class: "pourquoi", "aria-live": "polite" });
  const boutons = q.r.map((texte, i) => el("button", { type: "button", onclick: () => repondre(i, true) }, texte));
  function repondre(i, nouveau) {
    boutons.forEach((b, j) => {
      b.disabled = true;
      if (j === q.ok) b.classList.add("bon");
      else if (j === i) b.classList.add("faux");
      else b.classList.add("estompe");
    });
    const juste = i === q.ok;
    retour.replaceChildren(el("b", { class: juste ? "ok" : "ko" }, juste ? "Bonne réponse. " : "Pas tout à fait. "), q.p);
    typographie(retour);
    if (nouveau) surReponse(i, juste);
  }
  choix.append(...boutons);
  bloc.append(choix, retour);
  if (dejaChoisi != null) repondre(dejaChoisi, false);
  return bloc;
}

  document.getElementById("btn-retour").hidden = true;
  document.getElementById("titre-app").textContent = "Chimie du sol et de la plante";
  const nbFaites = SEANCES.filter(s => etat.faites[s.id]).length;
  const prochaine = SEANCES.find(s => s.prete && !etat.faites[s.id]);
  const total = SEANCES.length;

  app.replaceChildren();
  app.append(
    el("h1", {}, "La chimie du sol et de la plante, en partant de zéro"),
    el("p", { class: "chapo" }, "Pourquoi le nitrate part l'hiver et pas la potasse ? Pourquoi une plante trop nourrie en azote attire les pucerons ? Ce cours remonte jusqu'à l'atome pour te l'expliquer, en " + total + " séances, avec des exemples pris en maraîchage bio.")
  );

  const carte = el("div", { class: "carte" });
  carte.append(
    el("div", {}, nbFaites === 0 ? "Aucune séance faite pour l'instant." : pluriel(nbFaites, "séance faite", "séances faites") + " sur " + total + "."),

      el("span", { style: "width:" + Math.round(nbFaites / total * 100) + "%" }))
  );
  if (prochaine) {
    carte.append(el("a", { class: "bouton", href: "#/seance/" + prochaine.id },
      (nbFaites === 0 ? "Commencer la séance " : "Continuer avec la séance ") + prochaine.id));
  } else if (nbFaites < total) {
    carte.append(el("p", { class: "note", style: "margin:0" }, "Tu as fait toutes les séances déjà prêtes. La suite arrive bientôt."));
  } else {
    carte.append(el("p", { style: "margin:0" }, "Tu as fait tout le cours. Bravo !"));
  }
  app.append(carte);

  app.append(el("div", { class: "rangee" },
    el("a", { class: "bouton second", href: "#/lexique" }, "Lexique"),
    nbFaites > 0 ? el("a", { class: "bouton second", href: "#/reviser" }, "Réviser")
                 : el("span", { class: "bouton second", style: "opacity:.5", title: "Fais d'abord une séance" }, "Réviser")
  ));

  const liste = el("ol", { class: "liste-seances" });
  for (const s of SEANCES) {

    const etatTexte = faite ? "Faite, " + faite.score + " bonnes réponses sur " + faite.total
      : s.prete ? pluriel(s.parties.length, "partie", "parties") + ", à faire" : "Bientôt";
    const contenu = [
      el("span", { class: "pastille", "aria-hidden": "true" }, faite ? "✓" : String(s.id)),
      el("span", { class: "etiquette" }, "Séance " + s.id + " · " + s.etiquette),
      el("span", { class: "intitule" }, s.titre),
      el("span", { class: "etat" }, etatTexte)
    ];
    li.append(s.prete
      ? el("a", { class: "ouvrir", href: "#/seance/" + s.id, style: "text-decoration:none;color:inherit" }, contenu)
      : el("div", { class: "ouvrir", "aria-disabled": "true" }, contenu));
    li.append(el("details", {}, el("summary", {}, "Ce qu'on y voit"), el("ol", {}, s.parties.map(p => el("li", {}, p)))));
    liste.append(li);
  }
  app.append(el("h2", {}, "Le programme"), liste);
  app.append(el("p", { class: "note" }, "Les chiffres du cours sont des ordres de grandeur pour comprendre. Pour conseiller une dose, on part toujours d'une analyse de terre et des références de la région. Touche un mot souligné en pointillé pour revoir sa définition."));
  window.scrollTo(0, 0);
}

/* ---------- Une séance ---------- */
function vueSeance(id) {
  const s = SEANCES.find(x => x.id === id);
  const tpl = document.getElementById("seance-" + id);
  if (!s || !tpl) { location.hash = "#/"; return; }
  document.getElementById("btn-retour").hidden = false;
  document.getElementById("titre-app").textContent = "Séance " + id;
  try { etat.derniere = id; sauver(); } catch (e) {}

  const frag = tpl.content.cloneNode(true);
  const blocs = [...frag.querySelectorAll("script.quiz-data")];
  const toutes = [];
  blocs.forEach((script, b) => {
    const questions = JSON.parse(script.textContent);
    const conteneur = document.createElement("div");
    questions.forEach((q, i) => {
      const cle = id + "-" + b + "-" + i;
      toutes.push({ q, cle });
      conteneur.append(rendreQuestion(q, etat.reponses[cle], (choisi) => {
        etat.reponses[cle] = choisi; verifierFin(); sauver();
      }));
    });
    script.replaceWith(conteneur);
  });

  const bilan = el("p", { class: "bilan", "aria-live": "polite" });
  const suite = SEANCES.find(x => x.id === id + 1);
  const actions = el("div", { style: "display:grid;gap:.6rem;margin-top:1rem" });
  function verifierFin() {
    const repondues = toutes.filter(t => etat.reponses[t.cle] != null);
    if (repondues.length < toutes.length) {
      const reste = toutes.length - repondues.length;
      bilan.className = "bilan vide";
      bilan.textContent = "Il te reste " + pluriel(reste, "question", "questions") + " pour finir la séance.";
      return;
    }
    const score = toutes.filter(t => etat.reponses[t.cle] === t.q.ok).length;
    etat.faites[id] = { score, total: toutes.length, date: new Date().toISOString().slice(0, 10) };
    bilan.className = "bilan";
    bilan.textContent = "Séance faite, avec " + score + " bonnes réponses sur " + toutes.length + ".";
  }
  verifierFin();

  if (suite && suite.prete) actions.append(el("a", { class: "bouton", href: "#/seance/" + suite.id }, "Passer à la séance " + suite.id));
  actions.append(
    el("button", { class: "bouton second", type: "button", onclick: () => {
      toutes.forEach(t => delete etat.reponses[t.cle]); delete etat.faites[id]; sauver(); vueSeance(id);
    } }, "Refaire les questions"),
    el("a", { class: "bouton second", href: "#/" }, "Retour au sommaire")
  );

  app.replaceChildren(frag);
  const fin = app.querySelector(".fin") || app;
  fin.append(bilan, actions);
  preparerMots();
  window.scrollTo(0, 0);
}

/* ---------- Réviser ---------- */
function vueReviser() {
  document.getElementById("btn-retour").hidden = false;
  document.getElementById("titre-app").textContent = "Réviser";
  const pool = [];
  SEANCES.filter(s => etat.faites[s.id]).forEach(s => questionsDe(s.id).flat().forEach(q => pool.push(q)));
  app.replaceChildren(el("h1", {}, "Réviser"));
  if (!pool.length) {
    app.append(el("p", {}, "Fais d'abord une séance, ses questions viendront ensuite ici."));
    return;
  }
  const tirage = melanger(pool).slice(0, 10);
  app.append(el("p", { class: "chapo" }, "Voici dix questions tirées au hasard dans les séances que tu as faites. C'est en reprenant les questions quelques jours plus tard qu'on retient vraiment."));
  let bonnes = 0, faites = 0;
  const bilan = el("p", { class: "bilan", "aria-live": "polite" });
  const quiz = el("div", { class: "quiz" });
  tirage.forEach(q => quiz.append(rendreQuestion(q, null, (i, juste) => {
    faites++; if (juste) bonnes++;
    if (faites === tirage.length) bilan.textContent = bonnes + " bonnes réponses sur " + tirage.length + ".";
  })));
  app.append(quiz, bilan,
    el("div", { style: "display:grid;gap:.6rem;margin-top:1rem" },
      el("button", { class: "bouton", type: "button", onclick: vueReviser }, "Dix autres questions"),
      el("a", { class: "bouton second", href: "#/" }, "Retour au sommaire")));
  preparerMots();
  window.scrollTo(0, 0);
}

/* ---------- Le lexique ---------- */
function vueLexique() {
  document.getElementById("btn-retour").hidden = false;
  document.getElementById("titre-app").textContent = "Lexique";
  const entrees = Object.values(LEXIQUE).sort((a, b) => a[0].localeCompare(b[0], "fr"));
  const champ = el("input", { class: "recherche", type: "search", placeholder: "Chercher un mot", "aria-label": "Chercher un mot" });
  const dl = el("dl", { class: "lexique" });
  const sansAccent = t => t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  function remplir() {
    const f = sansAccent(champ.value.trim());
    dl.replaceChildren();
    entrees.filter(([m, d]) => !f || sansAccent(m + " " + d).includes(f))
      .forEach(([m, d]) => dl.append(el("dt", {}, m), el("dd", {}, d)));
    if (!dl.children.length) dl.append(el("dd", { class: "note" }, "Aucun mot ne correspond."));
    typographie(dl);
  }
  champ.addEventListener("input", remplir);
  remplir();
  app.replaceChildren(el("h1", {}, "Lexique"), el("p", { class: "note" }, "Voici les mots du cours et leur définition. Chaque nouvelle séance en ajoute."), champ, dl);
  window.scrollTo(0, 0);
}

/* ---------- La définition d'un mot ---------- */
const voile = document.getElementById("voile"), feuille = document.getElementById("feuille");
function ouvrirMot(cle) {
  const e = LEXIQUE[cle]; if (!e) return;
  document.getElementById("feuille-mot").textContent = e[0];
  document.getElementById("feuille-def").textContent = e[1];
  voile.classList.add("ouvert"); feuille.classList.add("ouvert");
  document.getElementById("feuille-fermer").focus();
}
function fermerMot() { voile.classList.remove("ouvert"); feuille.classList.remove("ouvert"); }
voile.addEventListener("click", fermerMot);
document.getElementById("feuille-fermer").addEventListener("click", fermerMot);
document.addEventListener("keydown", e => { if (e.key === "Escape") fermerMot(); });
app.addEventListener("click", e => { const t = e.target.closest(".t"); if (t) ouvrirMot(t.dataset.t); });
app.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("t")) { e.preventDefault(); ouvrirMot(e.target.dataset.t); } });
/* Espaces insécables à la française, pour qu'un « ? » ne parte jamais seul à la ligne. */
function typographie(racineNoeud) {
  const marche = document.createTreeWalker(racineNoeud, NodeFilter.SHOW_TEXT);
  const noeuds = [];
  while (marche.nextNode()) noeuds.push(marche.currentNode);
  for (const n of noeuds) {
    const avant = n.nodeValue;
    const apres = avant
      .replace(/ ([?!:;»%])/g, " $1")
      .replace(/« /g, "« ")
      .replace(/(?<=\p{L})-(?=\p{L})/gu, "‑")
      .replace(/(\d) (°C|kg|g|t|m²|mm|cm|tonnes|fois|%)(?=[\s.,;)]|$)/g, "$1 $2");
    if (apres !== avant) n.nodeValue = apres;
  }
}
function preparerMots() {
  app.querySelectorAll(".t").forEach(t => { t.tabIndex = 0; t.setAttribute("role", "button"); });
  typographie(app);
}

/* ---------- La navigation ---------- */
document.getElementById("btn-retour").addEventListener("click", () => { location.hash = "#/"; });
function router() {
  fermerMot();
  const h = location.hash;
  let m;
  if ((m = h.match(/^#\/seance\/(\d+)/))) vueSeance(Number(m[1]));
  else if (h === "#/lexique") vueLexique();
  else if (h === "#/reviser") vueReviser();
  else vueSommaire();
  preparerMots();
}
window.addEventListener("hashchange", router);
router();
</script>
