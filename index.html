<p class="surtitre">Séance 6 · La sève et les sucres</p>
<h1>Comment la sève nourrit la plante ?</h1>
<p class="chapo">Une plante a deux réseaux de tuyaux. Le premier monte l'eau et les ions du sol jusqu'aux feuilles, tiré par l'eau qui s'évapore. Le second emporte le sucre fabriqué dans les feuilles vers les fruits, les racines et les jeunes pousses. Ce qui voyage dans chacun explique bien des carences, et même le cul noir de la tomate.</p>

<!-- Partie 1 -->
<h2><span class="partie-num">Partie 1 sur 4</span>Comment l'eau et les ions montent jusqu'aux feuilles ?</h2>

<h3>La plante a deux réseaux de tuyaux</h3>
<p>Coupe une branche de céleri en travers. Les petits points durs que tu vois près du bord sont des faisceaux, chacun fait de deux sortes de tuyaux collés ensemble. Le <span class="t" data-t="xyleme">xylème</span> monte la sève brute, de l'eau et des ions, depuis les racines. Le <span class="t" data-t="phloeme">phloème</span> distribue la sève élaborée, chargée du sucre fait dans les feuilles.</p>
<p>Mets une autre branche de céleri dans un verre d'eau colorée. En quelques heures, ces points se colorent et la couleur monte jusqu'aux feuilles. Tu viens de voir le xylème travailler. On commence par lui.</p>

<h3>Le xylème est fait de tuyaux morts</h3>
<p>Les tuyaux du xylème sont faits de cellules mortes, vidées de leur contenu et mises bout à bout. Leurs parois sont renforcées de lignine, la matière dure du bois. Le jour, la plante ne dépense presque rien pour y faire monter l'eau. C'est l'air sec et le soleil qui font le travail.</p>

<h3>Les feuilles tirent l'eau en transpirant</h3>
<p>Sur les feuilles, surtout dessous, il y a une multitude de petites bouches qu'on appelle des <span class="t" data-t="stomate">stomates</span>. Elles s'ouvrent pour laisser entrer le gaz carbonique, et l'eau de la feuille s'évapore par la même ouverture. C'est la <span class="t" data-t="transpiration">transpiration</span>.</p>
<p>Chaque molécule d'eau qui s'en va tire sur la suivante, parce que les molécules d'eau se tiennent entre elles. Toute la colonne d'eau monte ainsi depuis les racines, comme une boisson qu'on aspire avec une paille. Presque toute l'eau que prend une plante repart dans l'air de cette façon, environ 97 % d'après le manuel de Taiz et Zeiger. Elle n'en garde qu'une toute petite part pour pousser.</p>
<p>Les stomates se ferment la nuit, et le jour quand l'eau manque. La sève monte alors beaucoup moins vite. La nuit, la racine pousse quand même un peu de sève vers le haut. Elle fait entrer des ions dans le xylème, et l'eau les suit. C'est la poussée racinaire, qui fait perler des gouttes au bord des feuilles de tomate ou de salade, le matin sous tunnel.</p>

<h3>Les ions montent avec l'eau</h3>
<p>Les ions que la racine a pris, nitrate, potassium, calcium, magnésium, montent dans ce courant d'eau. Plus une feuille transpire, plus elle en reçoit. Pour la plupart d'entre eux, ce n'est pas gênant, parce que la plante peut ensuite les redistribuer par l'autre réseau. Le calcium, lui, ne voyage presque que dans le xylème. Il va là où va l'eau, et il y reste.</p>

<h3>Le calcium explique le cul noir de la tomate</h3>
<p>Un fruit de tomate transpire très peu. Il reçoit donc peu d'eau par le xylème, et peu de calcium, alors qu'il en a besoin pour construire les parois de ses cellules pendant qu'il grossit. Quand l'eau manque, quand l'arrosage est irrégulier ou quand l'eau du sol est trop chargée en sels, les feuilles, qui transpirent beaucoup, prennent presque tout le calcium. Le bout du fruit, à l'opposé de la tige, en manque. Ses cellules meurent et noircissent. C'est la nécrose apicale, le « cul noir ».</p>
<p>La salade fait pareil avec ses jeunes feuilles. Au cœur d'une laitue ou d'une scarole, les feuilles enfermées transpirent très peu, et une part de leur calcium leur arrive la nuit, par la poussée racinaire. Quand la salade pousse très vite par temps chaud, ou quand l'air d'un tunnel reste saturé d'humidité en journée, le bord de ces feuilles ne reçoit pas assez de calcium et brunit. C'est la nécrose marginale.</p>
<p>Dans les deux cas, le sol peut avoir tout le calcium qu'il faut, c'est le transport qui coince. Ajouter du calcium au sol n'y change donc souvent rien. Ce qui aide, c'est un arrosage régulier, une eau pas trop salée, une croissance pas trop poussée et un tunnel bien aéré. Et un calcium pulvérisé sur les feuilles reste dans les feuilles, puisqu'il ne peut pas en repartir vers les fruits.</p>

<h2><span class="partie-num">Partie 2 sur 4</span>Comment la feuille fabrique du sucre ?</h2>
<p>On a vu la <span class="t" data-t="photosynthese">photosynthèse</span> à la séance 1, avec son équation. Regardons maintenant où elle se passe, et ce qu'il faut à la feuille pour la faire.</p>

<h3>Tout se passe dans les chloroplastes</h3>
<p>Une cellule de feuille contient des dizaines de petits grains verts, les <span class="t" data-t="chloroplaste">chloroplastes</span>. Ils sont verts parce qu'ils sont remplis de <span class="t" data-t="chlorophylle">chlorophylle</span>, la molécule qui capte la lumière. C'est dans les chloroplastes que le gaz carbonique entré par les stomates devient du sucre.</p>

<h3>La chlorophylle porte un atome de magnésium et quatre d'azote</h3>
<p>La molécule de chlorophylle a une forme de raquette. La tête est un anneau d'atomes de carbone et d'azote, avec en son centre un atome de magnésium tenu par quatre atomes d'azote. Le manche est une longue chaîne de carbone et d'hydrogène, qui accroche la molécule à l'intérieur du chloroplaste.</p>

<p>Quand le magnésium ou l'azote manque, la feuille fait moins de chlorophylle et jaunit. Mais l'azote d'une feuille ne se trouve qu'en petite partie dans la chlorophylle. Les chloroplastes contiennent aussi les protéines qui font le travail de la photosynthèse, et c'est là qu'est la plus grande part de l'azote d'une feuille. On y revient à la séance 7.</p>

<h3>Grâce à la lumière, l'eau perd des électrons</h3>
<p>La photosynthèse se fait en deux temps. D'abord, la chlorophylle capte l'énergie de la lumière et s'en sert pour arracher des électrons aux molécules d'eau. L'eau ainsi cassée libère son oxygène dans l'air. Ensuite, la feuille se sert de ces électrons et de cette énergie pour accrocher le carbone du gaz carbonique et en faire du sucre.</p>
<p>Retiens bien cette image. Grâce à la lumière, l'eau perd des électrons, et le carbone les gagne. À la séance 7, on verra que le nitrate en gagne aussi, et que c'est pour ça que la plante le transforme mieux en plein soleil.</p>

<h3>Il faut de la lumière, de l'eau et des stomates ouverts</h3>
<p>Plus la feuille reçoit de lumière, plus elle fabrique de sucre, à condition d'avoir de l'eau et des stomates ouverts pour laisser entrer le gaz carbonique. Une plante qui manque d'eau ferme ses stomates pour ne pas se dessécher, et sa photosynthèse ralentit. Et en hiver, avec des jours courts et un ciel gris, une salade fabrique peu de sucre. Ça aura son importance aux séances 7 et 8.</p>

<!-- Partie 3 -->
<h2><span class="partie-num">Partie 3 sur 4</span>Où part le sucre une fois fabriqué ?</h2>

<h3>Le sucre voyage sous forme de saccharose</h3>
<p>Le sucre ne reste pas tel quel dans la feuille. Une partie est rangée sous forme d'amidon dans le chloroplaste, une réserve pour la nuit. Le reste est assemblé en <span class="t" data-t="saccharose">saccharose</span>, le sucre de table, fait d'un glucose et d'un fructose accrochés ensemble. C'est sous cette forme que le sucre voyage dans la plante.</p>

<h3>Le phloème va des sources vers les puits</h3>
<p>Le phloème, au contraire du xylème, est fait de cellules vivantes, mises bout à bout et percées comme des cribles. Il ne coule pas toujours dans le même sens, il peut monter ou descendre. Il part des « sources », les organes qui fabriquent plus de sucre qu'ils n'en dépensent, et va vers les « puits », ceux qui en dépensent plus qu'ils n'en fabriquent.</p>
<p>Les sources, ce sont les feuilles adultes et bien éclairées. Les puits, ce sont les fruits, les racines, les jeunes feuilles, les fleurs, ou le bulbe d'un oignon qui grossit. Une jeune feuille est d'abord un puits, puis devient une source en grandissant. Et une carotte, puits la première année, devient une source au printemps suivant, quand elle monte en graines.</p>

<h3>Le sucre pousse la sève devant lui</h3>
<p>Dans la feuille, la plante fait entrer le saccharose dans le phloème. L'eau du xylème tout proche est attirée par tout ce sucre et entre à son tour, ce qui fait monter la pression dans le tuyau. Dans le fruit ou la racine, le sucre sort du phloème, et l'eau ressort avec lui. La sève coule donc des sources vers les puits, du côté où la pression est forte vers celui où elle est faible, comme l'eau dans un tuyau d'arrosage.</p>

<h3>Le phloème transporte aussi de l'azote</h3>
<p>La sève élaborée n'est pas faite que de sucre. Elle transporte aussi des <span class="t" data-t="acide-amine">acides aminés</span>, les briques des <span class="t" data-t="proteine">protéines</span>, qui portent l'azote vers les organes qui grandissent. On verra à la séance 7 comment la plante les fabrique. Elle transporte aussi beaucoup de potassium, et des messages chimiques d'un organe à l'autre.</p>
<p>C'est cette sève-là que pique le puceron. Il plante sa trompe dans un seul tuyau du phloème, et la sève, sous pression, monte toute seule dans sa bouche. Elle est très riche en sucre et pauvre en azote, alors il doit en boire énormément pour avoir assez d'azote, et il rejette le sucre en trop. C'est le miellat qui colle sur les feuilles. On y revient à la séance 8.</p>

<h3>Certains éléments peuvent quitter les vieilles feuilles</h3>
<p>Le phloème permet aussi à la plante de déplacer ce qu'elle a déjà mis dans ses feuilles. Quand un élément vient à manquer, elle peut le retirer de ses vieilles feuilles pour l'envoyer aux jeunes, à condition qu'il puisse voyager dans le phloème. On dit alors que cet élément est mobile.</p>

<p>Ça t'aidera beaucoup à faire un diagnostic au champ. Une tomate dont les feuilles jaunissent du bas vers le haut manque sans doute d'azote. Si le jaune reste entre les nervures des vieilles feuilles, pense au magnésium. Si ce sont les jeunes feuilles qui jaunissent entre leurs nervures, pense au fer. Et si ce sont les pointes, les cœurs ou les fruits qui souffrent, regarde du côté du calcium ou du bore. Le symptôme te met sur la piste, mais c'est l'analyse qui confirme.</p>

<!-- Partie 4 -->
<h2><span class="partie-num">Partie 4 sur 4</span>Pourquoi les racines donnent du sucre aux microbes ?</h2>
<p>Une partie du sucre envoyé aux racines ne sert pas à la plante elle-même. Elle sort de la racine et part dans le sol. On pourrait croire à une fuite. C'est en réalité un échange.</p>

<h3>Les racines laissent sortir une partie de leur sucre</h3>
<p>Les racines laissent sortir des sucres, des acides aminés, des acides organiques et une sorte de gel qui les aide à glisser dans la terre. Ce sont les <span class="t" data-t="exsudats">exsudats</span> racinaires. Selon les plantes, leur âge et la façon de mesurer, on estime qu'ils emportent de l'ordre de 5 à 20 % du carbone capté par la photosynthèse. Les chiffres varient beaucoup d'une étude à l'autre, mais ce n'est pas rien.</p>

<h3>Les microbes de la rhizosphère s'en nourrissent</h3>
<p>Autour de chaque racine, sur quelques millimètres, la terre grouille de microbes, bien plus que quelques centimètres plus loin. Cette zone s'appelle la <span class="t" data-t="rhizosphere">rhizosphère</span>. Les bactéries y mangent le sucre des exsudats, et ce sucre facile leur donne l'énergie d'attaquer la matière organique du sol, plus dure à digérer. Elles en tirent de l'azote, qu'elles gardent d'abord pour fabriquer leur propre corps.</p>
<p>Ensuite, des êtres un peu plus gros, des protozoaires et certains petits vers microscopiques, les nématodes, mangent ces bactéries. Ce ne sont pas les nématodes à galles qui attaquent les racines, mais d'autres espèces. Une bactérie contient plus d'azote que ce dont ils ont besoin, et ils rejettent le surplus en ammonium, juste à côté de la racine. Le sucre donné par la plante lui revient ainsi en azote.</p>

<h3>Les champignons des mycorhizes vont chercher le phosphore loin des racines</h3>
<p>La plupart des légumes vivent aussi avec des champignons microscopiques. Leurs filaments entrent dans la racine et s'étendent dans le sol bien au-delà d'elle. Cette association s'appelle une <span class="t" data-t="mycorhize">mycorhize</span>. Les filaments sont bien plus fins qu'une racine, et ils vont là où elle ne va pas.</p>
<p>Ils servent surtout pour le phosphore. Le phosphate bouge très peu dans le sol, et une racine vide vite le petit volume de terre qui la touche, sur un ou deux millimètres. Le champignon va le chercher plus loin et l'apporte à la racine, avec du zinc et un peu d'eau. En échange, la plante lui donne du sucre, une part notable de ce qu'elle fabrique, de l'ordre de 4 à 20 % selon les estimations.</p>
<p>Toutes les familles ne jouent pas le jeu. Les choux, les radis, les navets et la roquette, de la famille des crucifères, ne font pas de mycorhizes, pas plus que l'épinard, la betterave ou la blette. À l'inverse, le poireau et l'oignon en dépendent beaucoup, avec leurs racines peu nombreuses et presque sans poils, et la carotte en profite aussi. Un poireau planté après des choux trouve souvent moins de champignons qu'après une salade. Un sol souvent travaillé, laissé nu longtemps ou très riche en phosphore soluble en garde moins, lui aussi.</p>

<h3>Un sol vivant se nourrit d'abord de racines vivantes</h3>
<p>Ces échanges expliquent pourquoi un sol couvert le plus longtemps possible par des plantes vivantes garde une vie microbienne active. Les racines nourrissent les microbes tous les jours, juste là où la plante a besoin d'eux, et les microbes le lui rendent en azote et en phosphore.</p>

<div class="fin">
  <div class="encadre retenir"><span class="titre-encadre">À retenir de cette séance</span>
  <ul>
    <li>La plante a deux réseaux. Le xylème monte l'eau et les ions, tiré par la transpiration des feuilles. Le phloème distribue le sucre des sources, les feuilles adultes, vers les puits, comme les fruits et les racines.</li>
    <li>Le calcium ne voyage presque que dans le xylème. Un fruit ou un cœur de salade qui transpire peu en reçoit peu, même dans un sol riche en calcium.</li>
    <li>La photosynthèse se fait dans les chloroplastes. La chlorophylle contient du magnésium et de l'azote, c'est pour ça que la feuille jaunit quand l'un des deux manque.</li>
    <li>Les éléments mobiles, l'azote, le phosphore, le potassium et le magnésium, peuvent quitter les vieilles feuilles pour les jeunes. Le calcium, le fer et le bore n'en repartent presque pas. Pour trouver ce qui manque, regarde quelles feuilles souffrent.</li>
    <li>Les racines donnent une part notable de leur sucre aux microbes et aux champignons des mycorhizes, qui leur rendent de l'azote et du phosphore.</li>
  </ul></div>
  <div class="encadre maraicher"><span class="titre-encadre">Pour l'expliquer à un maraîcher</span>
  <p>« En gros, ta plante a deux tuyaux. Un qui monte l'eau et les minéraux, tiré par les feuilles qui transpirent, et un qui emmène le sucre des feuilles vers les fruits et les racines. Le calcium ne monte qu'avec l'eau, du coup le cul noir de la tomate, c'est le plus souvent un problème d'arrosage, pas un sol qui manque de calcium. Et regarde quelles feuilles jaunissent. Si ce sont les vieilles, c'est un élément qui se déplace, souvent l'azote ou le magnésium. Si ce sont les jeunes, c'est plutôt le fer, le calcium ou le bore. »</p></div>
</div>

<p class="surtitre">Séance 7 · De l'azote aux protéines</p>
<h1>Que fait la plante de l'azote qu'elle prend ?</h1>
<p class="chapo">La racine prend surtout du nitrate et de l'ammonium, et un peu d'acides aminés. Pour en faire des protéines, la plante doit d'abord changer le nitrate en ammonium, ce qui lui coûte cher, puis accrocher l'ammonium à des molécules tirées du sucre. Chaque étape coûte de l'énergie, des électrons ou du sucre. C'est pour ça que l'azote sert mal quand la lumière manque, et que tout se dérègle quand il arrive plus vite que le sucre.</p>

<!-- Partie 1 -->
<h2><span class="partie-num">Partie 1 sur 4</span>Sous quelle forme la racine prend-elle l'azote ?</h2>
<p>La racine prend surtout du nitrate, NO₃⁻, et de l'ammonium, NH₄⁺, et un peu d'<span class="t" data-t="acide-amine">acides aminés</span>. Aucune de ces formes n'est gratuite. Pour savoir laquelle convient le mieux, il faut regarder ce qu'il reste à faire à la plante pour en tirer des protéines, et ce que ça lui coûte.</p>

<h3>Le nitrate arrive facilement, mais il faut le transformer</h3>
<p>Dans une terre cultivée, tiède et aérée, les bactéries changent vite l'ammonium en nitrate (séance 5). Et comme la terre ne retient pas le nitrate (séance 3), il circule avec l'eau jusqu'aux racines. C'est donc surtout lui que la racine trouve.</p>
<p>Seulement, son azote est entouré d'oxygènes. Avant de s'en servir, la plante doit le transformer en ammonium, et ça lui coûte cher, on le verra dans la partie 2. Le nitrate a quand même un gros avantage. Il n'est pas toxique, alors la plante n'est pas pressée. Elle peut le transformer tout de suite dans la racine, l'envoyer vers les feuilles par le xylème, ou le ranger en réserve dans ses <span class="t" data-t="vacuole">vacuoles</span>, ces grandes poches d'eau qui occupent la plus grande partie d'une cellule de feuille. Elle pourra le reprendre plus tard. Retiens-le bien, on en reparle à la séance 8.</p>

<h3>L'ammonium est presque prêt à servir, mais la plante doit l'accrocher tout de suite</h3>
<p>Dans l'ammonium, l'azote n'a aucun oxygène autour de lui, comme dans les protéines. La plante n'a pas à le transformer, et elle fait une grosse économie.</p>
<p>Mais il a ses défauts. D'abord, il est toxique s'il reste libre, on verra pourquoi dans la partie 3. La racine doit donc l'accrocher aussitôt, sur place, à un squelette de carbone, c'est-à-dire un morceau de molécule tiré du sucre que lui envoient les feuilles. Du coup, une plante nourrie à l'ammonium dépense dans ses racines du sucre qui les aurait fait grandir. Ensuite, l'ammonium est un cation. Pour le prendre, la racine rejette un ion H⁺ en échange, et ça acidifie la terre autour d'elle. Avec le nitrate, c'est l'inverse, la racine rejette un peu de base, et la terre autour d'elle devient moins acide.</p>
<p>Donné seul et à forte dose, l'ammonium rend malades la plupart des légumes, et la tomate y est particulièrement sensible. Les feuilles jaunissent et se tachent, les racines poussent mal. Une racine qui prend beaucoup d'ammonium prend moins de potassium, de calcium et de magnésium, qui sont aussi des cations, et chez la tomate, le cul noir devient plus fréquent (séance 6). La racine laisse aussi ressortir une grande partie de l'ammonium qu'elle vient de prendre, puis elle le reprend aussitôt. Sur de jeunes orges qui recevaient beaucoup d'ammonium, les racines respiraient 40 % de plus qu'avec peu d'ammonium, et on soupçonne ce va-et-vient d'y être pour quelque chose.</p>
<p>En bio, ça arrive rarement. On le voit surtout après de fortes doses de fientes ou de lisier sur une terre froide, où l'ammonium tarde à devenir nitrate.</p>

<h3>La racine prend aussi un peu d'azote organique</h3>
<p>On l'a vu à la séance 1, les microbes découpent les protéines de la matière organique en acides aminés avant d'en libérer l'ammonium. La racine sait prendre une partie de ces acides aminés tels quels. Pour elle, c'est l'idéal, puisqu'un acide aminé est déjà une brique de protéine. On a d'abord vu des plantes le faire dans la toundra et les forêts du Grand Nord, où le sol froid libère peu d'ammonium et de nitrate, puis dans des champs cultivés.</p>
<p>Dans une terre de maraîchage, les acides aminés n'apportent sans doute qu'une petite part de l'azote d'un légume. Il y en a peu dans l'eau du sol, et les microbes les mangent en quelques heures, bien plus vite que la racine ne les prend. Les chercheurs ne savent pas encore mesurer quelle part de son azote un légume prend sous cette forme. Certains pensent même que la racine reprend surtout de cette façon les acides aminés qu'elle a elle-même laissé sortir avec ses exsudats (séance 6).</p>
<p>L'urée, celle de l'urine fraîche, est un autre cas. La racine sait la prendre, mais dans le sol, une enzyme la change en ammonium en quelques jours, et c'est surtout sous cette forme qu'elle nourrit la plante. Dans un lisier qui a attendu dans la fosse, elle est même déjà devenue ammonium. Quant à l'ammoniac, c'est un gaz. Dans le sol, il redevient ammonium, ou il s'envole (séance 5).</p>

<h3>Le mieux, c'est un mélange où le nitrate domine</h3>
<p>En culture hors sol, on règle exactement ce que reçoit la racine, et c'est là qu'on a pu comparer. La plupart des légumes y poussent mieux avec beaucoup de nitrate et un peu d'ammonium qu'avec l'un des deux seul. Les deux se complètent. L'ammonium fait économiser du sucre, le nitrate évite qu'il y ait trop d'ammonium, et leurs effets sur l'acidité autour de la racine s'équilibrent. Dans les solutions nutritives des serres de tomates, environ 10 % de l'azote est en ammonium, pas plus. Quelques plantes des sols acides, comme la myrtille, préfèrent au contraire l'ammonium.</p>

<!-- Partie 2 -->
<h2><span class="partie-num">Partie 2 sur 4</span>Pourquoi transformer le nitrate coûte du sucre ?</h2>
<p>Pour faire une protéine, la plante a besoin d'azote sous la forme de l'ammonium. Le nitrate doit donc d'abord devenir ammonium. Et cette transformation demande de lui rendre quelque chose qu'il a perdu.</p>

<h3>Réduire, c'est faire gagner des électrons</h3>
<p>À la séance 1, on a vu que les atomes peuvent perdre ou gagner des électrons. Les chimistes ont deux mots pour ça. Quand un atome perd des électrons, on dit qu'il est oxydé. Quand il en gagne, on dit qu'il est réduit, et l'opération s'appelle une <span class="t" data-t="reduction">réduction</span>. Le mot vient des métallurgistes, pour qui réduire un minerai voulait dire le ramener à l'état de métal.</p>
<p>Dans le nitrate, l'azote est entouré de trois oxygènes, qui tirent très fort sur ses électrons et les lui prennent presque. Dans l'ammonium, il est entouré de quatre hydrogènes, qui tirent moins fort que lui et lui laissent leurs électrons. Passer du nitrate à l'ammonium, c'est donc rendre 8 électrons à l'azote. On dit que la plante réduit le nitrate.</p>
<div class="equation">NO₃⁻ → NO₂⁻ → NH₄⁺<small>2 électrons gagnés, puis 6 de plus, soit 8 pour chaque atome d'azote.</small></div>
<p>Ce sont exactement les 8 électrons que les bactéries de la séance 5 avaient arrachés à l'ammonium pour en vivre. La plante doit les rendre, et ça lui coûte.</p>

<h3>Deux enzymes font le travail</h3>
<p>La première étape est faite par une <span class="t" data-t="enzyme">enzyme</span>, la <span class="t" data-t="nitrate-reductase">nitrate réductase</span>. Elle change le nitrate en nitrite en lui donnant 2 électrons. Elle contient un atome de molybdène, sans lequel elle ne marche pas. Une plante qui manque de molybdène accumule donc du nitrate et montre des signes de manque d'azote. C'est ce qui arrive au chou-fleur en sol acide, avec ses feuilles étroites et tordues qu'on appelle la queue de fouet.</p>
<p>La seconde étape est faite par la nitrite réductase, dans les chloroplastes des feuilles, ou dans de petits grains du même genre dans les racines. Elle donne 6 électrons de plus et change le nitrite en ammonium. Elle travaille vite, parce que le nitrite est toxique et ne doit pas s'accumuler.</p>

<h3>Les électrons viennent de la lumière ou du sucre</h3>
<p>Ces électrons, il faut bien les prendre quelque part. Dans une feuille au soleil, ils viennent directement de la photosynthèse, de l'eau cassée par la lumière (séance 6). Quand la lumière est forte, la feuille en a souvent plus qu'il ne lui en faut pour faire du sucre, et réduire le nitrate ne lui coûte presque rien de plus. Dans une racine, ou dans une feuille à l'ombre ou par temps gris, la plante doit brûler du sucre pour les obtenir, en respirant.</p>
<p>Dans les racines, on a pu mesurer ce que ça coûte. Chez l'orge, à peu près un quart du sucre que brûle la racine lui sert à prendre le nitrate et à le transformer. Quand elle reçoit de l'ammonium, c'est un septième environ. C'est une seule espèce et une seule expérience, mais ça donne une idée de l'écart.</p>
<p>Selon les espèces, le nitrate est réduit surtout dans les racines ou surtout dans les feuilles. Chez beaucoup de légumes, comme la tomate, une bonne part monte jusqu'aux feuilles avant d'être réduite, et plus la racine en reçoit, plus il en monte.</p>

<!-- Partie 3 -->
<h2><span class="partie-num">Partie 3 sur 4</span>Comment l'azote devient acide aminé, puis protéine ?</h2>
<p>Que l'azote ait été pris en ammonium ou qu'il vienne du nitrate réduit, il se retrouve sous forme d'ammonium dans la cellule. Or l'ammonium libre est toxique.</p>

<h3>L'ammonium libre dérègle la cellule</h3>
<p>Quand il s'accumule, l'ammonium perturbe les membranes de la cellule, ces fines enveloppes dont elle se sert pour fabriquer son énergie. La plante ne le laisse donc pas traîner. Elle l'accroche aussitôt à un squelette de carbone.</p>

<h3>L'azote entre par la glutamine et le glutamate</h3>
<p>Elle le fait en deux temps, avec deux enzymes qui travaillent en équipe. Les biologistes les appellent GS et GOGAT.</p>
<ul>
  <li>La première accroche l'ammonium à un acide aminé déjà présent, le glutamate. Il en sort de la glutamine, qui porte maintenant deux atomes d'azote. Cette étape demande de l'énergie.</li>
  <li>La seconde prend un des deux azotes de la glutamine et le pose sur un squelette de carbone. Elle a besoin de 2 électrons de plus. Il en sort deux glutamates.</li>
</ul>
<p>Au bout du compte, un ammonium et un squelette de carbone sont devenus un glutamate de plus. Et l'autre glutamate repart au début de la chaîne, pour attraper l'ammonium suivant.</p>

<h3>La plante fabrique une vingtaine d'acides aminés, puis les protéines</h3>
<p>Le glutamate sert ensuite de distributeur. D'autres enzymes lui prennent son azote pour le poser sur d'autres squelettes de carbone, et la plante fabrique ainsi la vingtaine d'acides aminés dont elle a besoin. Tous contiennent du carbone, de l'hydrogène, de l'oxygène et de l'azote. Deux d'entre eux contiennent aussi du soufre, et on y revient à la séance 9.</p>
<p>Les acides aminés sont les briques des <span class="t" data-t="proteine">protéines</span>. La cellule les enfile les uns derrière les autres, comme des perles sur un fil, en suivant le plan écrit dans ses gènes. Une protéine est souvent faite de plusieurs centaines d'acides aminés. Le fil se replie ensuite sur lui-même en une forme précise, et c'est cette forme qui lui permet de faire son travail.</p>
<p>Beaucoup de protéines sont des enzymes, les outils de la cellule. Chacune fait une réaction précise, ou une toute petite famille de réactions. La nitrate réductase, la nitrogénase des nodosités et les deux enzymes qu'on vient de voir en sont.</p>

<h3>La Rubisco contient une grande part de l'azote d'une feuille</h3>
<p>La plus abondante des enzymes d'une feuille est la <span class="t" data-t="rubisco">Rubisco</span>, celle qui accroche le gaz carbonique de l'air au début de la fabrication du sucre. Elle travaille lentement, alors la plante en fabrique énormément. Chez la plupart des plantes, elle représente de 20 à 30 % de tout l'azote d'une feuille, et près de la moitié de ses protéines solubles. C'est sans doute la protéine la plus abondante sur Terre.</p>
<p>Voilà pourquoi azote et photosynthèse vont ensemble. Une feuille bien nourrie en azote a plus de Rubisco, et elle capte plus de gaz carbonique. Et quand l'azote manque, la plante démonte la Rubisco de ses vieilles feuilles pour envoyer leur azote aux jeunes, par le phloème. Les vieilles feuilles jaunissent, c'est le signe que tu as vu à la séance 6.</p>

<!-- Partie 4 -->
<h2><span class="partie-num">Partie 4 sur 4</span>Que se passe-t-il quand l'azote arrive plus vite que le sucre ?</h2>
<p>Reprends le chemin du schéma. Chaque étape a besoin de quelque chose que fournit la photosynthèse, des électrons, de l'énergie ou des squelettes de carbone. L'azote ne devient protéine que si le sucre suit.</p>

<h3>Sans assez de lumière, le nitrate s'entasse</h3>
<p>Quand la lumière manque, en hiver, sous un ciel gris ou sous un tunnel ombré, la feuille a peu d'électrons en trop et peu de sucre. La nitrate réductase ralentit, et la plante en fabrique même moins. Le nitrate continue pourtant d'entrer par les racines si le sol en est riche. Il s'entasse alors dans les vacuoles.</p>
<p>La plante a d'ailleurs une raison de le garder là. Pour rester ferme, une cellule doit retenir son eau, et elle le fait grâce aux molécules dissoutes dans sa vacuole, qui attirent l'eau. En temps normal, les sucres jouent ce rôle. Quand ils manquent, le nitrate les remplace.</p>

<h3>Trop d'engrais rapide donne le même résultat</h3>
<p>On a le même déséquilibre quand l'azote arrive trop vite, par exemple après un gros apport de sang séché ou de fientes sur une terre tiède. La racine prend plus d'azote que la feuille ne fabrique de sucre. Le nitrate s'accumule, et les étapes suivantes s'engorgent elles aussi. La plante fabrique des acides aminés mais n'arrive pas à tous les assembler en protéines. Ils restent libres dans les cellules et dans la sève, surtout sous forme de glutamine et d'asparagine, deux acides aminés qui portent chacun deux atomes d'azote.</p>

<h3>La plante pousse, mais elle reste tendre</h3>
<p>Une plante dans cet état pousse vite et devient vert foncé, et on pourrait croire que c'est bon signe. Mais son sucre part dans les acides aminés plutôt que dans ses parois, et ses tissus sont gorgés d'eau, de nitrate et d'acides aminés libres. Pourquoi ça la fragilise, pourquoi ça attire les pucerons, et pourquoi les salades d'hiver sont les plus concernées, c'est le sujet de la séance 8.</p>
<p>Retiens la règle de cette séance. L'azote et la lumière vont ensemble. Plus une plante a de lumière, mieux elle sait se servir de l'azote qu'on lui donne.</p>

<p class="surtitre">Séance 8 · L'excès d'azote</p>
<h1>Pourquoi trop de nitrate fragilise une plante ?</h1>
<p class="chapo">Une plante qui reçoit plus d'azote qu'elle ne peut en transformer met son sucre dans de nouvelles feuilles au lieu de le mettre dans ses parois. Elle devient tendre et gorgée d'eau, et sa sève nourrit mieux les pucerons. L'hiver, le nitrate qu'elle n'a pas transformé reste dans ses feuilles, jusque dans l'assiette.</p>

<!-- Partie 1 -->
<h2><span class="partie-num">Partie 1 sur 4</span>Pourquoi une plante trop poussée a des tissus tendres ?</h2>
<p>À la séance 7, on a vu que transformer le nitrate en protéines coûte du sucre. Or la plante ne fabrique chaque jour qu'une quantité de sucre limitée, qui dépend surtout de la lumière (séance 6). Toute cette séance tourne autour d'une question. Que fait-elle de ce sucre quand l'azote arrive en trop ?</p>

<h3>Le sucre sert à deux choses à la fois</h3>
<p>Une partie du sucre sert à bâtir les <span class="t" data-t="paroi">parois</span> des cellules. Chaque cellule de la plante est entourée d'une paroi, un peu comme un carton autour d'un ballon. Cette paroi est faite surtout de cellulose, de longues chaînes de glucose accrochées bout à bout. Dans les tiges et les nervures, la plante la renforce avec de la <span class="t" data-t="lignine">lignine</span>, une matière dure qui fait le bois et les fibres, et que la plante fabrique elle aussi à partir de ses sucres.</p>
<p>L'autre partie du sucre sert de squelette aux <span class="t" data-t="acide-amine">acides aminés</span>. La plante y accroche l'azote, puis elle les enchaîne en <span class="t" data-t="proteine">protéines</span>. C'est cette partie-là qui fait les nouvelles feuilles et les nouvelles tiges, autrement dit la croissance.</p>

<h3>Quand l'azote abonde, la croissance passe avant les parois</h3>
<p>La racine continue de prendre du nitrate tant qu'il y en a dans l'eau du sol, souvent bien au-delà de ce dont la plante a besoin. Pour transformer cet azote, la plante puise dans son sucre. Elle fait alors des feuilles en masse, grandes et vert foncé, et il reste moins de sucre pour les parois. Les cellules grossissent vite, se remplissent d'eau, et leurs parois restent minces.</p>
<p>Au champ, la plante a l'air superbe, avec un feuillage abondant et d'un vert sombre. Mais ses tissus sont tendres, ils se froissent et cassent facilement, et ils contiennent plus d'eau et moins de <span class="t" data-t="matiere-seche">matière sèche</span>.</p>

<h3>Une plante trop poussée fait des feuilles avant les fruits</h3>
<p>Le même partage se joue entre les feuilles et les fruits. Les fruits sont des puits de sucre (séance 6), en concurrence avec les nouvelles pousses. Une tomate ou une courgette qui reçoit trop d'azote au départ pousse en feuilles, fleurit plus tard, et ses premières fleurs coulent plus souvent. Les maraîchers disent qu'elle est trop vigoureuse, ou trop végétative.</p>
<p>Les légumes de garde en souffrent aussi. Un oignon, un chou ou une carotte trop nourris en azote ont des tissus plus tendres et plus riches en eau, et ils se conservent moins bien.</p>

<!-- Partie 2 -->
<h2><span class="partie-num">Partie 2 sur 4</span>Pourquoi les pucerons aiment les plantes trop nourries ?</h2>
<p>Une plante tendre et gorgée d'eau n'est pas seulement fragile au vent. Elle est aussi plus facile à manger, pour les insectes qui piquent comme pour les champignons.</p>

<h3>Le puceron boit une sève trop sucrée pour lui</h3>
<p>Le puceron enfonce son stylet, une sorte de paille très fine, jusque dans le <span class="t" data-t="phloeme">phloème</span>, le circuit qui transporte les sucres dans la plante (séance 6). Cette sève est très riche en sucre et pauvre en azote. Pour un puceron, c'est un peu comme manger des bonbons quand on a besoin de viande. Il doit en boire énormément pour trouver assez d'acides aminés, et il rejette le sucre en trop. C'est le miellat qui colle aux feuilles, et sur lequel pousse la fumagine, ce dépôt noir comme de la suie.</p>

<h3>Une plante trop nourrie lui sert des acides aminés</h3>
<p>On l'a vu à la séance 7. Quand l'azote arrive plus vite que le sucre, la plante n'arrive pas à tout transformer en protéines, et des acides aminés libres circulent dans sa sève. Pour le puceron, c'est un repas bien plus complet. Il grossit plus vite, il fait plus de petits, et la colonie grandit plus vite.</p>
<p>Une méta-analyse publiée en 2012, qui reprend un grand nombre d'études, va dans ce sens. Les engrais favorisent les insectes qui mangent les plantes, et beaucoup plus nettement ceux qui piquent la sève, comme les pucerons, que ceux qui mâchent les feuilles.</p>

<h3>Un essai du CTIFL sur fraise l'a vérifié</h3>
<p>Au centre CTIFL de Lanxade, en Dordogne, des fraisiers Gariguette cultivés hors-sol ont reçu quatre solutions nutritives en 2023. L'une avait 30 % d'azote en moins pendant la pousse des feuilles, 60 % en moins pendant la production, et plus de calcium. Le 26 avril, ces fraisiers portaient 15 pucerons par feuille, contre 57 avec la solution habituelle. Et le rendement du premier jet, autour de 285 g par plant, n'a pas baissé. Les auteurs pensent que le calcium aide aussi, en rendant les tissus plus solides et en aidant la plante à refermer le vaisseau que le puceron a percé.</p>
<p>Les chercheurs restent prudents, et tu peux l'être aussi. Les pucerons ont fini par exploser partout, même avec moins d'azote. L'année suivante, la même solution a fait perdre du rendement sur la remontée, et elle rend les fraises un peu moins acides. Baisser l'azote ne remplace donc pas la protection des cultures. Les auteurs y voient un levier de plus, à combiner avec les autres moyens de lutte.</p>

<h3>Les champignons profitent eux aussi des tissus tendres, mais pas tous</h3>
<p>Pour les maladies, le tableau est moins simple. Un feuillage dense et tendre garde l'humidité, des parois minces se percent plus facilement, et certaines maladies en profitent. Sur la laitue, l'INRA et le CTIFL ont étudié pendant plusieurs années l'effet de l'azote sur les maladies, avec 28 essais répartis dans les régions de production. Moins d'azote, c'était moins de pourriture du collet (Botrytis et Sclerotinia), moins de mildiou et moins de pucerons.</p>
<p>Sur la tomate, les mêmes équipes ont trouvé l'inverse pour la pourriture grise. Une tomate bien nourrie en azote avait moins de Botrytis sur les tiges, mais plus d'oïdium, et presque autant de ravageurs. Trop d'azote ne rend donc pas la plante plus fragile face à toutes les maladies. Son effet sur les champignons change d'une maladie et d'une culture à l'autre. Pour la laitue, les chercheurs retiennent que trop d'azote l'expose à la plupart de ses maladies et de ses ravageurs. Pour la tomate, ils conseillent quand même de modérer les doses par rapport aux pratiques courantes.</p>
<p>Certains vont beaucoup plus loin, et pensent qu'une plante bien équilibrée n'attire presque pas les parasites. C'est l'idée de la <span class="t" data-t="trophobiose">trophobiose</span>, qu'on verra à la séance 11, avec ce qui est prouvé et ce qui ne l'est pas.</p>

<h2><span class="partie-num">Partie 3 sur 4</span>Pourquoi les salades d'hiver se chargent en nitrate ?</h2>
<p>Avec la même fumure, une laitue de décembre contient nettement plus de nitrate qu'une laitue de juin. La différence vient surtout de la lumière.</p>

<h3>En hiver, la feuille manque de sucre</h3>
<p>Transformer le nitrate demande du sucre et de l'énergie, et les deux viennent de la lumière. En décembre, une laitue reçoit plusieurs fois moins de lumière qu'en juin, et encore moins sous un tunnel. Elle fabrique peu de sucre, et sa <span class="t" data-t="nitrate-reductase">nitrate réductase</span>, l'enzyme qui change le nitrate en nitrite (séance 7), travaille au ralenti. La lumière la met en route, et elle s'arrête presque dans le noir.</p>
<p>Pendant ce temps, la racine continue de prendre du nitrate, surtout si la terre en est riche.</p>

<h3>Le nitrate en trop sert à retenir l'eau</h3>
<p>Le nitrate qu'elle ne transforme pas, la plante le range dans ses <span class="t" data-t="vacuole">vacuoles</span>, les grandes poches d'eau qui remplissent ses cellules. Et il y sert à quelque chose. Une cellule retient son eau, et reste ferme, grâce à ce qui est dissous dans sa vacuole. D'habitude, ce sont surtout des sucres et des acides de la plante. Quand le sucre manque, le nitrate prend sa place. Une salade d'hiver bien ferme et bien verte peut donc être pleine de nitrate sans que rien ne se voie.</p>

<h3>L'Europe limite le nitrate des salades et des épinards</h3>
<p>Le nitrate n'est pas toxique en lui-même. Mais une partie se change en nitrite dans la bouche et dans le corps, et c'est le nitrite qui pose problème. Pour les experts européens, on peut avaler sans risque jusqu'à 3,7 mg de nitrate par jour et par kilo de son poids, soit environ 260 mg pour une personne de 70 kg. Pour le nitrite, leur limite est environ cinquante fois plus basse. Ils estiment aussi que les bienfaits des légumes l'emportent sur ce risque.</p>
<p>L'Union européenne fixe donc des teneurs maximales pour les légumes-feuilles qui en accumulent le plus. Elles sont dans le règlement (UE) 2023/915, qui a repris les chiffres du règlement de 2006 qu'il remplace.</p>

<p>Les limites d'hiver et sous abri sont plus hautes, parce que le manque de lumière fait monter le nitrate même avec une fumure soignée. Une laitue d'abri doit être étiquetée comme telle, sinon c'est la limite du plein air qui s'applique. Pour te faire une idée, 5 000 mg par kilo, c'est 5 g de nitrate dans un kilo de salade. Une portion de 100 g d'une laitue à 4 000 mg par kilo en apporte 400 mg.</p>

<h3>L'heure de la récolte change peu le nitrate</h3>
<p>Le nitrate de la feuille bouge un peu au fil de la journée. La nuit, la racine continue d'en prendre, et la feuille en stocke. Le jour, la lumière relance la nitrate réductase, et la feuille en transforme une partie. Mais dans les essais sur laitue, l'écart reste petit. Récolter l'après-midi plutôt qu'à l'aube fait baisser le nitrate d'une dizaine de pour cent au mieux, et en hiver, souvent pas du tout.</p>

<!-- Partie 4 -->
<h2><span class="partie-num">Partie 4 sur 4</span>Comment apporter l'azote sans en mettre trop ?</h2>
<p>Tout ce qu'on vient de voir a la même cause. La plante reçoit plus d'azote qu'elle ne peut en transformer au moment où il arrive. Pour l'éviter, on calcule ce qu'il faut vraiment apporter, on l'apporte quand la culture en a besoin, et on vérifie en cours de route.</p>

<h3>On part du besoin, puis on retire ce que le sol donne déjà</h3>
<p>Le bilan d'azote se lit comme un budget. D'un côté, il y a le besoin de la culture, qui dépend du rendement que tu vises. De l'autre, il y a tout l'azote qui arrive sans que tu achètes rien.</p>
<ul>
  <li>L'azote que le sol libère en minéralisant sa matière organique (séance 4), plus abondant sous abri et quand la terre est chaude.</li>
  <li>L'azote des résidus du précédent, la culture qui occupait la planche juste avant.</li>
  <li>L'<span class="t" data-t="engrais-vert">engrais vert</span>, surtout s'il contenait des légumineuses.</li>
  <li>L'<span class="t" data-t="arriere-effet">arrière-effet</span> des apports de l'an dernier, la part de leur azote qui se libère cette année.</li>
</ul>
<p>Ce qui manque encore, c'est ce que l'engrais doit apporter, et seulement ça. Pour un engrais organique, on ne prend en compte que son <span class="t" data-t="azote-efficace">azote efficace</span> de la première année, la part que la culture pourra vraiment prendre (séance 5). Voici un exemple pour fixer les idées, avec une tomate sous abri.</p>
<table>
  <thead><tr><th>Ligne du bilan</th><th>kg d'azote par hectare</th></tr></thead>
  <tbody>
    <tr><td>Besoin de la tomate, pour 11 kg par m²</td><td>300</td></tr>
    <tr><td>Azote libéré par le sol</td><td>− 100</td></tr>
    <tr><td>Résidus du précédent</td><td>− 25</td></tr>
    <tr><td>Arrière-effet de l'an dernier</td><td>− 15</td></tr>
    <tr><td><b>Reste à apporter</b></td><td><b>160</b></td></tr>
  </tbody>
</table>
<p>Dix tonnes de compost de bovins ne donnent que 14 kg d'azote efficace la première année. Pour tout apporter avec ce compost, il en faudrait plus de 110 tonnes par hectare. C'est pour ça qu'on associe un compost pour le fond et un engrais plus rapide pour le reste.</p>

<h3>On apporte l'azote rapide en plusieurs fois</h3>
<p>Le sang séché, la farine de plume ou les tourteaux libèrent leur azote en quelques semaines quand la terre est tiède (séance 5). Si tu mets toute la dose d'un coup, la plante en reçoit trop au début, avec tout ce qu'on vient de voir, et le reste risque de partir avec l'eau. On fait donc un <span class="t" data-t="fractionnement">fractionnement</span>. On met une partie de la dose à la plantation, et le reste en un ou deux apports, quelques semaines avant le moment où la culture en prend le plus, le temps que les microbes libèrent l'azote. Pour une tomate, c'est vers la nouaison des premiers bouquets.</p>
<p>Pour le fond, une forme lente comme un compost nourrit la vie du sol et libère son azote tout au long de la saison, sans à-coups. Fractionner demande un peu plus de passages, mais c'est comme ça que la plante n'est ni affamée ni gavée.</p>

<h3>On mesure le nitrate avec des bandelettes</h3>
<p>Le calcul donne une dose de départ. Pour savoir où tu en es en cours de culture, il existe une mesure simple, les bandelettes de nitrate. On les lit en comparant leur couleur à une échelle, ou avec un petit appareil comme le Nitrachek. On s'en sert de deux façons.</p>
<ul>
  <li><b>Dans le sol.</b> Tu mélanges un peu de terre de la planche avec de l'eau, tu laisses reposer, et tu trempes la bandelette dans l'eau claire. Tu sais alors s'il reste du nitrate pour la culture avant de refaire un apport.</li>
  <li><b>Dans la plante.</b> Tu coupes des pétioles, la petite tige qui porte chaque feuille, tu en presses le jus et tu le mesures. Le <span class="t" data-t="jus-petiole">jus de pétiole</span> montre ce que la plante a pris ces derniers jours.</li>
</ul>
<p>On compare ensuite le chiffre à une grille de références, propre à chaque culture et à chaque stade, comme celles du CTIFL ou des chambres d'agriculture. Si le chiffre est haut, tu peux attendre. S'il chute, il est temps de refaire un apport.</p>

<p class="surtitre">Séance 9 · Soufre et oligo-éléments</p>
<h1>À quoi servent le soufre et les oligo-éléments ?</h1>
<p class="chapo">Le soufre entre dans les protéines avec l'azote. Sans lui, le nitrate s'accumule comme s'il y avait trop d'azote. Les oligo-éléments, eux, servent surtout de pièce centrale aux enzymes. C'est pour ça qu'une pincée suffit. Mais sans cette pincée, toute la plante souffre.</p>

<!-- Partie 1 -->
<h2><span class="partie-num">Partie 1 sur 4</span>Pourquoi le soufre va avec l'azote ?</h2>
<p>À la séance 7, on a vu que la plante accroche l'azote sur des squelettes de sucre pour faire des <span class="t" data-t="acide-amine">acides aminés</span>, puis qu'elle les enchaîne en <span class="t" data-t="proteine">protéines</span>. Il manquait un détail. Pour finir certaines de ces briques, l'azote ne suffit pas, il faut aussi du soufre.</p>

<h3>Deux acides aminés portent un atome de soufre</h3>
<p>Sur la vingtaine d'acides aminés qui forment les protéines, deux contiennent un atome de soufre, la cystéine et la méthionine.</p>
<div class="equation">C₃H₇NO₂S<small>C'est la cystéine. Chaque molécule porte un atome d'azote et un atome de soufre. La méthionine, C₅H₁₁NO₂S, en a aussi un de chaque.</small></div>
<p>On les trouve dans presque toutes les protéines. La cystéine y joue souvent un rôle clé, parce que deux cystéines peuvent s'accrocher l'une à l'autre par leur soufre, et tenir la protéine pliée dans la bonne forme.</p>
<p>La racine prend le soufre sous forme de sulfate, SO₄²⁻, un <span class="t" data-t="anion">anion</span> (séance 1). Comme pour le nitrate, la plante doit le <span class="t" data-t="reduction">réduire</span> avant de s'en servir, et ça lui coûte aussi de l'énergie.</p>

<h3>Sans soufre, l'azote ne devient pas protéine</h3>
<p>Dans la plupart des plantes, il y a de 12 à 15 kilos d'azote pour 1 kilo de soufre, et chez les choux, plutôt de 5 à 10. Si le soufre manque, la plante a beau avoir de l'azote, elle ne peut pas finir ses protéines. Le nitrate et les acides aminés sans soufre s'accumulent alors dans ses feuilles, exactement comme quand l'azote arrive trop vite (séance 8). Une salade qui manque de soufre peut donc être chargée en nitrate sans avoir reçu trop d'azote.</p>
<p>La plante pâlit et jaunit, comme si elle manquait d'azote. Mais le soufre se déplace mal dans la plante, et ce sont souvent les jeunes feuilles qui jaunissent d'abord, alors qu'un manque d'azote jaunit d'abord les vieilles (séance 6).</p>

<h3>Les choux et les alliacées en demandent beaucoup</h3>
<p>Le goût piquant de la moutarde, du radis et du chou vient de molécules soufrées, les glucosinolates. Le goût de l'ail, de l'oignon et du poireau vient lui aussi de molécules soufrées, mais d'une autre famille. Quand on coupe ces légumes, elles se libèrent, et chez l'oignon, l'une d'elles part en gaz et fait pleurer. Ces familles mettent donc du soufre ailleurs que dans leurs protéines, et elles en demandent nettement plus que les autres légumes. Un chou qui en manque reste pâle, et il perd une partie de son goût.</p>

<h3>Le sulfate part avec la pluie, comme le nitrate</h3>
<p>Le sulfate est un anion, et le sol retient très mal les anions (séance 3). Il part donc en profondeur avec les pluies d'hiver, un peu comme le nitrate.</p>
<p>Dans la terre, plus de 90 % du soufre se trouve dans la <span class="t" data-t="matiere-organique">matière organique</span>. Les microbes le libèrent en sulfate quand ils la mangent, comme ils le font pour l'azote (séance 4). Un sol bien pourvu en matière organique, qui reçoit du compost, manque donc rarement de soufre.</p>
<p>L'air en apportait beaucoup autrefois. Les fumées des centrales au charbon, des usines et du fioul retombaient avec la pluie. En France, les rejets de dioxyde de soufre ont baissé de plus de 90 % depuis 1990, et il en retombe très peu sur les champs. On voit donc plus de manques de soufre qu'il y a quarante ans, surtout en terre légère après un hiver pluvieux.</p>
<p>Sur les sacs d'engrais, le soufre est écrit sous forme d'<span class="t" data-t="oxyde">oxyde</span>, SO₃, comme la potasse en K₂O. On verra pourquoi à la séance 12.</p>

<!-- Partie 2 -->
<h2><span class="partie-num">Partie 2 sur 4</span>Comment une si petite dose peut tout changer ?</h2>
<p>Dans une plante, pour un seul atome de molybdène, on trouve environ un million d'atomes d'azote, et quelques milliers d'atomes de fer ou de bore. Et pourtant, sans ce molybdène, un chou-fleur dépérit. La raison tient au métier de ces <span class="t" data-t="oligo">oligo-éléments</span>.</p>

<h3>Ils servent de pièce centrale aux enzymes</h3>
<p>La plupart des oligo-éléments travaillent au cœur des <span class="t" data-t="enzyme">enzymes</span>, les grosses protéines qui font les réactions de la plante. L'atome de métal est logé au centre de l'enzyme, là où se fait la réaction. C'est lui qui gagne ou qui perd des électrons, ou qui tient la molécule à transformer au bon endroit.</p>
<p>Or une enzyme ne s'use pas en travaillant. Elle refait la même réaction des milliers de fois de suite. Il suffit donc de peu d'enzymes, et de très peu de métal. Mais si le métal manque, l'enzyme ne marche plus, et tout ce qui dépend d'elle s'arrête.</p>

<h3>Chaque oligo-élément a son travail</h3>
<p>Le molybdène est au centre de la <span class="t" data-t="nitrate-reductase">nitrate réductase</span>, l'enzyme qui change le nitrate en nitrite (séance 7). Sans lui, une plante nourrie au nitrate reste comme affamée d'azote, avec du nitrate plein les feuilles. Les autres ont chacun leur poste.</p>

<!-- Partie 3 -->
<h2><span class="partie-num">Partie 3 sur 4</span>Quand les oligo-éléments manquent-ils ?</h2>
<p>Un sol qui ne contient presque pas de fer ou de zinc, ça existe, mais c'est rare. Le bore fait exception. Les terres sableuses ou acides, lavées par la pluie, en manquent vraiment, et c'est l'un des oligo-éléments qui manquent le plus souvent aux cultures. Pour les autres, le plus souvent, l'élément est là, et c'est autre chose qui l'empêche d'arriver jusqu'à la plante. On parle alors de <span class="t" data-t="carence-induite">carence induite</span>.</p>

<h3>Le pH décide de presque tout</h3>
<p>On l'a vu à la séance 2. Le fer, le manganèse, le zinc et le cuivre se dissolvent bien en sol <span class="t" data-t="acide">acide</span>, et de moins en moins quand le <span class="t" data-t="ph">pH</span> monte. En sol calcaire, ils forment des composés qui ne se dissolvent presque plus. C'est pour ça que la <span class="t" data-t="chlorose">chlorose</span> ferrique, le jaunissement des jeunes feuilles par manque de fer, est la carence typique des sols calcaires.</p>
<p>Le molybdène fait l'inverse. Il est bloqué en sol acide, et il se libère quand le pH monte. Un <span class="t" data-t="chaulage">chaulage</span> suffit souvent à éviter la maladie du fouet du chou-fleur. Sur des plants déjà touchés, il agit trop lentement, et on apporte plutôt un peu de molybdène, en pépinière ou sur les feuilles.</p>
<p>Le bore est un cas à part. Il se trouve surtout sous forme d'acide borique, une molécule sans charge, que le sol retient mal. Il part donc facilement avec l'eau en sol sableux. Quand le pH monte, le sol le retient davantage, et c'est pour ça qu'un chaulage trop fort le rend moins disponible.</p>

<h3>Un sol froid, mouillé ou sec ralentit tout</h3>
<p>Au printemps, une terre froide et gorgée d'eau ralentit les racines et les microbes. Les oligo-éléments liés à la matière organique se libèrent peu, et la racine en prend moins. Beaucoup de jaunissements de printemps disparaissent tout seuls quand le sol se réchauffe.</p>
<p>La sécheresse joue aussi. Le bore arrive jusqu'à la racine avec l'eau qui circule dans le sol, et dans une terre sèche, il arrive mal.</p>

<h3>Un élément en trop peut en bloquer un autre</h3>
<p>Trop de phosphore gêne le zinc, trop de calcaire gêne le fer, et trop de cuivre gêne aussi le fer. On verra à la séance 10 pourquoi un élément peut en bloquer un autre.</p>

<h3>La feuille qui jaunit te met sur la piste</h3>
<p>On l'a vu à la séance 6, certains éléments se déplacent bien dans la plante, d'autres non. Quand un élément mobile manque, la plante le reprend dans ses vieilles feuilles pour nourrir les jeunes, et ce sont les vieilles qui jaunissent. C'est le cas de l'azote, du phosphore, du potassium et du magnésium. Quand un élément peu mobile manque, comme le fer, le manganèse, le zinc, le bore ou le calcium, ce sont les jeunes feuilles et les pointes qui souffrent en premier, puisque la plante ne peut pas le déplacer.</p>
<p>Mais un symptôme ne suffit pas pour conclure. Plusieurs carences se ressemblent, et un excès d'eau, une maladie ou un coup de froid peuvent donner les mêmes taches. Avant d'acheter un produit, une analyse de feuilles ou de terre vaut mieux qu'un pari.</p>

<!-- Partie 4 -->
<h2><span class="partie-num">Partie 4 sur 4</span>Pourquoi trop de cuivre abîme la vie du sol ?</h2>
<p>En bio, le cuivre est l'un des rares produits efficaces contre le mildiou de la tomate et de la pomme de terre, et contre plusieurs maladies dues à des bactéries. On l'apporte sous forme de <span class="t" data-t="bouillie-bordelaise">bouillie bordelaise</span>, ou d'autres sels de cuivre. Il tue les spores des champignons et les bactéries à la surface des feuilles. Le problème, c'est ce qu'il devient ensuite.</p>

<h3>Le cuivre qui tombe au sol y reste</h3>
<p>Le cuivre s'accroche à l'argile et à l'humus, et il ne part presque pas avec l'eau. Les récoltes n'en emportent que quelques dizaines de grammes par hectare et par an. Il s'accumule donc d'année en année dans la couche de terre travaillée.</p>
<p>Une terre agricole qui n'a pas reçu de cuivre en contient en général entre 5 et 45 mg par kilo. Les vieux sols de vigne, traités à la bouillie bordelaise depuis plus d'un siècle, peuvent en contenir 200, et parfois 500.</p>
<p>Fais le calcul pour un hectare de planches. Les 30 premiers centimètres pèsent environ 4 000 tonnes de terre. 4 kilos de cuivre par an, mélangés dans ces 4 000 tonnes, ajoutent à peu près 1 mg par kilo chaque année. En vingt ans, ça fait 20 mg par kilo de plus. Ce n'est qu'un ordre de grandeur, mais ces 20 mg suffisent à doubler la teneur d'une terre ordinaire.</p>

<h3>Les microbes et les vers de terre en souffrent</h3>
<p>Le cuivre tue les champignons et les bactéries, c'est pour ça qu'on l'emploie. Dans le sol, il ne fait pas le tri. En 2018, une expertise de l'INRA a conclu que ses effets sur les microbes du sol sont bien établis. Pour les vers de terre, les résultats sont plus discutés. Il faut des doses très fortes pour les tuer d'un coup, mais à des teneurs plus faibles, ils mettent plus longtemps à devenir adultes, pondent moins de cocons, et moins de petits en sortent. À la longue, on peut donc s'attendre à moins de vers et à une vie du sol moins active.</p>
<p>Les plantes aussi en souffrent quand il y en a trop. Le cuivre en excès abîme les racines et gêne la photosynthèse, ce qui donne des feuilles jaunes.</p>

<h3>L'Europe limite le cuivre à 28 kg par hectare sur sept ans</h3>
<p>Depuis 2019, un règlement européen limite l'usage du cuivre à 28 kg par hectare sur sept ans, soit 4 kg par an en moyenne. La règle vaut pour toutes les fermes, bio ou non, et chaque pays peut ajouter un plafond de 4 kg pour chaque année. Avant 2019, en bio, on avait droit à 6 kg par hectare et par an. L'autorisation du cuivre a été prolongée jusqu'en juin 2029, le temps que l'Europe réexamine son dossier.</p>
<p>Pour un maraîcher, ça veut dire noter chaque traitement, en grammes de cuivre et pas en grammes de produit. Un kilo de bouillie bordelaise à 20 % de cuivre, c'est 200 g de cuivre. Et ça veut dire garder le cuivre pour les moments où il est vraiment utile.</p>

<h3>Au-delà d'une certaine dose, un élément devient toxique</h3>
<p>À la séance 1, on a vu la <span class="t" data-t="loi-minimum">loi du minimum</span>. C'est l'élément qui manque le plus qui limite la récolte. Le cuivre montre le problème inverse, celui de l'excès. Chaque élément a une plage où il est utile, et au-delà, il devient toxique. Les écologues parlent de loi de tolérance, décrite par l'Américain Victor Shelford en 1913. Pour le bore, cette plage est étroite, et un apport de bore mal dosé brûle les feuilles. Pour le cuivre du sol, le trop-plein s'installe pour longtemps, puisque rien ne l'emporte.</p>

  <ul>
    <li>Le soufre entre dans deux acides aminés, la cystéine et la méthionine. Sans lui, l'azote ne devient pas protéine et le nitrate s'accumule. Il y a 12 à 15 fois plus d'azote que de soufre dans la plupart des plantes, et 5 à 10 fois plus chez les choux.</li>

<p class="surtitre">Séance 10 · Les antagonismes</p>
<h1>Pourquoi un élément en bloque un autre ?</h1>
<p class="chapo">Des éléments qui se ressemblent se disputent les mêmes places dans le sol et les mêmes portes à l'entrée de la racine. Quand l'un d'eux est en excès, il prend la place des autres, et la plante finit par manquer d'un élément qui ne manquait pas dans le sol. C'est ce qu'on appelle un <span class="t" data-t="antagonisme">antagonisme</span>.</p>

<!-- Partie 1 -->
<h2><span class="partie-num">Partie 1 sur 4</span>Pourquoi trop de potasse donne des carences en magnésium ?</h2>

<h3>Les tomates jaunissent par le bas, entre les nervures</h3>
<p>Partons d'un cas que tu as sûrement déjà vu. Sous une serre de tomates, on apporte chaque année du compost ou du fumier, et parfois un engrais riche en <span class="t" data-t="potasse">potasse</span> pour les fruits. Vers le milieu de l'été, les vieilles feuilles du bas jaunissent entre les nervures, qui restent vertes. C'est le signe d'un manque de magnésium. Le magnésium est au centre de la molécule de <span class="t" data-t="chlorophylle">chlorophylle</span>, et quand il manque, la plante le reprend dans ses vieilles feuilles pour nourrir les jeunes (séance 6).</p>
<p>Pourtant, il arrive souvent que l'analyse de terre montre du magnésium en quantité correcte. C'est une <span class="t" data-t="carence-induite">carence induite</span>. Le problème ne vient pas d'un sol pauvre en magnésium, mais de toute la potasse qu'il y a à côté. Un compost de fumier apporte en général plusieurs fois plus de potasse que de magnésium. Et sous abri, la pluie ne lessive rien, si bien que la potasse s'accumule d'année en année. On parle d'antagonisme entre la potasse et le magnésium.</p>

<h3>Dans le sol, ils se disputent les mêmes places</h3>
<p>On l'a vu à la séance 3. L'argile et l'humus portent des charges négatives, et ils retiennent les <span class="t" data-t="cation">cations</span>, K⁺, Ca²⁺, Mg²⁺ ou NH₄⁺, sur ces charges. Le nombre de places est limité, et c'est ce nombre qu'on appelle la <span class="t" data-t="cec">CEC</span>. Quand tu apportes beaucoup de potasse, les ions K⁺ prennent des places, et ils en chassent d'autres cations vers l'eau du sol, dont le magnésium. Une fois dans l'eau, le magnésium peut descendre plus bas avec l'arrosage ou la pluie.</p>

<h3>À l'entrée de la racine, ils se disputent les mêmes portes</h3>
<p>Le second mécanisme se passe à la surface de la racine. Les ions n'y entrent pas n'importe où. Ils passent par des portes, des <span class="t" data-t="proteine">protéines</span> logées dans la membrane des cellules de la racine (séance 7), qu'on appelle des <span class="t" data-t="transporteur">transporteurs</span>. Chaque sorte de transporteur laisse passer certains ions, et des ions qui se ressemblent peuvent emprunter les mêmes. Quand l'eau autour de la racine est pleine de K⁺, ils occupent ces portes, et le magnésium entre moins bien, même s'il y en a.</p>

<p>Il faut bien séparer les deux. Le premier mécanisme se joue dans le sol, et une analyse de terre le montre. Le second se joue à l'entrée de la plante, et seule une analyse de feuilles ou de <span class="t" data-t="jus-petiole">jus de pétiole</span> le montre (séance 8).</p>

<h3>L'ammonium gêne l'entrée du potassium, du calcium et du magnésium</h3>
<p>L'ammonium, NH₄⁺, est un cation de la même taille que K⁺, et il emprunte une partie des mêmes portes. Une plante nourrie surtout à l'ammonium prend moins de potassium, de calcium et de magnésium. Pour la tomate, moins de calcium dans les fruits, c'est plus de nécrose apicale, le cul noir. On l'a vu à la séance 6, le calcium voyage avec l'eau, et il arrive mal aux fruits.</p>
<p>En bio, l'ammonium reste rarement longtemps dans le sol, parce que les bactéries le changent vite en nitrate quand la terre est chaude (séance 5). Mais un gros apport d'engrais organique rapide sur une terre encore froide peut en laisser beaucoup d'un coup.</p>

<h3>Potasse, calcium et magnésium forment un trio</h3>
<p>Le calcium et le magnésium se disputent eux aussi les places du sol, et un <span class="t" data-t="chaulage">chaulage</span> très riche en calcium peut aggraver un manque de magnésium. Trop de potasse gêne aussi l'entrée du calcium. Ce qu'on donne en trop à l'un, on le prend un peu aux deux autres.</p>

<!-- Partie 2 -->
<h2><span class="partie-num">Partie 2 sur 4</span>Pourquoi le phosphore reste coincé dans le sol ?</h2>

<h3>Le phosphate s'accroche au fer, à l'aluminium ou au calcium</h3>
<p>La racine prend le phosphore sous forme d'ions phosphate, comme H₂PO₄⁻ (séance 1). Mais ces ions ne restent pas longtemps libres dans l'eau du sol. Ils s'accrochent vite à d'autres éléments, et forment des composés qui ne se dissolvent presque plus.</p>
<ul>
  <li>En sol acide, ils s'accrochent au fer et à l'aluminium.</li>
  <li>En sol calcaire, ils s'accrochent au calcium, et forment des phosphates de calcium, de la même famille que la roche des phosphates naturels.</li>
</ul>
<p>C'est pour ça que le phosphore est le plus disponible quand le <span class="t" data-t="ph">pH</span> est entre 6 et 7, parce que ni le fer, ni l'aluminium, ni le calcium ne le retiennent trop (séance 2). Les agronomes disent que le phosphore est « fixé » ou « rétrogradé ». Ça n'a rien à voir avec la fixation de l'azote de l'air par les légumineuses (séance 5).</p>

<h3>Le phosphore d'un engrais n'est pas perdu, il attend</h3>
<p>L'année de l'apport, une culture ne prend souvent qu'une petite part du phosphore de l'engrais, de l'ordre de 10 à 25 %. Le reste est retenu dans le sol. Mais il n'est pas perdu, il forme une réserve qui se libère lentement au fil des années, et sur une longue période, les cultures finissent par en reprendre une grande partie.</p>
<p>Le phosphore bouge aussi très peu dans la terre. Il ne se déplace que d'un millimètre ou deux, et c'est la racine qui doit aller le chercher.</p>

<h3>Les mycorhizes vont le chercher plus loin</h3>
<p>C'est là que les <span class="t" data-t="mycorhize">mycorhizes</span> jouent un grand rôle. Ces champignons vivent associés aux racines, et leurs filaments, bien plus fins qu'une racine, explorent la terre au-delà de la zone que la racine a déjà vidée. Ils rapportent du phosphate et du zinc à la plante, et elle les paie en sucre (séance 6). Attention, les choux, les épinards et les betteraves ne s'associent pas à ces champignons.</p>

<h3>Trop de phosphore gêne le zinc</h3>
<p>Un sol très riche en phosphore fait parfois apparaître des carences en zinc, même quand le zinc ne manque pas dans la terre. Plusieurs causes s'ajoutent. La mieux connue, c'est qu'un sol trop riche en phosphore freine les mycorhizes, puisque la plante n'a plus besoin d'elles pour son phosphore. Elle perd du même coup l'aide qu'elles lui donnaient pour le zinc. Le phosphore fait aussi pousser la plante plus vite, et le zinc qu'elle a pris se dilue dans plus de matière.</p>

<h2><span class="partie-num">Partie 3 sur 4</span>Comment lire le diagramme de Mulder ?</h2>

<h3>Un agronome néerlandais a dessiné les liens entre les éléments</h3>

<h3>Un trait plein, c'est un antagonisme</h3>
<p>Lis le dessin trait par trait. Un trait plein entre deux éléments veut dire qu'un excès de l'un peut faire manquer l'autre. On y retrouve ce qu'on vient de voir.</p>
<ul>
  <li>Le potassium, le calcium et le magnésium forment un triangle. Chacun, en excès, gêne les deux autres.</li>
  <li>Trop d'azote gêne le potassium, surtout quand il arrive sous forme d'ammonium. Le nitrate, lui, aide plutôt le potassium à monter dans la plante.</li>
  <li>Le phosphore gêne le zinc et le fer.</li>
  <li>Le calcium, c'est-à-dire souvent le calcaire ou un chaulage trop fort, gêne le bore.</li>
  <li>Le cuivre et le molybdène se gênent l'un l'autre.</li>
</ul>

<h3>Un trait en pointillé, c'est une synergie</h3>
<p>Un trait en pointillé veut dire que les deux éléments vont ensemble. L'azote appelle le magnésium, parce que plus de croissance, c'est plus de chlorophylle, donc plus de magnésium. Le magnésium aide la plante à prendre et à utiliser le phosphore. Et le molybdène aide la plante à se servir de l'azote, puisqu'il est au cœur de la <span class="t" data-t="nitrate-reductase">nitrate réductase</span> (séances 7 et 9).</p>

<h3>C'est un aide-mémoire, pas une loi</h3>
<p>Le diagramme de Mulder est utile, à condition de le prendre pour ce qu'il est. Il est né d'observations, surtout sur des arbres fruitiers, et pas d'une théorie. Les versions qu'on trouve dans les livres et sur internet ne montrent pas toutes les mêmes traits. Et chaque trait ne vaut que pour un excès net. Une terre bien pourvue en potasse ne donne pas forcément une carence en magnésium. C'est le déséquilibre qui pose problème, et son effet dépend des doses, du sol et de la culture.</p>
<p>Il sert surtout à se poser la bonne question. Quand une carence apparaît alors que le sol semble contenir l'élément, on regarde sur le diagramme quels autres éléments pourraient la provoquer, puis on va vérifier sur l'analyse.</p>

<!-- Partie 4 -->
<h2><span class="partie-num">Partie 4 sur 4</span>Comment corriger un déséquilibre sans en créer un autre ?</h2>

<h3>On ne soigne pas un excès par un autre excès</h3>
<p>Devant une carence en magnésium causée par trop de potasse, le premier réflexe serait d'apporter beaucoup de magnésium. Ça peut soulager la culture, mais si on force la dose, c'est le calcium qui risque de manquer à son tour, puisque les trois se disputent les mêmes places. Le plus efficace, c'est souvent de s'attaquer à la cause, en arrêtant d'apporter la potasse en trop.</p>
<p>Sous serre, ça veut dire regarder ce que contient chaque compost, chaque fumier et chaque engrais du commerce, et ne plus ajouter de potasse tant que l'analyse en montre trop.</p>

<h3>Sur l'analyse, on regarde les rapports entre les éléments</h3>
<p>Une analyse de terre donne la quantité de chaque <span class="t" data-t="cations-echangeables">cation échangeable</span>. Mais pour un antagonisme, ce qui compte, c'est la quantité de magnésium par rapport à la potasse et au calcium, plus que cette quantité toute seule. Les laboratoires donnent souvent le rapport entre la potasse et le magnésium, K₂O/MgO, et le <span class="t" data-t="taux-saturation">taux de saturation</span> de la CEC par chaque cation. On apprendra à les lire à la séance 13.</p>

<h3>On apporte ce qui manque, sans ce qui est en trop</h3>
<p>L'idée, c'est d'apporter l'élément qui manque sans rajouter celui qui est déjà en excès, et sans dérégler le pH.</p>
<table>
  <thead><tr><th>Situation</th><th>Ce qu'on peut faire</th></tr></thead>
  <tbody>
    <tr><td>Sol acide qui manque de magnésium</td><td>Apporter de la dolomie, un calcaire qui contient du magnésium. Elle remonte le pH en même temps.</td></tr>
    <tr><td>Sol neutre ou calcaire qui manque de magnésium</td><td>Apporter du sulfate de magnésium (kiesérite), qui ne change pas le pH. En bio, il doit être d'origine naturelle.</td></tr>
    <tr><td>Trop de potasse</td><td>Arrêter les engrais potassiques, et réduire la dose de compost ou en choisir un moins riche en potasse.</td></tr>
    <tr><td>Culture qui montre déjà le manque</td><td>Pulvériser du sulfate de magnésium sur les feuilles, pour dépanner. Ça soigne la culture en place, pas le sol. Vérifie avec ton organisme certificateur que le produit est permis en bio.</td></tr>
    <tr><td>Trop de phosphore, zinc qui manque</td><td>Arrêter les apports riches en phosphore. Le phosphore en trop met des années à baisser.</td></tr>
  </tbody>
</table>

<h3>On vérifie dans la plante, pas seulement dans le sol</h3>
<p>L'analyse de terre donne ce qu'il y a dans le sol, pas ce qui entre dans la plante. Pour savoir si ta correction marche, fais analyser des feuilles par un laboratoire, ou du jus de pétiole en cours de culture. Tu verras ce que la plante a vraiment pris. Si le magnésium remonte dans les feuilles, c'est gagné. Sinon, il faut chercher ailleurs, du côté du pH, de l'eau ou de l'état des racines.</p>
<p>Et on refait une analyse de terre deux ou trois ans plus tard, pour voir si les rapports changent dans le bon sens. Les réserves du sol changent lentement, et un déséquilibre qui a mis dix ans à s'installer ne se corrige pas en une saison.</p>

<h3>Albrecht et Kinsey poussent cette idée beaucoup plus loin</h3>
<p>L'idée qu'il faut un bon équilibre entre le calcium, le magnésium et la potasse dans le sol, deux Américains l'ont poussée beaucoup plus loin. William Albrecht, un professeur de sciences du sol, puis Neal Kinsey, qui a repris ses idées, ont proposé une proportion idéale de chaque cation sur la CEC. On verra à la séance 11 ce que propose cette méthode <span class="t" data-t="albrecht-kinsey">Albrecht-Kinsey</span>, et ce que montrent les essais.</p>

  <ul>
    <li>Un antagonisme, c'est un élément en excès qui gêne l'arrivée d'un autre dans la plante, même quand le sol contient assez de ce second élément.</li>
    <li>Ça se joue à deux endroits. Dans le sol, les cations se disputent les places de la CEC. À l'entrée de la racine, des ions qui se ressemblent se disputent les mêmes transporteurs.</li>
    <li>Potasse, calcium et magnésium forment un trio. Trop de potasse, apportée chaque année avec le compost sous serre, donne des carences en magnésium sur les vieilles feuilles.</li>
    <li>Le phosphate s'accroche au fer et à l'aluminium en sol acide, au calcium en sol calcaire. Trop de phosphore gêne le zinc, en partie parce qu'il freine les mycorhizes.</li>
    <li>Le diagramme de Mulder est un aide-mémoire tiré d'observations. Il aide à poser la question, pas à conclure.</li>

<p class="surtitre">Séance 11 · Albrecht, Kinsey et Bucaille</p>
<h1>Que dit Francis Bucaille de la santé des plantes ?</h1>
<p class="chapo">Pour Francis Bucaille, une plante bien nourrie, dans un sol vivant et bien équilibré, se défend mieux contre les maladies et les ravageurs. Dans <i>Revitaliser les sols</i>, que tu as dans ta bibliothèque, il juge l'équilibre du sol avec une école américaine, celle d'Albrecht et de Kinsey, qui fixe une cible pour chaque cation. Une partie de ce raisonnement est solide, une autre reste à prouver, et cette séance t'aide à faire le tri.</p>

<!-- Partie 1 -->
<h2><span class="partie-num">Partie 1 sur 4</span>D'où vient l'idée d'un sol équilibré ?</h2>
<p>À la séance 3, tu as vu que la <span class="t" data-t="cec">CEC</span> retient des cations, et qu'on peut calculer la part de ses places tenue par le calcium, le magnésium ou le potassium, sans dire si c'est trop ou pas assez. Une école de pensée va plus loin, et dit qu'il existe une répartition idéale.</p>

<h3>Albrecht cherchait dans le sol la santé des plantes et des bêtes</h3>
<p>William Albrecht (1888-1974) enseignait la science du sol à l'université du Missouri, aux États-Unis. En étudiant la fixation de l'azote par le soja, il a vu combien le calcium est important pour les légumineuses, surtout en terre acide. Il a ensuite voulu comprendre pourquoi les animaux d'élevage n'avaient pas la même santé d'une région à l'autre, et il a cherché la réponse dans le sol.</p>
<p>Il en a tiré une idée forte. Quand on chaule une terre acide, ce qui fait du bien aux cultures viendrait surtout du calcium apporté, plus que de la hausse du <span class="t" data-t="ph">pH</span>. On verra en partie 4 que les essais récents disent plutôt l'inverse.</p>

<h3>Chaque cation aurait sa cible dans la CEC</h3>
<p>Dans les années 1940, des chercheurs du New Jersey, autour de Firman Bear, ont décrit un sol « idéal » à partir de très peu de données. Dans ce sol, le calcium prenait 65 % des places de la CEC, le magnésium 10 %, le potassium 5 %, et l'acidité, qu'ils appelaient l'hydrogène, 20 %. Albrecht a repris ces chiffres et en a fait des fourchettes. On appelle cette façon de lire une analyse la <span class="t" data-t="albrecht-kinsey">méthode Albrecht-Kinsey</span>.</p>
<p>Les chiffres changent un peu selon les auteurs. Ce sont des parts de la CEC, comme celles que tu as calculées à la séance 3.</p>
<table>
  <thead><tr><th>Cation</th><th>Albrecht</th><th>Kinsey</th></tr></thead>
  <tbody>
    <tr><td>Calcium</td><td>60 à 75 %</td><td>60 à 70 %</td></tr>
    <tr><td>Magnésium</td><td>10 à 20 %</td><td>10 à 20 %</td></tr>
    <tr><td>Potassium</td><td>2 à 5 %</td><td>3 à 5 %</td></tr>
    <tr><td>Sodium</td><td>0,5 à 5 %</td><td>environ 1 %</td></tr>
    <tr><td>Acidité (hydrogène)</td><td>environ 10 %</td><td>10 à 15 %</td></tr>
  </tbody>
</table>

<h3>Neal Kinsey a porté la méthode jusqu'aux fermes</h3>
<p>Neal Kinsey, présenté comme le dernier élève d'Albrecht, en a fait un service d'analyse et de conseil pour les agriculteurs. Au début des années 1990, il en a aussi tiré un livre avec Charles Walters, <i>Hands-On Agronomy</i>. Les labos qui suivent sa méthode visent souvent 68 % de calcium, 12 % de magnésium, 4 % de potassium, 1,5 % de sodium et 10 % d'acidité. Les 4,5 % qui restent vont à d'autres cations. Ça donne un rapport entre calcium et magnésium autour de 5,7, d'où l'idée qu'il faut garder ce rapport entre 5 et 7.</p>

</figure>

<h3>Le calcium aérerait la terre, le magnésium la resserrerait</h3>
<p>Les praticiens de la méthode avancent un argument sur la structure. Le calcium regroupe les particules d'argile en petits paquets, ce qui laisse de la place à l'air et à l'eau. Pour eux, le magnésium les rapprocherait trop, et une terre trop riche en magnésium deviendrait collante et se tasserait. Le rôle du calcium est bien connu des physiciens du sol. Pour le magnésium, les physiciens voient plutôt l'inverse. Il tient moins bien les argiles ensemble que le calcium, et en excès il les laisse se disperser. Le résultat peut se ressembler, une surface qui se referme sous la pluie, mais ça dépend beaucoup du sol. On y revient en partie 4.</p>

<h3>Bucaille regarde d'abord le sol en entier, puis l'équilibre des cations</h3>
<p>Francis Bucaille se présente comme agriculteur. Il est l'un des quatre fondateurs de Gaïago, une entreprise qui fabrique des produits pour stimuler la vie du sol, et il donne des conférences et des formations. Son livre <i>Revitaliser les sols</i>, paru chez Dunod en 2020 avec une préface du biologiste Marc-André Selosse, a été réédité en 2023 avec pour sous-titre <i>Diagnostic, fertilisation, nutriprotection</i>.</p>
<p>D'après la présentation de l'éditeur, sa démarche commence par un diagnostic du sol, avec une analyse de terre et un profil de sol, c'est-à-dire une fosse où l'on regarde la terre en place. Elle cherche ensuite à rééquilibrer la vie microbienne du sol, à fertiliser les cultures, puis à protéger les plantes par leur nutrition. Dans ce livre, que tu as lu, il juge le sol avec l'école d'Albrecht et de Kinsey, et il regarde surtout le rapport entre calcium et magnésium. Ce cours ne lui prête aucun chiffre. Ses cibles et ses doses sont dans ton exemplaire, et c'est là qu'il faut les prendre.</p>

<h2><span class="partie-num">Partie 2 sur 4</span>Qu'est-ce que la nutriprotection ?</h2>
<p>Bucaille appelle <span class="t" data-t="nutriprotection">nutriprotection</span> l'idée de protéger une culture par sa nutrition, pour avoir moins besoin de la traiter. Cette idée a un ancêtre français, la théorie d'un chercheur de l'INRA, Francis Chaboussou.</p>

<h3>Pour Chaboussou, un parasite ne prospère que sur une plante qui le nourrit bien</h3>
<p>En 1980, Chaboussou publie <i>Les Plantes malades des pesticides</i>. Il y défend la <span class="t" data-t="trophobiose">trophobiose</span>. Selon lui, un insecte, un acarien, un champignon ou une bactérie ne devient vraiment nuisible que s'il trouve dans la plante la nourriture qui lui convient.</p>
<p>Or beaucoup de ces parasites se nourrissent de ce qui est dissous dans la sève. Le puceron, par exemple, plante son stylet dans le <span class="t" data-t="phloeme">phloème</span> et boit la sève qui y circule, chargée de sucres et d'<span class="t" data-t="acide-amine">acides aminés</span>. Tu l'as vu aux séances 6 et 7.</p>

<h3>Tout se jouerait entre fabriquer et défaire les protéines</h3>
<p>Une plante fabrique sans arrêt des <span class="t" data-t="proteine">protéines</span> en assemblant des acides aminés, et elle en défait d'autres. Chaboussou appelle « protéosynthèse » la fabrication des protéines, et « protéolyse » le fait de les défaire. Quand la fabrication va bien, les acides aminés sont vite rangés dans des protéines, et la sève en transporte peu à l'état libre.</p>
<p>Quand la fabrication ralentit, ou quand la plante défait plus de protéines qu'elle n'en fabrique, les acides aminés libres et les sucres simples s'accumulent dans la sève. Pour Chaboussou, c'est ce qui arrive dans les organes très jeunes ou vieillissants, chez une plante stressée ou mal nourrie, et après certains traitements. Le parasite trouve alors un repas tout prêt.</p>
