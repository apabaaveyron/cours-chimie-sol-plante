  --c-carbone: #4a4339; --c-oxygene: #6f9bc4; --c-hydrogene: #cfd8de; --c-sol: #9a6a45;

}

    --bg: #17150f; --surface: #211e17; --ink: #ede6d8; --muted: #a89d8b; --line: #38322a;

    --sand-soft: #2c251a; --sky-soft: #1b2630;
    --cat: #e8916b; --cat-soft: #3a2219; --ani: #86b6e6; --ani-soft: #1a2a3a;
    --ok: #8fcf76; --ok-soft: #1f3318; --ko: #f08b7b; --ko-soft: #3a1d18;
    --c-carbone: #cfc6b6; --c-oxygene: #5c88b0; --c-hydrogene: #5d6970; --c-sol: #b98557;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17150f; --surface: #211e17; --ink: #ede6d8; --muted: #a89d8b; --line: #38322a;
  --accent: #9cc46f; --accent-soft: #26301b; --accent-ink: #17150f;
  --sand-soft: #2c251a; --sky-soft: #1b2630;
  --cat: #e8916b; --cat-soft: #3a2219; --ani: #86b6e6; --ani-soft: #1a2a3a;
  --ok: #8fcf76; --ok-soft: #1f3318; --ko: #f08b7b; --ko-soft: #3a1d18;

  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);

}

h1 { font-size: 1.65rem; margin: .3rem 0 1rem; }
h2 { font-size: 1.35rem; margin: 2.6rem 0 .8rem; }
h3 { font-size: 1.1rem; margin: 1.8rem 0 .4rem; }
p { margin: 0 0 1rem; }
ul, ol { margin: 0 0 1rem; padding-left: 1.3rem; }
li { margin-bottom: .35rem; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }

.top {

  display: flex; align-items: center; gap: .5rem;
  padding: .55rem 16px; padding-top: calc(.55rem + env(safe-area-inset-top));

}

  border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer;

}
.icone svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.retour { gap: .3rem; display: inline-flex; align-items: center; }

main { max-width: 40rem; margin: 0 auto; padding: 1rem 16px 4rem; }

.surtitre { font-size: .85rem; letter-spacing: .02em; color: var(--muted); margin: 0; }
.chapo { font-size: 1.12rem; }

.carte {

  padding: 1rem 1.1rem; box-shadow: var(--shadow); margin-bottom: 1rem;
}
.progres { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; margin: .6rem 0 1rem; }

.bouton {

}
.bouton.second { background: var(--surface); color: var(--ink); border: 1px solid var(--line); font-weight: 500; }

<template id="seance-1">
<p class="surtitre">Séance 1 · Atomes, molécules et ions</p>
<h1>De quoi est faite une plante, et que mange-t-elle vraiment ?</h1>
<p class="chapo">Une plante est faite presque entièrement d'air et d'eau. Ce qu'elle prend dans le sol, elle le prend presque toujours sous forme d'<span class="t" data-t="ion">ions</span>, de minuscules grains chargés d'électricité, dissous dans l'eau. Toute la suite du cours repose sur ces deux idées.</p>

<!-- Partie 1 -->
<h2><span class="partie-num">Partie 1 sur 4</span>De quoi est faite une plante ?</h2>
<p>Une salade fraîche, c'est d'abord de l'eau, plus de 90 %. Si tu la fais sécher, il reste sa <span class="t" data-t="matiere-seche">matière sèche</span>, et c'est elle qui nous intéresse.</p>
<p>Tout ce qui existe, la salade, la terre, l'eau d'arrosage, l'air, est fait de grains minuscules qu'on appelle des <span class="t" data-t="atome">atomes</span>. Ils sont si petits qu'il en faudrait plusieurs centaines de milliers, alignés, pour faire l'épaisseur d'un cheveu.</p>

<h3>Une centaine de sortes d'atomes</h3>
<p>Il n'existe qu'une centaine de sortes d'atomes. Chaque sorte s'appelle un <span class="t" data-t="element">élément</span> : le carbone, l'oxygène, l'azote, le fer… Tous les atomes d'un même élément sont pareils, et un élément ne se change jamais en un autre, ni dans le sol ni dans la plante. L'azote reste de l'azote, quoi qu'il lui arrive.</p>
<p>Chaque élément a un symbole d'une ou deux lettres, la première toujours en majuscule. Voici ceux qui reviendront tout le temps.</p>
<table>
  <thead><tr><th>Symbole</th><th>Élément</th></tr></thead>
  <tbody>
    <tr><td class="symb">C</td><td>carbone</td></tr>
    <tr><td class="symb">H</td><td>hydrogène</td></tr>
    <tr><td class="symb">O</td><td>oxygène</td></tr>
    <tr><td class="symb">N</td><td>azote (du latin <i>nitrogenium</i>)</td></tr>
    <tr><td class="symb">P</td><td>phosphore</td></tr>
    <tr><td class="symb">K</td><td>potassium (du latin <i>kalium</i>)</td></tr>
    <tr><td class="symb">Ca</td><td>calcium</td></tr>
    <tr><td class="symb">Mg</td><td>magnésium</td></tr>
    <tr><td class="symb">S</td><td>soufre</td></tr>
    <tr><td class="symb">Fe</td><td>fer (du latin <i>ferrum</i>)</td></tr>
    <tr><td class="symb">Na</td><td>sodium (du latin <i>natrium</i>)</td></tr>
    <tr><td class="symb">Al</td><td>aluminium</td></tr>
  </tbody>
</table>
<p>Méfie-toi de trois pièges. K, c'est le potassium, pas le calcium, qui s'écrit Ca. N, c'est l'azote, pas le sodium, qui s'écrit Na. Et S, ce n'est pas le sodium non plus, c'est le soufre.</p>
<p>Les maraîchers disent souvent « la <span class="t" data-t="potasse">potasse</span> » pour parler du potassium qu'on apporte avec les engrais. C'est le même élément.</p>

<h3>Ce qu'il y a dans un atome</h3>
<p>Au centre, il y a un <span class="t" data-t="noyau">noyau</span>, lourd, qui porte des charges électriques positives. Autour tournent des <span class="t" data-t="electron">électrons</span>, très légers, qui portent chacun une charge négative. Un atome a autant d'électrons que de charges dans son noyau, il est donc neutre.</p>

<p>Dans le sol comme dans la plante, le noyau ne change jamais. Tout se joue sur les électrons du bord, les plus éloignés du noyau. C'est en les partageant, en les perdant ou en les gagnant que les atomes s'accrochent entre eux. Retiens juste ça, on s'en servira dans les deux parties suivantes.</p>

<h3>Les 17 éléments dont la plante a besoin</h3>
<p>La matière sèche d'une plante est faite à 96 % de trois éléments, le carbone, l'oxygène et l'hydrogène. Elle les prend dans l'air, sous forme de gaz carbonique, et dans l'eau. Tout le reste, à peine 4 %, vient du sol. Il y a une exception, les légumineuses, qui tirent une bonne part de leur azote de l'air grâce aux bactéries de leurs racines. On le verra à la séance 5.</p>

<p>Dans ces 4 %, on trouve 14 éléments. Avec le carbone, l'oxygène et l'hydrogène, ça fait bien 17. On les range d'habitude en trois groupes.</p>

</ul>

<h3>Il suffit qu'un seul manque</h3>
<p>Une plante, c'est comme une recette. S'il manque un ingrédient, même une pincée, le plat est raté, et doubler les autres n'y change rien. Un chou-fleur peut avoir tout l'azote et toute la potasse du monde, s'il manque de bore il fait une tige creuse et une pomme qui brunit.</p>
<p>C'est l'élément qui manque le plus qui limite la récolte. On appelle ça la <span class="t" data-t="loi-minimum">loi du minimum</span>, décrite au XIX<sup>e</sup> siècle par les chimistes allemands Sprengel puis Liebig.</p>

<!-- Partie 2 -->
<h2><span class="partie-num">Partie 2 sur 4</span>Comment les atomes tiennent ensemble ?</h2>
<p>Les atomes se trouvent rarement seuls. Ils s'accrochent les uns aux autres en partageant des électrons de leur bord. Ce lien entre deux atomes s'appelle une <span class="t" data-t="liaison">liaison</span>, et un groupe d'atomes accrochés s'appelle une <span class="t" data-t="molecule">molécule</span>.</p>

<h3>L'azote de l'air, une molécule trop solide</h3>
<p>L'air contient 78 % d'azote. Au-dessus de chaque mètre carré de planche, il y en a près de 8 tonnes, et pourtant aucune plante ne sait s'en servir. Les deux atomes de la molécule N₂ sont accrochés par trois liaisons à la fois, et c'est l'une des molécules les plus solides qui existent.</p>
<p>Seules quelques bactéries savent la casser, comme celles qui vivent dans les <span class="t" data-t="nodosite">nodosités</span> des racines de fève, de pois ou de trèfle. On en reparlera à la séance 5. L'industrie, elle, fait réagir l'azote de l'air avec de l'hydrogène tiré du gaz naturel, vers 400 à 500 °C, sous une pression 150 à 300 fois plus forte que celle de l'air. Fabriquer cet hydrogène et chauffer demande beaucoup de gaz, et c'est pour ça que les engrais azotés de synthèse coûtent autant d'énergie.</p>

<h3>La photosynthèse fabrique du sucre avec de l'air et de l'eau</h3>
<p>Dans la feuille, avec l'énergie de la lumière, la plante casse des molécules de gaz carbonique et d'eau, puis réassemble leurs atomes en sucre. L'oxygène en trop repart dans l'air, et cet oxygène-là vient de l'eau. C'est la <span class="t" data-t="photosynthese">photosynthèse</span>.</p>
<div class="equation">6 CO₂ + 6 H₂O + lumière → C₆H₁₂O₆ + 6 O₂<small>C₆H₁₂O₆, c'est le glucose, un sucre.</small></div>
<p>Compte les atomes de chaque côté de la flèche. Tu trouves 6 carbones, 12 hydrogènes et 18 oxygènes à gauche comme à droite. Ce sucre est la brique de départ de tout le reste de la plante, et on le suivra à la séance 6.</p>

<h2><span class="partie-num">Partie 3 sur 4</span>Qu'est-ce que la plante mange vraiment ?</h2>
<p>Une racine ne mange ni le compost ni les granulés d'engrais. Elle prend des ions dissous dans l'eau du sol. Un ion, c'est un atome, ou un petit groupe d'atomes, qui porte une charge électrique.</p>

<h3>Un atome qui perd ou qui gagne des électrons</h3>
<p>Un atome de potassium n'a qu'un seul électron sur son bord, et il le perd très facilement. Il a alors une charge + en trop, puisque son noyau, lui, n'a rien perdu. Il devient l'ion potassium, qu'on écrit K⁺. À l'inverse, un atome de chlore gagne volontiers un électron de plus. Il devient l'ion chlorure, Cl⁻. Le nom change, mais c'est toujours du chlore.</p>

<h3>Les cations sont positifs, les anions négatifs</h3>
<p>Les ions positifs s'appellent des <span class="t" data-t="cation">cations</span>, les ions négatifs des <span class="t" data-t="anion">anions</span>. Pour t'en souvenir, le t de cation ressemble à un signe +. Voici ceux qu'on croise sans arrêt dans le sol.</p>
<div class="ions">
  <div class="plus"><strong>Cations +</strong><ul>
    <li><b>K⁺</b> potassium</li>
    <li><b>Ca²⁺</b> calcium</li>
    <li><b>Mg²⁺</b> magnésium</li>
    <li><b>NH₄⁺</b> ammonium</li>
    <li><b>H⁺</b> hydrogène, c'est l'acidité</li>
    <li><b>Na⁺</b> sodium</li>
    <li><b>Al³⁺</b> aluminium, toxique en sol très acide</li>
  </ul></div>
  <div class="moins"><strong>Anions −</strong><ul>
    <li><b>NO₃⁻</b> nitrate</li>
    <li><b>H₂PO₄⁻</b> phosphate</li>
    <li><b>SO₄²⁻</b> sulfate</li>
    <li><b>Cl⁻</b> chlorure</li>
    <li><b>HCO₃⁻</b> bicarbonate</li>
  </ul></div>
</div>

<h3>Le même azote peut être un anion ou un cation</h3>
<p>Le nitrate, NO₃⁻, c'est un atome d'azote et trois atomes d'oxygène qui voyagent ensemble, avec une charge négative. L'ammonium, NH₄⁺, c'est un atome d'azote et quatre atomes d'hydrogène, avec une charge positive. C'est sous ces deux formes que la racine prend presque tout son azote.</p>
<p>Le potassium devient positif en perdant un électron. L'ammonium, lui, c'est une molécule d'ammoniac, NH₃, qui a attrapé un ion H⁺ au passage. Retiens-le, ça expliquera à la séance 5 pourquoi un fumier épandu sur une terre calcaire sent l'ammoniac.</p>
<p>Pour la plante, ce qui compte, c'est ce qui entoure l'azote. Dans le nitrate, il est entouré d'oxygènes. Dans l'ammonium, comme dans les protéines de la plante, il n'a aucun oxygène autour de lui. La plante peut donc se servir de l'ammonium presque tel quel. Le nitrate, elle doit d'abord le transformer, et ça lui coûte du sucre. On le verra à la séance 7.</p>
<p>Dans le sol, c'est le nitrate qui a l'avantage. La terre retient l'ammonium et laisse filer le nitrate avec l'eau, tu verras pourquoi à la séance 3. Le nitrate circule donc jusqu'aux racines, alors que l'ammonium reste accroché sur place. Du coup, la racine trouve plus facilement le nitrate, mais la plante se sert plus facilement de l'ammonium.</p>

<h3>Le plus attire le moins</h3>
<p>Comme les deux pôles d'un aimant, une charge positive attire une charge négative, et deux charges pareilles se repoussent. C'est cette attraction qui fait tenir un cristal de sel. C'est aussi elle qui permet à la terre de garder certains éléments à portée de racine.</p>

<h3>L'azote du compost doit d'abord être libéré par les microbes</h3>
<p>La racine prend ce qui est dissous dans l'eau du sol, presque toujours sous forme d'ions. Or l'azote d'un compost, d'un fumier ou d'une farine de plume est enfermé dans la matière organique, en bonne partie dans des protéines. Ce sont des molécules bien trop grosses pour entrer dans une racine. Pour que cet azote soit libéré, il faut que les microbes du sol mangent la matière organique. Ils découpent les protéines en petits morceaux, les acides aminés, puis ils rejettent l'azote qu'ils ont en trop sous forme d'ammonium. On appelle ça la <span class="t" data-t="mineralisation">minéralisation</span>. La racine prend au passage quelques acides aminés, mais l'essentiel de son azote lui arrive en ammonium ou en nitrate. Quand le sol est froid, sec ou mal aéré, les microbes travaillent peu, et cet azote attend.</p>
<p>Le potassium, lui, n'attend pas. Dans un fumier ou un compost, il est déjà en ions K⁺, et il passe dans l'eau du sol à la première pluie.</p>

<!-- Partie 4 -->
<h2><span class="partie-num">Partie 4 sur 4</span>Que devient un engrais dans l'eau du sol ?</h2>
<p>Ça dépend s'il se dissout ou pas. Mais dans tous les cas, rien ne disparaît. Ses atomes changent seulement de place et de partenaires.</p>

<h3>Dissoudre, c'est séparer les ions</h3>
<p>Mets une cuillère de sel de cuisine, NaCl, dans un verre d'eau. On ne voit plus le sel, mais il est toujours là, puisque l'eau a un goût salé. Les molécules d'eau ont décroché les ions Na⁺ et Cl⁻ du cristal, un par un, et chacun se promène maintenant entouré d'eau.</p>

<p>Le sulfate de potasse, K₂SO₄, fait pareil. Dans l'eau, il se défait en ions potassium K⁺ et en ions sulfate SO₄²⁻, avec deux K⁺ pour un SO₄²⁻, comme le dit sa formule.</p>

<h3>L'eau du sol est une soupe très diluée</h3>
<p>L'eau qui remplit les petits trous de la terre n'est jamais de l'eau pure. Elle contient des ions dissous, et on l'appelle la <span class="t" data-t="solution-sol">solution du sol</span>. C'est là, et seulement là, que la racine prend ce qu'il lui faut.</p>
<p>Plus cette eau contient d'ions, mieux elle conduit l'électricité. C'est ce qu'on appelle sa <span class="t" data-t="conductivite">conductivité</span>, et on la mesure avec un conductimètre. Un chiffre élevé veut dire beaucoup d'ions dissous, qu'ils viennent d'un engrais, d'un compost très riche ou d'une eau d'irrigation chargée.</p>

<h3>Soluble ou pas, un produit n'agit pas à la même vitesse</h3>
<p>Certains produits se dissolvent tout de suite, comme le sulfate de potasse. D'autres presque pas, comme le calcaire broyé, un phosphate naturel ou une poudre de roche. Ceux-là ne libèrent leurs ions que petit à petit, au contact de l'acidité du sol et des racines. C'est pour ça qu'un phosphate naturel agit un peu dans une terre franchement acide, sous un pH de 5,5, surtout s'il est finement broyé, et presque pas dans une terre neutre ou calcaire. On verra ce qu'est le pH à la séance 2.</p>

<h3>Une réaction chimique, ce sont des atomes qui changent de partenaires</h3>
<p>Quand des molécules se rencontrent et que leurs atomes se réorganisent, c'est une <span class="t" data-t="reaction">réaction chimique</span>. Prends le calcaire qu'on apporte sur une terre acide.</p>
<div class="equation">CaCO₃ + 2 H⁺ → Ca²⁺ + CO₂ + H₂O<small>Le calcaire capte l'acidité, et il libère du calcium, du gaz carbonique et de l'eau.</small></div>
<p>Le gaz carbonique qui s'échappe, c'est lui qui fait mousser une pierre calcaire quand on y verse du vinaigre. Les pédologues font pareil avec quelques gouttes d'acide pour repérer le calcaire dans une terre. Si ça mousse, il y en a.</p>

<h3>Rien ne se perd</h3>
<p>Lavoisier a montré au XVIII<sup>e</sup> siècle que la masse ne change pas pendant une réaction. On sait aujourd'hui pourquoi. Aucun atome ne disparaît et aucun n'apparaît. Reprends l'équation du calcaire et compte les atomes de chaque côté de la flèche. Tu trouves 1 calcium, 1 carbone, 3 oxygènes et 2 hydrogènes, à gauche comme à droite.</p>
<p>Pour une ferme, ça veut dire une chose très concrète. L'azote apporté qui n'est pas dans les légumes à la récolte est forcément quelque part. Il est resté dans le sol, il est parti en profondeur avec l'eau, ou il s'est envolé dans l'air.</p>

<p class="surtitre">Séance 2 · Le pH</p>
<h1>Pourquoi le pH compte autant ?</h1>
<p class="chapo">Le <span class="t" data-t="ph">pH</span> mesure la quantité d'ions H⁺ dans l'eau du sol. Selon ce chiffre, la racine prend facilement certains éléments, d'autres restent bloqués, et les microbes travaillent plus ou moins vite. Sous la pluie, un sol sans calcaire devient acide tout seul, et c'est le calcaire qui le corrige.</p>

<!-- Partie 1 -->
<h2><span class="partie-num">Partie 1 sur 4</span>Que mesure le pH ?</h2>
<p>À la séance 1, l'ion H⁺ figurait dans la liste des <span class="t" data-t="cation">cations</span>, avec une petite note, « c'est l'acidité ». Le pH sert à mesurer combien il y en a dans une eau.</p>

<h3>Même l'eau pure contient un peu de H⁺</h3>
<p>Dans l'eau la plus pure, quelques <span class="t" data-t="molecule">molécules</span> d'eau se cassent en deux. Une molécule H₂O se sépare en un ion H⁺ et un ion OH⁻, qu'on appelle hydroxyde. C'est très rare, à peine une molécule sur un demi-milliard, et dans l'eau pure il y a exactement autant de H⁺ que de OH⁻. On dit que l'eau est neutre, et son pH vaut 7.</p>
<div class="equation">H₂O ⇄ H⁺ + OH⁻<small>La double flèche veut dire que ça marche dans les deux sens. Les ions se reforment en eau aussi vite qu'ils se séparent.</small></div>
<p>Un <span class="t" data-t="acide">acide</span> est une substance qui libère des ions H⁺ quand elle se dissout dans l'eau. Le vinaigre et le jus de citron en contiennent. L'eau a alors plus de H⁺ que de OH⁻, et son pH descend sous 7. À l'inverse, une eau qui a plus de OH⁻ que de H⁺ est dite basique, et son pH monte au-dessus de 7.</p>

<h3>Plus le chiffre est bas, plus il y a de H⁺</h3>
<p>Le pH marche à l'envers de ce qu'on attend. Plus il y a d'ions H⁺, plus le chiffre est petit. Et chaque fois qu'il baisse d'un point, il y a dix fois plus de H⁺. Une terre à pH 5 en a dix fois plus dans son eau qu'une terre à pH 6, et cent fois plus qu'une terre à pH 7.</p>
<p>Pour te faire une idée, à pH 7, il faut près de 10 000 m³ d'eau pour y trouver un seul gramme d'ions H⁺, de quoi remplir quatre piscines olympiques. À pH 6, il suffit de 1 000 m³. À pH 5, de 100 m³, et à pH 4, de 10 m³.</p>
<p>Un demi-point de pH, ce n'est donc pas rien. Entre 6,5 et 6, il y a déjà trois fois plus de H⁺.</p>

<!-- Partie 2 -->
<h2><span class="partie-num">Partie 2 sur 4</span>Pourquoi le pH change ce que la racine peut prendre ?</h2>
<p>Pour que la racine prenne un élément, il doit être dissous dans l'eau du sol, sous forme d'ion (séance 1). On dit alors qu'il est disponible. Or beaucoup d'ions s'assemblent entre eux en solides qui ne se dissolvent presque plus, et ça dépend beaucoup du pH.</p>

<h3>Le phosphore se bloque des deux côtés</h3>
<p>En sol acide, l'ion phosphate rencontre beaucoup de fer et d'aluminium dissous, et il s'y accroche en formant des composés qui ne se dissolvent presque pas. En sol calcaire, il rencontre beaucoup de calcium, et il forme avec lui des phosphates de calcium, eux aussi très peu solubles. La racine ne prend vraiment bien le phosphore qu'au milieu de l'échelle, entre 6 et 7.</p>
<p>C'est pour ça qu'une terre peut contenir beaucoup de phosphore alors que les légumes en manquent. On y revient aux séances 10 et 13.</p>

<h3>Le fer et le zinc se bloquent en sol calcaire, le molybdène en sol acide</h3>
<p>Le fer, le manganèse, le zinc et le cuivre, des <span class="t" data-t="oligo">oligo-éléments</span>, se dissolvent bien en sol acide, et de moins en moins à mesure que le pH monte. En sol calcaire, ils sont souvent là en quantité, mais sous une forme que la racine prend mal. Le bore devient lui aussi moins disponible au-dessus de 7, et un chaulage trop fort peut provoquer une carence en bore. Mais comme il n'a pas de charge, il part aussi facilement avec l'eau, et les terres acides et légères en manquent souvent.</p>
<p>Le molybdène fait l'inverse. Il se bloque en sol acide. Le chou-fleur, très sensible à ce manque, peut alors faire des feuilles étroites, réduites à leur nervure. On appelle ça le « fouet ».</p>

<h3>Sous 5,5, l'aluminium devient toxique</h3>
<p>L'argile contient beaucoup d'aluminium. Tant que le pH reste au-dessus de 5,5 environ, il reste pris dans des solides et ne gêne pas. En dessous, il se dissout de plus en plus sous forme d'ions Al³⁺. Ces ions abîment le bout des racines, qui grossit et arrête de s'allonger. La plante explore moins de terre, et elle manque d'eau et d'éléments même dans un sol riche. En sol très acide, le manganèse peut devenir toxique lui aussi.</p>

<h3>Les bactéries qui font le nitrate ralentissent en sol acide</h3>
<p>Tu l'as vu à la séance 1, l'azote de la matière organique doit être libéré par les microbes avant de nourrir la plante. C'est la <span class="t" data-t="mineralisation">minéralisation</span>. Sa dernière étape, qui change l'ammonium en nitrate, s'appelle la <span class="t" data-t="nitrification">nitrification</span>. Les bactéries qui la font se plaisent dans les sols proches de la neutralité. En sol acide, elles travaillent plus lentement, et l'azote reste plus longtemps sous forme d'ammonium. On verra la nitrification en détail à la séance 5.</p>

<h3>Entre 6 et 7, presque tout est disponible</h3>
<figure>
<svg viewBox="0 0 340 348" role="img" aria-label="Disponibilité des éléments selon le pH, de 4 à 9. Plus la bande est épaisse, plus l'élément est facile à prendre. Azote, potassium, calcium et magnésium s'élargissent vers la neutralité. Le phosphore est le plus large entre 6 et 7 et se rétrécit des deux côtés. Fer, manganèse, zinc, cuivre et bore se rétrécissent quand le pH monte. Le molybdène fait l'inverse. L'aluminium toxique n'apparaît que sous 5,5.">

<p>Ce schéma montre l'essentiel. Aux deux bouts, quelque chose se bloque ou devient toxique. Au milieu, entre 6 et 7, presque tous les éléments sont disponibles en même temps.</p>
<p>La plupart des légumes s'y plaisent, et beaucoup supportent jusqu'à 7,5. Il y a des nuances. L'épinard, la betterave, la laitue ou l'asperge souffrent vite en sol acide. La pomme de terre supporte bien un sol un peu acide, et un pH élevé favorise la gale commune sur ses tubercules. Les choux craignent la hernie, une maladie des racines qui recule nettement au-dessus de 7,2 environ, d'où l'intérêt de chauler une terre acide avant des choux. Et une terre calcaire à pH 8 se cultive très bien, en surveillant le phosphore, le fer et les oligo-éléments.</p>

<!-- Partie 3 -->
<h2><span class="partie-num">Partie 3 sur 4</span>Pourquoi un sol devient acide ?</h2>
<p>Sous un climat pluvieux comme celui de l'Aveyron, un sol sans calcaire s'acidifie tout seul, lentement, année après année. Plusieurs causes s'ajoutent.</p>

<h3>La pluie est déjà un peu acide</h3>
<p>L'eau de pluie dissout un peu du gaz carbonique de l'air. Une partie de ce gaz réagit avec l'eau et forme de l'acide carbonique, le même que dans l'eau gazeuse, qui libère des H⁺.</p>
<div class="equation">CO₂ + H₂O → H₂CO₃ → H⁺ + HCO₃⁻<small>Le gaz carbonique et l'eau donnent de l'acide carbonique, qui libère un ion H⁺ et un ion bicarbonate.</small></div>
<p>Même loin de toute pollution, la pluie a donc un pH d'environ 5,6. Dans le sol, c'est plus marqué encore, parce que les racines et les microbes rejettent du gaz carbonique en respirant.</p>

<h3>L'eau emporte le calcium et le magnésium</h3>
<p>Les H⁺ qui arrivent dans le sol prennent peu à peu la place du calcium, du magnésium et du potassium accrochés aux particules de terre. Ces éléments passent alors dans l'eau, et l'eau qui traverse le sol en hiver les emporte en profondeur. C'est le <span class="t" data-t="lessivage">lessivage</span>. Il reste au sol de plus en plus de H⁺, et de moins en moins de calcium. Sous un climat pluvieux, une terre sans calcaire peut ainsi perdre chaque année l'équivalent de quelques centaines de kilos de chaux par hectare. La séance 3 expliquera comment le sol retient ces éléments.</p>

<h3>La racine relâche des H⁺ quand elle prend des cations</h3>
<p>Une racine qui prend un cation, K⁺ par exemple, fait entrer une charge positive. Pour rester neutre, elle en rejette une autre, et c'est le plus souvent un H⁺. À l'inverse, quand elle prend un <span class="t" data-t="anion">anion</span> comme le nitrate, elle relâche plutôt des ions qui neutralisent l'acidité, OH⁻ ou HCO₃⁻. Une plante nourrie surtout d'ammonium acidifie la terre autour de ses racines. Une plante nourrie surtout de nitrate fait plutôt l'inverse, elle la rend un peu moins acide. Les légumineuses, qui tirent leur azote de l'air et prennent peu de nitrate, acidifient aussi leur sol.</p>
<p>Enfin, les légumes récoltés emportent avec eux le calcium, le magnésium et le potassium qu'ils ont pris dans le sol.</p>

<h3>La nitrification libère aussi des H⁺</h3>
<p>Quand les bactéries changent l'ammonium en nitrate, elles libèrent des H⁺, deux pour chaque ion ammonium.</p>
<div class="equation">NH₄⁺ + 2 O₂ → NO₃⁻ + 2 H⁺ + H₂O<small>L'ammonium, avec l'oxygène de l'air du sol, devient du nitrate, et il libère deux ions H⁺.</small></div>
<p>Si la plante prend ensuite ce nitrate, elle rejette de quoi neutraliser une partie de cette acidité. Mais si le nitrate part avec l'eau en hiver, il emmène du calcium avec lui, puisqu'un ion négatif s'en va toujours accompagné d'un ion positif, et les H⁺ restent dans le sol. C'est une raison de plus de ne pas laisser une planche nue l'hiver. On le reverra à la séance 5.</p>

<h3>En Aveyron, tout dépend de la roche</h3>
<p>Le Ségala est posé sur des schistes et des granites, des roches pauvres en calcium, et ses sols sont naturellement acides. Son nom vient du seigle, la céréale qui supporte le mieux ces terres. Au début du XX<sup>e</sup> siècle, le chemin de fer y a amené la chaux en quantité, et le pays du seigle a pu devenir une terre de blé, puis d'élevage.</p>
<p>Les Causses, eux, sont des plateaux de calcaire. Quand la terre contient encore du calcaire, il neutralise les H⁺ à mesure qu'ils arrivent, et le pH reste autour de 8. Mais sur le calcaire dur, la pluie a souvent dissous tout le calcaire de la terre. Il reste une argile rouge, proche de la neutralité, qui peut s'acidifier à son tour. Le nom du pays ne suffit donc pas. Il faut regarder si l'analyse trouve du calcaire. Deux maraîchers aveyronnais, à quelques dizaines de kilomètres l'un de l'autre, peuvent avoir des terres qui n'ont rien à voir.</p>

<h2><span class="partie-num">Partie 4 sur 4</span>Comment le calcaire corrige un sol acide ?</h2>
<p>Tu as vu cette <span class="t" data-t="reaction">réaction</span> à la séance 1.</p>
<div class="equation">CaCO₃ + 2 H⁺ → Ca²⁺ + CO₂ + H₂O<small>Le calcaire capte deux H⁺, et il libère du calcium, du gaz carbonique et de l'eau.</small></div>

<h3>Le calcaire capte les H⁺ et rend du calcium</h3>
<p>Cette réaction fait deux choses à la fois. Les deux H⁺ se retrouvent dans une molécule d'eau, et le pH remonte. Et elle libère un ion Ca²⁺, qui va prendre sur les particules de terre la place que les H⁺ occupaient. Apporter un produit calcaire pour corriger l'acidité d'un sol, c'est le <span class="t" data-t="chaulage">chaulage</span>. Au champ, on dit « mettre de la chaux », même quand on épand du calcaire broyé.</p>

<h3>Tous les produits ne se valent pas</h3>
<p>En bio, on chaule surtout avec des produits naturels à base de carbonate, comme le calcaire broyé, la craie, la dolomie ou les algues calcaires qu'on appelle lithothamne. Pour les comparer, on regarde leur <span class="t" data-t="valeur-neutralisante">valeur neutralisante</span>. C'est le nombre de kilos de chaux vive qui neutraliseraient autant d'acidité que 100 kilos du produit. La chaux vive, CaO, c'est du calcaire cuit au four, et elle sert de référence.</p>
<p>Un calcaire pur a une valeur neutralisante de 56, et les produits du commerce sont souvent un peu en dessous. Pourquoi pas 100 ? Une molécule de calcaire, CaCO₃, et une de chaux vive, CaO, captent chacune deux H⁺, mais celle de calcaire est plus lourde, avec son carbone et ses deux oxygènes en plus. Un kilo de calcaire contient donc moins de molécules. On refera ce genre de calcul à la séance 12.</p>
<p>La dolomie, CaMg(CO₃)₂, est un calcaire qui contient aussi du magnésium. Elle apporte du magnésium en plus, ce qui est utile quand l'analyse en montre peu, mais elle se dissout plus lentement que le calcaire.</p>
<p>La finesse compte autant que la valeur neutralisante. Plus un calcaire est broyé fin, plus il touche de terre et plus il agit vite. Une poudre fine agit en quelques semaines à quelques mois, des grains de quelques millimètres mettent des années. Et une roche tendre, comme la craie, agit plus vite qu'un calcaire dur.</p>

<h3>Le pH KCl montre l'acidité en réserve</h3>
<p>Une analyse de terre donne souvent deux pH. Le pH eau se mesure en mélangeant la terre avec de l'eau, et il donne l'acidité que la racine trouve au jour le jour. Le <span class="t" data-t="ph-kcl">pH KCl</span> se mesure en mélangeant la terre avec une solution de chlorure de potassium, KCl.</p>
<p>Pourquoi ce sel ? Parce que le sol ne garde pas tous ses H⁺ dans l'eau. Une grande partie reste accrochée aux particules de terre (séance 3), avec de l'aluminium en sol très acide. Les ions K⁺ du sel prennent leur place et les font passer dans l'eau. On mesure alors, en plus, une partie de l'acidité en réserve. Le pH KCl est donc plus bas que le pH eau, le plus souvent de 0,5 à 1 point.</p>

<p>L'écart entre les deux donne une petite idée de cette réserve, mais il ne dit pas combien de chaux il faut. Pour ça, on regarde la CEC et le taux de saturation, qu'on verra à la séance 3. Et le pH KCl bouge moins d'une saison à l'autre que le pH eau, qui peut varier de quelques dixièmes avec la pluie, les apports et l'activité des microbes.</p>

<h3>Le pH d'un sol argileux et riche en humus bouge lentement</h3>
<p>Deux terres au même pH eau peuvent demander des quantités de chaux très différentes, selon la réserve d'acidité accrochée à leurs particules. Une terre sableuse, pauvre en <span class="t" data-t="argile">argile</span> et en <span class="t" data-t="humus">humus</span>, a peu de réserve. Un peu de chaux suffit pour faire monter son pH, mais il redescend vite. Une terre argileuse et riche en humus a une grosse réserve. Il faut plusieurs fois plus de chaux pour faire monter son pH, parce que la chaux doit aussi neutraliser les H⁺ accrochés. Mais une fois corrigé, son pH bouge lentement, dans un sens comme dans l'autre.</p>
<p>On appelle ça le <span class="t" data-t="pouvoir-tampon">pouvoir tampon</span>. On conseille souvent de chauler peu et souvent, en suivant le pH d'une analyse à l'autre. Trop chauler a aussi un prix, puisqu'au-dessus de 7,5, on retrouve les blocages vus en partie 2. Et dans un sol qui contient déjà du calcaire, chauler ne sert à rien.</p>

<h3>Le calcaire actif peut faire jaunir les plantes</h3>
<p>Pour un sol calcaire, l'analyse donne le calcaire total, grains grossiers compris, et le <span class="t" data-t="calcaire-actif">calcaire actif</span>, sa part la plus fine, qui se dissout facilement et libère sans arrêt du calcium et du bicarbonate dans l'eau du sol.</p>
<p>Quand il y en a beaucoup, l'eau du sol se charge en bicarbonate, HCO₃⁻. Le fer y devient très peu soluble, et le bicarbonate empêche en plus la plante de bien utiliser celui qu'elle prend. Les jeunes feuilles jaunissent entre les nervures, qui restent vertes. C'est la <span class="t" data-t="chlorose">chlorose</span> ferrique. Le sol contient souvent beaucoup de fer, mais la plante n'arrive pas à s'en servir. Le fraisier ou le haricot y sont plus sensibles que d'autres. On y revient à la séance 9.</p>

  <ul>
    <li>Le pH mesure la quantité d'ions H⁺ dans l'eau. Plus le chiffre est bas, plus il y en a, et chaque point de moins veut dire dix fois plus de H⁺. L'eau pure est à 7.</li>
    <li>Entre 6 et 7, presque tout est disponible. En sol acide, le phosphore et le molybdène se bloquent, et l'aluminium devient toxique sous 5,5. En sol calcaire, ce sont le phosphore, le fer, le manganèse, le zinc et le bore.</li>

<p class="surtitre">Séance 3 · Argile, humus et CEC</p>
<h1>Qu'est-ce qui retient les engrais dans le sol ?</h1>
<p class="chapo">L'argile et l'humus portent des charges négatives à leur surface. Ils retiennent donc les cations, comme le calcium, le magnésium, le potassium ou l'ammonium, et les gardent à portée de racine. Le nitrate, qui est négatif, n'est pas retenu, et c'est pour ça qu'il part avec l'eau en hiver.</p>

<!-- Partie 1 -->
<h2><span class="partie-num">Partie 1 sur 4</span>Comment l'argile et l'humus retiennent les cations ?</h2>
<p>Une terre est faite de grains de tailles très différentes. Les sables se voient à l'œil nu. Les limons, plus fins, donnent à la terre sèche un toucher de farine. Les argiles, tout ce qui mesure moins de deux millièmes de millimètre, ne se voient qu'au microscope, et les plus fines seulement au microscope électronique.</p>

<h3>L'argile est faite de feuillets empilés</h3>
<p>Une particule d'<span class="t" data-t="argile">argile</span>, c'est un petit paquet de feuillets très fins, empilés comme les pages d'un livre. Ils sont faits surtout de silicium, d'aluminium et d'oxygène. Quand l'argile s'est formée, certains atomes ont été remplacés par d'autres qui portent moins de charges positives, un magnésium à la place d'un aluminium par exemple. Il manque alors des charges positives, et le feuillet porte en surface des charges négatives en trop.</p>
<p>Toutes les argiles n'en portent pas autant. La kaolinite, fréquente dans les sols très anciens, usés par des millénaires de pluie, en porte peu. Les smectites, comme la montmorillonite, en portent beaucoup. Elles gonflent quand elles se mouillent et se rétractent en séchant, d'où les grosses fentes des terres argileuses en été. Les illites sont entre les deux, et on les trouve dans beaucoup de terres de France.</p>

<h3>L'humus porte encore plus de charges</h3>
<p>L'<span class="t" data-t="humus">humus</span>, c'est la part de la <span class="t" data-t="matiere-organique">matière organique</span> du sol qui a été transformée par les microbes et qui ne se décompose plus que très lentement. On le verra à la séance 4. Ses molécules portent à leur surface des petits groupes d'atomes qui peuvent lâcher un ion H⁺. Chaque H⁺ lâché laisse une charge négative derrière lui. À poids égal, l'humus porte plusieurs fois plus de charges négatives que la plupart des argiles.</p>
<p>Ces groupes lâchent leurs H⁺ plus facilement quand le pH monte. L'humus porte donc plus de charges dans un sol neutre que dans un sol acide. On s'en servira en partie 2.</p>

<h3>Le plus attire le moins, et les cations restent collés</h3>
<p>Tu l'as vu à la séance 1, le plus attire le moins. Les charges négatives de l'argile et de l'humus attirent donc les <span class="t" data-t="cation">cations</span> de l'eau du sol. Ca²⁺, Mg²⁺, K⁺, NH₄⁺, Na⁺, H⁺ et, en sol acide, Al³⁺ viennent se coller tout autour des particules. Ils restent accrochés sans être soudés, et chacun peut être remplacé par un autre. Les <span class="t" data-t="anion">anions</span>, eux, sont repoussés.</p>

<h3>Le calcium fait le pont entre l'argile et l'humus</h3>
<p>L'argile et l'humus sont tous les deux négatifs, et deux charges pareilles se repoussent. Seuls, ils ne tiendraient pas ensemble. Mais un ion Ca²⁺, avec ses deux charges positives, peut s'accrocher d'un côté à l'argile et de l'autre à l'humus, et les relier comme un pont. En sol acide, où le calcium manque, ce sont surtout le fer et l'aluminium qui font ces ponts. L'ensemble forme le <span class="t" data-t="complexe">complexe argilo-humique</span>, la partie du sol qui retient les éléments en réserve.</p>
<p>Ces ponts collent les particules en petits grumeaux, qui laissent passer l'air et l'eau, et c'est une des raisons pour lesquelles une terre riche en calcium et en humus a souvent une bonne structure. Le sodium fait l'inverse. Avec une seule charge et une grosse enveloppe d'eau autour de lui, il ne fait pas de pont, il disperse l'argile, et la terre se tasse et forme une croûte quand elle sèche.</p>

<!-- Partie 2 -->
<h2><span class="partie-num">Partie 2 sur 4</span>Que veut dire la CEC sur une analyse ?</h2>
<p>Sur une analyse de terre, la <span class="t" data-t="cec">CEC</span>, pour capacité d'échange cationique, donne le nombre de places que le sol offre aux cations. C'est la taille du garde-manger. Plus elle est grande, plus le sol peut garder de calcium, de magnésium, de potassium et d'ammonium en réserve.</p>

<h3>La CEC se mesure en charges, pas en ions</h3>
<p>Une place, c'est une charge négative du sol. Un ion K⁺, qui porte une charge, occupe une place. Un ion Ca²⁺, qui en porte deux, en occupe deux. Pour remplir les mêmes places, il faut donc deux fois moins d'ions calcium que d'ions potassium.</p>
<p>Les chimistes mesurent ces places en équivalents. Un équivalent, c'est un énorme paquet de charges, toujours le même. Un <span class="t" data-t="meq">milliéquivalent</span>, ou meq, c'est un millième de ce paquet. Sur une analyse, la CEC s'écrit en meq pour 100 g de terre. Certains laboratoires l'écrivent en cmol+/kg, en centimoles de charges par kilo. C'est exactement la même valeur, puisque 1 meq pour 100 g, c'est 10 meq par kilo, soit 1 cmol+ par kilo.</p>
<p>Voici le poids de chaque élément qu'il faut pour remplir 1 meq de places. Un atome de potassium et un atome de calcium pèsent presque pareil, mais comme le calcium porte deux charges, il en faut deux fois moins.</p>
<table>
  <thead><tr><th>Ion</th><th>Pour remplir 1 meq de places</th></tr></thead>
  <tbody>
    <tr><td class="symb">K⁺</td><td>39 mg de potassium</td></tr>
    <tr><td class="symb">Ca²⁺</td><td>20 mg de calcium</td></tr>
    <tr><td class="symb">Mg²⁺</td><td>12 mg de magnésium</td></tr>
    <tr><td class="symb">Na⁺</td><td>23 mg de sodium</td></tr>
  </tbody>
</table>
<p>Ramené au champ, ça fait beaucoup. Sur 30 cm de profondeur, un hectare contient environ 4 000 tonnes de terre. Si l'analyse donne 1 meq de K⁺ pour 100 g, ça fait environ 1,5 tonne de potassium accrochée sur chaque hectare.</p>

<h3>La CEC dépend de l'argile et de l'humus</h3>
<p>Voici des ordres de grandeur, pour 100 g de chaque constituant.</p>
<table>
  <thead><tr><th>Pour 100 g de…</th><th>CEC, en meq</th></tr></thead>
  <tbody>
    <tr><td>Sable</td><td>presque rien</td></tr>
    <tr><td>Kaolinite</td><td>3 à 15</td></tr>
    <tr><td>Illite</td><td>10 à 40</td></tr>
    <tr><td>Smectite</td><td>80 à 150</td></tr>
    <tr><td>Humus</td><td>150 à 300, selon le pH</td></tr>
  </tbody>
</table>
<p>Une terre mélange tout ça. Prends une terre à 20 % d'argile et 2 % de matière organique. Son argile est de l'illite, à environ 30 meq pour 100 g, et sa matière organique, qui est surtout de l'humus, en offre environ 200 pour 100 g. L'argile apporte 20 × 0,3 = 6 meq, la matière organique 2 × 2 = 4 meq, et la CEC tourne autour de 10 meq. Avec ces chiffres, deux points de matière organique apportent presque autant de places que vingt points d'argile. Avec une argile plus chargée, comme une smectite, l'argile en apporterait bien plus. Pour une terre entière, on trouve en gros moins de 8 meq si elle est sableuse, de 8 à 15 si elle est limoneuse, et de 15 à 30, parfois plus, si elle est argileuse.</p>
<p>Attention quand tu compares deux analyses. La méthode la plus courante en France, dite Metson, mesure la CEC à pH 7. D'autres laboratoires la mesurent au pH du sol, par exemple avec la méthode à la cobaltihexamine. Dans un sol acide, la seconde donne un chiffre plus bas, puisque l'humus y porte moins de charges. Compare donc des analyses faites avec la même méthode.</p>

<h3>L'analyse donne aussi ce qui occupe les places</h3>
<p>L'analyse donne aussi la quantité de chaque cation accroché, en meq pour 100 g. Ce sont les <span class="t" data-t="cations-echangeables">cations échangeables</span>, ceux qui peuvent se décrocher et passer dans l'eau du sol. On y trouve surtout Ca²⁺, Mg²⁺, K⁺ et Na⁺. Le reste des places est tenu par des H⁺, et par de l'aluminium en sol très acide.</p>
<p>Le <span class="t" data-t="taux-saturation">taux de saturation</span>, c'est la part des places occupée par le calcium, le magnésium, le potassium et le sodium, plutôt que par l'acidité. Voici comment se remplissent les places d'une terre limoneuse prise pour l'exemple.</p>
<figure>
  <div class="barre" role="img" aria-label="Une CEC de 12 meq : calcium 7,6, magnésium 1,6, potassium 0,5, sodium 0,1, et 2,2 meq tenus par l'acidité, c'est-à-dire par les H⁺.">
    <span class="s3-ca" style="flex:7.6">Ca²⁺</span><span class="s3-mg" style="flex:1.6">Mg²⁺</span><span class="s3-k" style="flex:0.5"></span><span class="s3-na" style="flex:0.1"></span><span class="s3-h" style="flex:2.2">H⁺</span>
  </div>
  <ul class="legende">
    <li><i class="s3-ca"></i>Calcium, 7,6 meq</li>
    <li><i class="s3-mg"></i>Magnésium, 1,6 meq</li>
    <li><i class="s3-k"></i>Potassium, 0,5 meq</li>
    <li><i class="s3-na"></i>Sodium, 0,1 meq</li>
    <li><i class="s3-h"></i>Acidité (H⁺), 2,2 meq</li>
  </ul>
  <figcaption>Sur 12 places, 9,8 sont tenues par le calcium, le magnésium, le potassium et le sodium. Le taux de saturation est donc de 9,8 sur 12, soit environ 82 %.</figcaption>
</figure>
<p>Dans la plupart des terres cultivées, le calcium occupe de loin la plus grande part des places, le magnésium vient ensuite, puis le potassium, et le sodium n'en a qu'une toute petite. Plus une terre est acide, plus son taux de saturation est bas, et le chaulage le fait remonter. On verra à la séance 11 ce que certains considèrent comme un bon équilibre entre ces parts, et on lira une vraie analyse à la séance 13.</p>
<p>Dans une terre calcaire, l'analyse donne souvent un taux de 100 %, parfois plus. Ce n'est pas une erreur de frappe. Une partie du calcaire se dissout pendant la mesure et ajoute du calcium, et de toute façon la terre est saturée.</p>

<!-- Partie 3 -->
<h2><span class="partie-num">Partie 3 sur 4</span>Comment la racine échange des ions avec le sol ?</h2>
<p>La racine ne va pas chercher ses ions directement sur l'argile. Elle les prend dans l'eau du sol, comme on l'a vu à la séance 1. Le complexe sert de réserve, et ce sont les échanges entre le complexe et l'eau du sol qui nourrissent la plante.</p>

<h3>L'eau du sol est l'assiette, le complexe est le garde-manger</h3>
<p>Dans une terre, l'eau ne contient qu'une petite partie des cations. La plus grosse part est accrochée au complexe. Quand la racine prend des K⁺ dans l'eau, il en reste moins autour d'elle, et des K⁺ du complexe se décrochent pour les remplacer. L'eau du sol se recharge ainsi au fur et à mesure. Une terre avec une grande CEC nourrit donc plus régulièrement qu'un sable, parce que son garde-manger est plus grand.</p>

<h3>La racine relâche des H⁺ en échange</h3>
<p>Pour faire entrer des cations, la racine pompe des ions H⁺ vers l'extérieur. Ça lui coûte de l'énergie, qu'elle tire des sucres envoyés par les feuilles. On le verra à la séance 6. Ces H⁺ ressortent dans l'eau autour de la racine, et certains vont prendre sur le complexe la place d'un K⁺ ou d'un Ca²⁺. Le cation décroché passe à son tour dans l'eau, où la racine peut le prendre. Le sol cède donc ses cations en échange d'acidité. Et ce n'est qu'un cas parmi d'autres. Les cations accrochés s'échangent sans arrêt avec ceux de l'eau du sol, et c'est de là que vient le nom de capacité d'échange.</p>

<h3>Tous les cations ne tiennent pas aussi fort</h3>
<p>Les cations ne s'accrochent pas tous avec la même force. Plus un ion porte de charges, plus il tient. Et à charge égale, plus il est petit, enveloppe d'eau comprise, plus il se colle près de la surface et plus il tient. Voici l'ordre, du plus accroché au moins accroché.</p>
<div class="equation">Al³⁺ &gt; Ca²⁺ &gt; Mg²⁺ &gt; K⁺ ≈ NH₄⁺ &gt; Na⁺<small>L'ion H⁺ est à part. Il s'accroche très fort, presque comme l'aluminium.</small></div>
<p>Ça explique deux choses qu'on voit au champ. Le sodium, le moins accroché, part le premier avec l'eau. Et en sol acide, l'aluminium et les H⁺ chassent peu à peu le calcium, le magnésium et le potassium, que la pluie emporte ensuite.</p>

<h3>La quantité joue aussi</h3>
<p>Un ion moins accroché peut quand même en chasser un plus accroché, s'il arrive en grand nombre. C'est ce que fait le K⁺ du chlorure de potassium dans la mesure du pH KCl, à la séance 2. Au champ, c'est pareil. Un gros apport de potasse fait passer dans l'eau une partie du magnésium et du calcium accrochés, et la plante a alors plus de mal à prendre son magnésium. On verra ce genre de déséquilibre à la séance 10.</p>

<!-- Partie 4 -->
<h2><span class="partie-num">Partie 4 sur 4</span>Pourquoi le nitrate part l'hiver, et pas le potassium ?</h2>
<p>Tu as maintenant toutes les pièces. L'argile et l'humus sont négatifs. Ils retiennent les cations et repoussent les anions.</p>

<h3>Le nitrate n'a rien pour s'accrocher</h3>
<p>Le nitrate, NO₃⁻, porte une charge négative. Le complexe ne le retient pas, il le repousse même un peu. Il reste donc dans l'eau du sol et suit l'eau partout où elle va. Quand l'eau descend sous les racines, il descend avec elle. C'est le <span class="t" data-t="lessivage">lessivage</span> du nitrate.</p>
<p>L'ammonium, NH₄⁺, et le potassium, K⁺, sont des cations. Ils restent accrochés au complexe et ne partent presque pas, sauf dans un sable très pauvre en argile et en humus, où les places manquent. Mais l'ammonium ne le reste pas longtemps. Dès que le sol se réchauffe, les bactéries le changent en nitrate, et il peut partir à son tour.</p>

<h3>Tous les anions ne partent pas</h3>
<p>Le phosphate est négatif lui aussi, mais il ne part presque pas. Tu l'as vu à la séance 2, il s'accroche au fer, à l'aluminium et au calcium, et forme avec eux des composés qui se dissolvent mal. Le sulfate, SO₄²⁻, part lui aussi avec l'eau, mais moins que le nitrate. Le chlorure, Cl⁻, part très facilement.</p>

<h3>C'est en hiver que l'eau traverse le sol</h3>
<p>En été, la pluie est vite reprise par les plantes et l'évaporation. Elle ne descend sous les racines qu'après un gros orage sur une terre légère, ou avec un arrosage trop copieux. En hiver, les plantes poussent peu, et le sol se remplit d'eau jusqu'à ne plus pouvoir en garder. L'eau en trop traverse alors la terre et descend vers la nappe, en emportant le nitrate.</p>
<p>Pour te faire une idée, dans une terre limoneuse, chaque fois que 100 mm d'eau traversent le sol, le nitrate descend d'une trentaine de centimètres. Dans un sable, qui garde moins d'eau, il descend bien plus vite. Le nitrate qui reste dans le sol à l'automne, après les dernières récoltes, est donc celui qui risque de partir.</p>
<p>Sous un abri, c'est différent. La pluie n'arrive pas, et le nitrate ne descend qu'avec l'eau d'arrosage. Il peut alors s'accumuler d'une année sur l'autre.</p>

<h3>Un couvert d'hiver prend le nitrate avant qu'il parte</h3>
<p>Sur un sol nu, rien ne retient le nitrate. Un couvert semé à la fin de l'été, comme une moutarde, une phacélie ou un seigle, prend ce nitrate par ses racines et le garde dans ses feuilles. Au printemps, on détruit le couvert, et les microbes rendent une partie de cet azote à la culture suivante. Détruit jeune, le couvert le rend assez vite. Détruit vieux, il peut même en prendre au sol au début. On le verra à la séance 4. Bien développé, un couvert peut réduire de moitié, souvent plus, le nitrate qui part. On y revient à la séance 5, avec la différence entre ces couverts et un <span class="t" data-t="engrais-vert">engrais vert</span> de légumineuses.</p>

  <ul>
    <li>L'argile et l'humus portent des charges négatives. Ils retiennent les cations, comme Ca²⁺, Mg²⁺, K⁺ et NH₄⁺, et repoussent les anions. À poids égal, l'humus retient bien plus que la plupart des argiles.</li>

<p class="surtitre">Séance 4 · La matière organique</p>
<h1>Comment la matière organique nourrit les légumes ?</h1>
<p class="chapo">La matière organique du sol, ce sont des restes de plantes, d'animaux et de microbes, du plus frais au plus transformé. Les microbes la mangent, et en la mangeant, ils libèrent l'azote dont les légumes ont besoin. Ils vont plus ou moins vite selon la chaleur, l'eau, l'air et ce qu'on leur donne à manger. L'argile les freine aussi, parce qu'elle met une partie de la matière organique à l'abri.</p>

<!-- Partie 1 -->
<h2><span class="partie-num">Partie 1 sur 4</span>La matière organique, c'est quoi au juste ?</h2>
<p>La <span class="t" data-t="matiere-organique">matière organique</span>, c'est tout ce qui, dans le sol, vient d'un être vivant. On y trouve des racines mortes, des feuilles, des résidus de culture, du fumier, des restes de vers et d'insectes, et des microbes, morts ou vivants. Elle est faite surtout de carbone, accroché à de l'hydrogène et à de l'oxygène, avec un peu d'azote, de phosphore et de soufre.</p>

<h3>Elle va du plus frais au plus transformé</h3>
<p>On peut la ranger en trois parts, et la matière passe peu à peu de l'une à l'autre.</p>
<ul>
  <li><b>La part vivante</b> : les racines, les microbes, les vers de terre et toute la petite faune. Elle ne fait que quelques pour cent de la matière organique, mais c'est elle qui fait tout le travail.</li>
  <li><b>La matière fraîche</b> : les résidus de culture, un <span class="t" data-t="engrais-vert">engrais vert</span> enfoui, un fumier, à divers stades de décomposition. Elle disparaît en quelques semaines à quelques années.</li>
  <li><b>L'<span class="t" data-t="humus">humus</span></b> : ce qui reste après le passage des microbes, très transformé, souvent collé à l'argile. C'est la plus grosse part dans une terre cultivée, et il ne se décompose que très lentement, sur des dizaines d'années, parfois des siècles.</li>
</ul>

<h3>Elle contient environ 58 % de carbone</h3>
<p>Les laboratoires ne pèsent pas directement la matière organique. Ils mesurent le carbone organique du sol, puis le multiplient par un coefficient. On considère que la matière organique contient en moyenne 58 % de carbone. Pour retrouver la matière organique à partir du carbone, on multiplie donc par 100 divisé par 58, soit 1,72.</p>
<div class="equation">MO = carbone organique × 1,72<small>Une terre à 1,45 % de carbone organique a donc environ 2,5 % de matière organique.</small></div>
<p>C'est une convention, pas une loi de la nature. En réalité, la matière organique d'un sol contient entre 45 et 60 % de carbone environ, selon les sols, et certains laboratoires multiplient par 2 au lieu de 1,72. Quand tu compares deux analyses, regarde le coefficient, ou mieux, compare directement le carbone.</p>
<p>La matière organique d'une terre cultivée, qui est surtout de l'humus, contient aussi environ 1 g d'azote pour 10 g de carbone, soit 5 à 6 % d'azote. C'est cet azote-là qui nous intéresse.</p>

<h3>Elle ne sert pas qu'à nourrir</h3>
<p>Tu l'as vu à la séance 3, l'humus porte beaucoup de charges négatives et retient les cations. Il colle aussi les particules en grumeaux, ce qui aide l'eau à entrer et l'air à circuler, et il garde de l'eau. Mais dans cette séance, c'est l'azote de la matière organique qui nous intéresse, et les êtres vivants qui le libèrent.</p>

<h2><span class="partie-num">Partie 2 sur 4</span>Qui la mange, et à quelle vitesse ?</h2>

<h3>Une foule d'êtres vivants s'en nourrit</h3>
<p>Un gramme de terre contient de l'ordre de cent millions à un milliard de bactéries, et des mètres de filaments de champignons. Autour d'eux vivent des nématodes, des acariens, des collemboles et les vers de terre, qui découpent les débris, les mélangent à la terre et les enfouissent. Les bactéries et les champignons font la chimie, en découpant les grosses molécules en petites. Ce sont surtout les champignons qui viennent à bout du bois et de la paille.</p>

<h3>La plus grande partie du carbone repart dans l'air</h3>
<p>Un microbe se sert de ce qu'il mange de deux façons. Il en brûle une partie pour avoir de l'énergie, en respirant comme nous, et ce carbone repart dans l'air sous forme de gaz carbonique. Avec le reste, il construit son propre corps. En ordre de grandeur, sur 100 g de carbone mangé, il en rejette à peu près les deux tiers en gaz carbonique, et il en garde un tiers.</p>
<p>L'azote, lui, ne part pas avec le gaz carbonique que rejette le microbe. Le microbe garde ce dont son corps a besoin, et il relâche le surplus dans le sol sous forme d'ammonium, NH₄⁺. C'est l'<span class="t" data-t="ammonification">ammonification</span>, la première étape de la <span class="t" data-t="mineralisation">minéralisation</span>. D'autres bactéries changent ensuite cet ammonium en nitrate, comme on l'a vu à la séance 2. Une partie de cet azote peut quand même partir dans l'air plus tard, depuis un fumier laissé en surface ou une terre gorgée d'eau. On verra tout ça à la séance 5.</p>

<h3>La chaleur accélère tout</h3>
<p>Comme toute la chimie du vivant, la minéralisation va plus vite quand il fait chaud. En ordre de grandeur, elle va environ deux fois plus vite pour 10 °C de plus. Dans une terre à 25 °C, elle va donc à peu près quatre fois plus vite que dans une terre à 5 °C. Sous 5 °C, elle devient très lente, sans s'arrêter tout à fait.</p>
<p>C'est pour ça que la farine de plume apportée en mars, à la séance 1, mettait du temps à nourrir les poireaux. Et un sol sous serre, plus chaud et arrosé, minéralise plus qu'un sol en plein champ.</p>

<h3>Il leur faut aussi de l'eau, de l'air et un pH correct</h3>
<p>Dans une terre sèche, les microbes s'arrêtent. Dans une terre gorgée d'eau, l'air ne passe plus, et ceux qui ont besoin d'oxygène laissent la place à d'autres, bien plus lents. La minéralisation va le plus vite dans une terre humide mais pas détrempée, qui garde de l'air entre ses grains.</p>
<p>Le pH joue aussi. Tu l'as vu à la séance 2, les bactéries travaillent moins bien en sol acide, et un chaulage relance souvent la minéralisation. D'où le vieux dicton paysan, « la chaux enrichit le père et ruine le fils ». Avec la chaux, les microbes libèrent vite l'azote de l'humus, et la récolte en profite. Mais sans apport de matière organique, la réserve fond.</p>

<h3>Combien d'azote libère une terre à 2,5 % de matière organique ?</h3>
<p>Fais le calcul pour une terre maraîchère, sur les 30 premiers centimètres.</p>
<ol>
  <li>Sur 30 cm, un hectare contient environ 4 000 tonnes de terre, comme on l'a vu à la séance 3.</li>
  <li>2,5 % de 4 000 tonnes, ça fait 100 tonnes de matière organique par hectare.</li>
  <li>Avec environ 5,8 % d'azote dans cette matière organique, ça fait près de 6 tonnes d'azote par hectare.</li>
  <li>Cette matière organique, surtout de l'humus, se minéralise d'environ 1 à 2 % par an. Il libère donc chaque année de 60 à 120 kg d'azote par hectare.</li>
</ol>
<p>Six tonnes d'azote, c'est énorme, bien plus que tous les légumes d'une année n'en prendront. Mais la plus grande partie dort dans l'humus, et seule une petite part se réveille chaque année. Ces 60 à 120 kg sont du même ordre de grandeur que ce que calcule Ménort, entre une cinquantaine et une centaine de kilos selon l'argile. On y revient en partie 4.</p>

<h2><span class="partie-num">Partie 3 sur 4</span>Pourquoi la paille enfouie fait jaunir les salades ?</h2>

<h3>Avec le rapport C/N, on sait si une matière est riche en azote</h3>
<p>Pour savoir comment une paille, un fumier ou un engrais va se comporter dans le sol, on regarde son <span class="t" data-t="rapport-cn">rapport C/N</span>, son poids de carbone divisé par son poids d'azote. Une paille à C/N 100 contient 100 g de carbone pour 1 g d'azote. Un sang séché à C/N 4 contient 4 g de carbone pour 1 g d'azote, il est donc très riche en azote.</p>
<table>
  <thead><tr><th>Matière</th><th>C/N, environ</th></tr></thead>
  <tbody>
    <tr><td>Sang séché, farine de plume</td><td>3 à 5</td></tr>
    <tr><td>Tourteaux, comme le tourteau de ricin</td><td>5 à 10</td></tr>
    <tr><td>Corps des microbes du sol</td><td>autour de 8</td></tr>
    <tr><td>Humus d'une terre cultivée</td><td>8 à 12</td></tr>
    <tr><td>Engrais vert jeune de légumineuses</td><td>10 à 15</td></tr>
    <tr><td>Compost mûr</td><td>10 à 20</td></tr>
    <tr><td>Fumier de bovins pailleux</td><td>15 à 25</td></tr>
    <tr><td>Seigle ou moutarde en fin de cycle</td><td>25 à 50</td></tr>
    <tr><td>Paille de céréales</td><td>80 à 120</td></tr>
    <tr><td>Sciure, copeaux de bois</td><td>plusieurs centaines</td></tr>
  </tbody>
</table>
<p>Ces chiffres changent d'un lot à l'autre, et surtout avec l'âge. Une moutarde jeune et tendre a un C/N bas, la même montée en graines un C/N bien plus haut.</p>

<h3>Les microbes ont besoin d'azote pour grandir</h3>
<p>Le corps d'un microbe a un C/N d'environ 8. Pour grandir, il lui faut donc environ 1 g d'azote pour 8 g de carbone gardé. Reprends les 100 g de carbone mangé, dont le microbe garde environ un tiers, soit 33 g. Pour fabriquer son corps avec ces 33 g de carbone, il lui faut environ 4 g d'azote.</p>
<ul>
  <li>Avec du sang séché à C/N 4, les 100 g de carbone arrivent avec 25 g d'azote. Le microbe en garde 4, et relâche les 21 autres en ammonium. L'azote est vite libéré.</li>
  <li>Avec une paille à C/N 100, les 100 g de carbone n'arrivent qu'avec 1 g d'azote. Il en manque 3, et le microbe va les chercher dans le sol, dans le nitrate et l'ammonium que la plante aurait pu prendre.</li>
</ul>
<p>Le calcul donne donc un point d'équilibre autour d'un C/N de 25, et c'est bien ce qu'on mesure au bout de quelques mois. Mais pour nourrir vite une culture, il faut un C/N bas, sous 10 à 15. Entre 15 et 25, une matière libère peu d'azote la première année, et peut même en prendre au début. Au-dessus de 25, elle en prend au sol le temps de se décomposer.</p>
<p>Le C/N ne fait pas tout. La farine de plume a un C/N aussi bas que le sang séché, mais elle est faite de kératine, la même matière que les ongles, qui résiste aux microbes. Elle libère donc son azote moins vite. On compare la vitesse des engrais organiques à la séance 5.</p>

<h3>La faim d'azote fait jaunir les salades</h3>
<p>Imagine une planche où tu enfouis de la paille, ou les tiges sèches d'un maïs doux, quelques jours avant de planter des salades. Les microbes se jettent sur ce carbone et prennent tout l'azote minéral qu'ils trouvent dans le sol. Les salades, à côté, n'en trouvent plus assez. Elles poussent mal, et leurs vieilles feuilles jaunissent en premier, parce que la plante vide ses vieilles feuilles pour nourrir les jeunes. C'est la <span class="t" data-t="faim-azote">faim d'azote</span>.</p>

<p>Ce n'est pas définitif, mais ça dure. La faim d'azote est la plus forte entre deux semaines et deux mois après l'enfouissement, selon la chaleur. Ensuite, les microbes qui ont mangé la paille meurent et sont mangés à leur tour, et l'azote qu'ils avaient pris revient peu à peu dans le sol. Mais ça prend plusieurs mois, et une partie seulement revient dans l'année. L'azote n'a pas disparu, les microbes l'ont emprunté, et pour longtemps.</p>

<h3>Pour l'éviter, on laisse le temps aux microbes</h3>
<p>Le plus simple est d'enfouir la paille au moins un à deux mois avant de planter, par temps doux, pour que le gros de la faim d'azote soit passé quand les racines arrivent. On peut aussi apporter en même temps une matière riche en azote. Et une paille posée sur le dessus, en paillage, prend beaucoup moins d'azote, parce qu'elle ne touche qu'une fine couche de terre. C'est pareil pour le bois raméal fragmenté, les copeaux ou un engrais vert détruit trop vieux.</p>
<p>C'est aussi pour ça qu'un compost bien mûr, à C/N bas, ne fait pas de faim d'azote, alors qu'un fumier très pailleux et frais peut en faire un peu.</p>

<h2><span class="partie-num">Partie 4 sur 4</span>Pourquoi l'argile ralentit la minéralisation ?</h2>

<h3>Une partie de la matière fraîche devient de l'humus</h3>
<p>Quand une paille ou un fumier se décompose, tout ne repart pas en gaz carbonique. Une partie, la plus résistante, reste dans le sol sous une forme très transformée, avec une partie des corps des microbes eux-mêmes. C'est l'<span class="t" data-t="humification">humification</span>, qui fabrique l'humus.</p>
<p>La part qui devient de l'humus change beaucoup d'une matière à l'autre. En ordre de grandeur, une paille ou un engrais vert jeune ne laissent en humus que 10 à 20 % de leur matière organique, un fumier 30 à 50 %, et un compost mûr davantage, parce qu'une partie de sa transformation s'est déjà faite dans le tas. Sur la fiche d'un compost du commerce, tu trouveras parfois l'ISMO, l'indice de stabilité de la matière organique, qui estime cette part.</p>
<p>C'est pour ça qu'un compost nourrit peu la première année. D'après les références de la FNAB que reprend Ménort, 10 tonnes de compost de bovins apportent environ 70 kg d'azote, dont 14 seulement servent aux légumes la première année. Le reste est surtout pris dans de la matière stable, dont les microbes ne libèrent l'azote que lentement, les années suivantes.</p>
<p>On a longtemps pensé que l'humus était fait de grosses molécules à part, fabriquées dans le sol. Les chercheurs le voient aujourd'hui plutôt comme un mélange de restes de microbes et de plantes, qui ont échappé aux microbes parce qu'ils sont collés à l'argile ou enfermés dans des grumeaux. C'est justement le sujet de la suite.</p>

<h3>L'argile met la matière organique à l'abri</h3>
<p>L'argile protège la matière organique de deux façons. D'abord, les petites molécules organiques se collent à la surface des feuillets d'argile, souvent par les ponts de calcium vus à la séance 3. Les microbes n'arrivent plus à les découper. Ensuite, l'argile et l'humus forment des grumeaux. À l'intérieur des plus petits, les pores sont si fins que les bactéries n'y entrent pas, et l'air y circule mal. La matière organique enfermée là peut y rester des dizaines d'années.</p>
<p>Résultat, à matière organique égale, une terre argileuse libère moins d'azote qu'une terre sableuse ou limoneuse, puisqu'une partie de son humus est hors d'atteinte. À l'inverse, une terre sableuse minéralise vite, mais garde mal sa matière organique. C'est aussi pour ça que les terres argileuses sont souvent plus riches en matière organique. Un même taux de matière organique ne veut donc pas dire la même chose dans un sable et dans une argile. On y reviendra à la séance 13. Le calcaire joue dans le même sens que l'argile, mais beaucoup moins.</p>

<h1>D'où vient l'azote du sol, et où part-il ?</h1>

<!-- Partie 1 -->
<h2><span class="partie-num">Partie 1 sur 4</span>Comment les légumineuses attrapent l'azote de l'air ?</h2>
<p>On l'a vu à la séance 1, l'azote de l'air, N₂, est fait de deux atomes tenus par trois liaisons, et aucune plante ne sait les casser. Les légumineuses, comme la fève, le pois, la vesce ou le trèfle, ont trouvé une solution. Elles logent dans leurs racines des bactéries qui savent le faire.</p>

<h3>Les bactéries s'installent dans les nodosités</h3>
<p>Ces bactéries s'appellent des rhizobiums. Elles vivent librement dans le sol. Quand une racine de légumineuse pousse près d'elles, la plante et la bactérie s'envoient des signaux chimiques. La bactérie entre par un poil de la racine, et la racine fabrique autour d'elle une petite boule, la <span class="t" data-t="nodosite">nodosité</span>.</p>
<p>Chaque légumineuse a ses bactéries attitrées. Celles du pois, de la fève et de la vesce ne sont pas celles du soja. Dans une terre qui n'a jamais porté de soja, on le sème donc avec sa bactérie.</p>

<h3>Une enzyme casse les trois liaisons</h3>
<p>Dans la nodosité, la bactérie fabrique une <span class="t" data-t="enzyme">enzyme</span>, c'est-à-dire une protéine qui sert d'outil à la cellule pour faire une réaction précise. On en reparlera à la séance 7. Celle-ci s'appelle la <span class="t" data-t="nitrogenase">nitrogénase</span>. Elle casse les trois liaisons du N₂ et accroche des hydrogènes à chaque atome d'azote. Il en sort de l'ammoniac, NH₃, que la bactérie passe aussitôt à la plante. C'est la <span class="t" data-t="fixation">fixation</span> de l'azote.</p>
<p>La nitrogénase a deux exigences. Elle contient du molybdène et du fer, si bien qu'une légumineuse fixe mal quand le molybdène manque, surtout en sol acide. Et l'oxygène la détruit. Pour la protéger, la nodosité fabrique une molécule proche de l'hémoglobine de notre sang, qui capte l'oxygène pour qu'il en reste très peu autour de l'enzyme. C'est elle qui donne à la nodosité sa couleur rose.</p>
<p>Ça donne un test simple au champ. Arrache un pied avec sa motte et coupe une nodosité en deux. Si elle est rose ou rouge dedans, elle fixe. Si elle est blanche, verte ou brune, elle ne fixe pas encore, ou plus.</p>

<h3>La plante paie ce service en sucre</h3>
<p>Casser N₂ demande énormément d'énergie. La bactérie la tire des sucres que la plante lui envoie. Selon les espèces et les mesures, une légumineuse dépense de l'ordre de 2 à 6 g de carbone par gramme d'azote fixé, en général un peu plus que pour prendre du nitrate tout prêt dans le sol.</p>

<h3>Avec du nitrate dans le sol, la légumineuse fixe moins</h3>
<p>Puisque fixer coûte cher, la légumineuse fait moins de nodosités quand le sol est déjà riche en nitrate, et elle prend ce nitrate comme n'importe quelle plante.</p>
<p>Pour un engrais vert, ça a deux conséquences. Une vesce semée après une tomate bien nourrie prend d'abord le nitrate qui reste, ce qui est déjà un service, mais elle tire moins d'azote de l'air. Semée avec de l'avoine ou du seigle, elle fixe davantage, parce que la céréale lui prend le nitrate du sol.</p>

<h3>Un engrais vert de vesce rend beaucoup d'azote</h3>
<p>Quand on enfouit un <span class="t" data-t="engrais-vert">engrais vert</span> de légumineuses, tout l'azote de ses feuilles, de ses tiges et de ses racines revient au sol. Comme c'est une matière tendre et riche en azote, les microbes en libèrent vite une bonne part, de l'ordre de la moitié dans la saison pour une vesce enfouie en fleur. Le reste se libère plus lentement, les années suivantes. On a vu à la séance 4 pourquoi le <span class="t" data-t="rapport-cn">rapport C/N</span> décide de cette vitesse.</p>
<p>D'après les références de la FNAB, reprises dans Ménort, une vesce rend environ 130 kg d'azote par hectare à la culture qui la suit, et une moutarde 35, puisqu'elle ne fixe rien et rend seulement une partie de ce qu'elle a pris dans le sol. Ce sont des moyennes. Le vrai chiffre dépend de la quantité de feuillage et de la date d'enfouissement, et une vesce maigre ou détruite trop tôt en rend bien moins. Quand on récolte des fèves ou des pois, au contraire, une bonne part de l'azote fixé part avec les graines.</p>

<!-- Partie 2 -->
<h2><span class="partie-num">Partie 2 sur 4</span>Comment l'ammonium devient nitrate ?</h2>
<p>Revenons à l'azote pris dans la matière organique d'un compost, de résidus ou d'un engrais vert. On a vu à la séance 4 comment les microbes la mangent. Voici ce que devient son azote.</p>

<h3>Beaucoup de microbes libèrent l'ammonium</h3>
<p>Dans la matière organique, l'azote est surtout dans les protéines. Les bactéries et les champignons qui les mangent rejettent l'azote qu'ils ont en trop sous forme d'ammonium, NH₄⁺. C'est l'<span class="t" data-t="ammonification">ammonification</span>, la première étape de la <span class="t" data-t="mineralisation">minéralisation</span>. Une foule de microbes savent la faire, et elle continue au ralenti dans un sol froid ou mal aéré.</p>
<p>L'ammonium est un cation. L'argile et l'humus le retiennent (séance 3), et la racine peut le prendre tel quel. Mais dans un sol cultivé, il ne reste pas longtemps sous cette forme.</p>

<h3>Deux groupes de bactéries le changent en nitrate</h3>
<p>La <span class="t" data-t="nitrification">nitrification</span> se fait en deux étapes, par deux groupes de bactéries spécialisées. Les premières, comme les <i>Nitrosomonas</i>, changent l'ammonium en nitrite, NO₂⁻. Les secondes, comme les <i>Nitrobacter</i>, changent le nitrite en nitrate, NO₃⁻. On sait aujourd'hui que d'autres microbes, des archées, font aussi la première étape, surtout en sol acide.</p>
<div class="equation">NH₄⁺ → NO₂⁻ → NO₃⁻<small>L'ammonium devient nitrite, puis nitrate.</small></div>
<p>La seconde étape suit de près la première. Le nitrite, toxique pour les racines, ne s'accumule donc presque pas dans une terre en bonne santé.</p>

<h3>Ces bactéries vivent de l'ammonium</h3>
<p>Les bactéries nitrifiantes ne mangent pas de matière organique. Elles prennent leur carbone dans le gaz carbonique, comme une plante, et leur énergie dans l'ammonium lui-même, en arrachant des électrons à son azote. Pour ça, il leur faut de l'oxygène.</p>
<p>En devenant nitrate, l'azote de l'ammonium perd 8 électrons. Retiens ce chiffre. Pour se servir de ce nitrate, la plante devra les lui rendre, et ça lui coûtera cher. On le verra à la séance 7.</p>

<h3>La nitrification acidifie le sol</h3>
<p>En chemin, chaque ammonium changé en nitrate libère deux ions H⁺. Or on a vu à la séance 2 que les ions H⁺, c'est l'<span class="t" data-t="acide">acidité</span>.</p>
<div class="equation">NH₄⁺ + 2 O₂ → NO₃⁻ + 2 H⁺ + H₂O<small>L'ammonium et l'oxygène donnent du nitrate, de l'acidité et de l'eau.</small></div>
<p>Quand l'azote vient de la matière organique, cette acidité s'efface presque toute si la plante prend le nitrate. Les microbes avaient déjà retiré un H⁺ du sol en libérant l'ammonium, et la racine qui prend le nitrate rejette un peu de base, qui neutralise le second. Mais quand le nitrate part avec l'eau, l'acidité reste dans le sol. C'est en partie pour ça qu'une terre cultivée s'acidifie peu à peu, et qu'on finit par faire un <span class="t" data-t="chaulage">chaulage</span>.</p>

<h3>Au froid, en sol acide ou sans air, la nitrification ralentit</h3>
<p>Les bactéries nitrifiantes sont plus délicates que les microbes qui libèrent l'ammonium. Elles travaillent le mieux vers 25 à 30 °C, très peu sous 5 °C. Elles ralentissent quand le <span class="t" data-t="ph">pH</span> descend sous 5,5 à 6 environ, et s'arrêtent sans oxygène, dans un sol tassé ou gorgé d'eau.</p>
<p>Dans une terre tiède et aérée, l'ammonium devient nitrate en quelques jours à quelques semaines, et la racine trouve donc surtout du nitrate. Dans une terre encore froide, au début du printemps, l'ammonium reste plus longtemps.</p>

<!-- Partie 3 -->
<h2><span class="partie-num">Partie 3 sur 4</span>Par où l'azote quitte le sol ?</h2>
<p>Rien ne se perd (séance 1). L'azote qui n'est ni dans les légumes ni dans le sol est parti par l'une des trois sorties qui suivent.</p>

<h3>Le nitrate part avec l'eau qui descend</h3>
<p>Le nitrate est un anion, et la terre ne le retient presque pas (séance 3). Il suit l'eau. Quand il pleut plus que les plantes n'en boivent, l'eau en trop descend sous les racines et l'emporte vers la nappe. C'est le <span class="t" data-t="lessivage">lessivage</span>.</p>
<p>En France, ça se passe surtout de l'automne à la fin de l'hiver. Or c'est justement après les récoltes d'été qu'il reste du nitrate dans le sol, et la terre, encore chaude et humide en septembre et en octobre, continue d'en libérer. Une planche nue à l'automne, c'est du nitrate qui attend la pluie.</p>
<p>La parade, c'est de laisser une plante le prendre avant que l'eau l'emporte. Un engrais vert semé tôt à l'automne garde cet azote à l'abri dans ses feuilles, et d'après les essais de l'INRAE, il réduit nettement le nitrate qui part en profondeur. Dans ce rôle, on l'appelle une CIPAN, une culture intermédiaire piège à nitrate. S'il n'a pas de légumineuses, il rend peu de cet azote à la culture qui suit, mais l'azote reste dans ta terre et revient les années suivantes. Sous un tunnel, il ne pleut pas, et le nitrate ne part que si on arrose trop.</p>

<h3>Dans un sol gorgé d'eau, des bactéries respirent le nitrate</h3>
<p>Quand l'eau remplit tous les petits trous de la terre, l'oxygène vient à manquer. Certaines bactéries, qui respirent d'habitude de l'oxygène comme nous, se servent alors du nitrate à la place. Elles lui retirent ses oxygènes un à un, et l'azote finit en gaz, surtout du N₂ qui retourne dans l'air, et un peu de N₂O, le protoxyde d'azote. C'est la <span class="t" data-t="denitrification">dénitrification</span>.</p>
<div class="equation">NO₃⁻ → NO₂⁻ → NO → N₂O → N₂<small>Le nitrate perd ses oxygènes un à un et finit en gaz.</small></div>
<p>Ces bactéries se nourrissent de matière organique fraîche. Une planche gorgée d'eau et riche en nitrate, où l'on vient d'enfouir un engrais vert ou du fumier, leur convient parfaitement.</p>
<p>Le N₂ ne pose aucun problème, c'est l'azote de l'air. Le N₂O, si. D'après le dernier rapport du GIEC, ce gaz réchauffe environ 270 fois plus que le gaz carbonique, à masse égale et sur cent ans. Il abîme aussi la couche d'ozone, et en France, c'est l'agriculture qui en émet le plus. Il s'en forme davantage quand le sol est acide ou très chargé en nitrate.</p>

<h3>Laissé en surface, l'ammonium s'envole en ammoniac</h3>
<p>À la séance 1, on a vu que l'ammonium, NH₄⁺, c'est de l'ammoniac, NH₃, qui a attrapé un ion H⁺. Ça marche aussi dans l'autre sens. Quand quelque chose lui reprend son H⁺, l'ammonium redevient de l'ammoniac, un gaz qui s'envole. C'est la <span class="t" data-t="volatilisation">volatilisation</span>.</p>
<div class="equation">NH₄⁺ ⇄ NH₃ + H⁺<small>Quand le H⁺ est capté, l'ammoniac part dans l'air.</small></div>
<p>Ça arrive avec un produit riche en ammonium laissé en surface, comme un lisier, des fientes de volaille ou un fumier frais. Comme ces produits sont peu acides, ils perdent de l'ammoniac sur tous les sols. Les pertes sont plus fortes sur un sol calcaire, où le pH est élevé, et par temps chaud, sec et venteux. C'est pour ça qu'un fumier épandu sur une terre calcaire sent si fort l'ammoniac, comme annoncé à la séance 1.</p>
<p>D'après l'ADEME, un lisier laissé en surface perd en moyenne la moitié de son ammonium. Le remède est de l'enfouir dans les heures qui suivent, ou d'épandre juste avant une petite pluie. Une fois dans la terre, l'ammonium s'accroche à l'argile et à l'humus, et il s'envole beaucoup moins.</p>

<!-- Partie 4 -->
<h2><span class="partie-num">Partie 4 sur 4</span>Pourquoi le sang séché agit plus vite que le compost ?</h2>
<p>Tous les engrais organiques suivent le même chemin, de la matière organique à l'ammonium, puis au nitrate. Seule la vitesse change, et elle dépend de ce que les microbes y trouvent à manger.</p>

<h3>Un engrais riche en azote se minéralise vite</h3>
<p>Le sang séché, la farine de plume, les tourteaux ou le guano contiennent beaucoup d'azote pour peu de carbone. Leur rapport C/N est très bas. Les microbes qui les mangent trouvent bien plus d'azote qu'il ne leur en faut pour grandir, et ils rejettent vite le surplus en ammonium.</p>
<p>Sur une saison, de mars à octobre en conditions méditerranéennes, le sang séché libère environ 85 % de son azote, la farine de plume fine environ 80 %, le tourteau de ricin et la farine de plume en granulés environ les deux tiers. Il leur faut quelques semaines dans une terre tiède, beaucoup plus dans une terre froide, puisque ce sont toujours des microbes qui font le travail.</p>
<p>La farine de plume agit un peu moins vite que le sang séché, malgré un C/N aussi bas. Sa protéine, la kératine, est dure à digérer, et c'est la cuisson sous pression chez le fabricant qui la rend utilisable dans la saison.</p>

<h3>Un compost libère son azote sur plusieurs années</h3>
<p>Un compost, c'est l'inverse. Pendant le compostage, les microbes ont déjà mangé tout ce qui se mangeait facilement. Ce qui reste, c'est la partie dure, qui ressemble déjà à de l'<span class="t" data-t="humus">humus</span>, et son azote est pris dans des molécules que les microbes ont du mal à digérer. Les microbes du sol n'en libèrent qu'une petite part chaque année.</p>
<p>Un fumier pailleux se trouve entre les deux. La paille apporte beaucoup de carbone. Les microbes qui la mangent manquent d'azote, et ils commencent par prendre celui du sol. C'est la <span class="t" data-t="faim-azote">faim d'azote</span> de la séance 4. L'azote du fumier ne revient aux plantes qu'ensuite.</p>

<h3>Dans un bilan, on distingue l'azote efficace de l'arrière-effet</h3>
<p>Pour raisonner une fumure, on ne regarde donc pas l'azote total d'un engrais, mais la part qui sera minéralisée à temps pour la culture. On l'appelle l'<span class="t" data-t="azote-efficace">azote efficace</span>. Ce qui se libère l'année suivante s'appelle l'<span class="t" data-t="arriere-effet">arrière-effet</span>.</p>
<p>Prends 10 tonnes de compost de bovins par hectare. D'après les références de la FNAB, que reprend Ménort, ces 10 tonnes apportent 70 kg d'azote, dont 14 seulement seront efficaces la première année, soit un cinquième. Une autre petite part reviendra l'année suivante, en arrière-effet. Le reste rejoint la matière organique du sol, qui en relâchera un peu chaque année. C'est comme ça qu'un compost apporté régulièrement fait monter, au fil des ans, l'azote que le sol libère tout seul.</p>

<h3>Chaque engrais a son usage</h3>
<p>Le sang séché ou la farine de plume donnent un coup de pouce rapide à une culture qui manque d'azote, sur une terre assez tiède. Mais un azote rapide peut aussi se perdre, s'il arrive avant les racines. Le compost, lui, nourrit le sol plus que la culture de l'année.</p>
<p>Attention à un piège. Une ferme bio, où qu'elle soit, ne peut pas épandre plus de 170 kg d'azote venu d'effluents d'élevage par hectare et par an, en moyenne sur toute sa surface. Hors bio, c'est la même règle en zone vulnérable. Pour ce plafond, on prend l'azote total du fumier, de son compost et des fientes, même en bouchons, et pas leur azote efficace. Avec un compost de fumier à 7 kg d'azote par tonne, 25 tonnes par hectare sur toute la ferme font déjà 175 kg, alors que 35 seulement seront efficaces la première année.</p>

  <ul>

    <li>Les microbes changent l'azote de la matière organique en ammonium, puis deux groupes de bactéries le changent en nitrate. Cette nitrification acidifie le sol, et elle ralentit au froid, en sol acide ou sans air.</li>
